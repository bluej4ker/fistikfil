<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Fıstık Fil Fıstık Yer · Fıstık Fil</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Baloo 2 · SIL OFL 1.1 (assets/fonts/OFL-Baloo2.txt) */
      @font-face { font-family: "Baloo 2"; font-weight: 400 800; font-display: block; src: url("assets/fonts/Baloo2-wght.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #FFF4DC; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Baloo 2", sans-serif; font-weight: 800; color: #2B2D42; background: #FFF4DC; }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      #shake { position: absolute; inset: 0; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1300px; overflow: visible; }
      #charWrap { left: 0; top: 0; width: 600px; height: 640px; transform-origin: 0 0; }
      #char { position: absolute; inset: 0; overflow: visible; transform-origin: 300px 620px; }
      #char svg { width: 600px; height: 640px; overflow: visible; }
      .tl { left: 0; top: 0; font-size: 132px; line-height: 1; white-space: nowrap; -webkit-text-stroke: 14px #fff; paint-order: stroke fill; text-shadow: 0 8px 0 rgba(0,0,0,.14); transform-origin: 50% 100%; }
      .snd { left: 0; top: 0; font-size: 92px; line-height: 1; white-space: nowrap; -webkit-text-stroke: 14px #fff; paint-order: stroke fill; text-shadow: 0 8px 0 rgba(0,0,0,.14); transform-origin: 50% 60%; }
      .conf { width: 20px; height: 28px; border-radius: 5px; }
      .crumb { width: 16px; height: 12px; border-radius: 50%; background: #E8C07A; border: 3px solid #8A5A2B; }
      .fly { left: 0; top: 0; width: 200px; height: 200px; margin: -100px 0 0 -100px; overflow: visible; }
      #flyBox, #aval, #whip, #bigCherry, #cloth, #tap { inset: 0; pointer-events: none; }
      #aval { z-index: 42; } #whip { z-index: 41; opacity: 0; } #bigCherry { z-index: 43; } #cloth { z-index: 43; opacity: 0; }
      #flyBox { z-index: 46; } #tap { z-index: 47; }
      #cloth { background-color: #fff; background-image: linear-gradient(90deg, rgba(229,72,77,.55) 50%, transparent 50%), linear-gradient(rgba(229,72,77,.55) 50%, transparent 50%); background-size: 120px 120px; }
      #clothRoll { position: absolute; top: 0; width: 90px; height: 1080px; margin-left: -45px; border-radius: 45px; background: linear-gradient(90deg, #C72E35, #FF7A7E 45%, #C72E35); box-shadow: 0 0 30px rgba(0,0,0,.25); }
      #bug { left: 40px; top: 36px; padding: 6px 26px 0; border-radius: 30px; background: rgba(255,255,255,.92); font-size: 36px; color: #3D7DD8; z-index: 60; }
      #bug b { color: #F59E1B; }
      #lyric { left: 0; right: 0; top: 34px; height: 90px; display: flex; justify-content: center; z-index: 60; }
      .line { opacity: 0; position: absolute; top: 0; padding: 4px 40px 0; border-radius: 42px; background: rgba(255,255,255,.95); font-size: 58px; line-height: 80px; white-space: nowrap; color: #8A93A6; box-shadow: 0 6px 0 rgba(0,0,0,.08); }
      .line span { display: inline-block; margin: 0 11px; }
      #laBall { left: 0; top: 0; width: 70px; height: 40px; z-index: 61; opacity: 0; }
      .big { display: inline-block; font-size: 150px; line-height: 1; }
      .big span { display: inline-block; -webkit-text-stroke: 12px #fff; paint-order: stroke fill; text-shadow: 0 9px 0 rgba(0,0,0,.13); }
      #end { left: 580px; top: 0; width: 760px; height: 600px; transform-origin: 380px 0; opacity: 0; z-index: 55; }
      #end .rope { position: absolute; top: 0; width: 8px; height: 130px; background: #8B5A2B; border-radius: 4px; }
      #end .sign { position: absolute; left: 0; right: 0; top: 120px; padding: 30px 0 34px; text-align: center; background: #FFF4DC; border: 12px solid #B5763A; border-radius: 40px; box-shadow: 0 14px 0 rgba(60,30,0,.25); }
      .bye { margin-top: 8px; font-size: 62px; font-weight: 700; line-height: 1.3; color: #fff; display: inline-block; padding: 8px 40px 0; border-radius: 50px; background: #3D9BFF; }
      #flash { inset: 0; background: #fff; opacity: 0; z-index: 48; pointer-events: none; }
      #glow { inset: 0; background: radial-gradient(circle at 50% 55%, rgba(255,255,255,.55) 0, rgba(255,255,255,0) 60%); opacity: 0; mix-blend-mode: soft-light; z-index: 20; }
      #vignette { inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,30,60,.16) 100%); z-index: 22; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="/*DUR*/" data-width="1920" data-height="1080">
      <audio id="song" src="assets/song.mp3" data-start="0" data-duration="/*DUR*/" data-volume="1"></audio>
      <section id="world" class="clip" data-start="0" data-duration="/*DUR*/" data-track-index="0" data-layout-allow-overflow>
        <div id="cam" data-layout-allow-overflow>
          <div id="shake" data-layout-allow-overflow>
            <svg id="setKitchen" class="full" viewBox="0 0 1920 1300"></svg>
            <svg id="setPond" class="full" viewBox="0 0 1920 1300"></svg>
            <svg id="setCorn" class="full" viewBox="0 0 1920 1300"></svg>
            <svg id="setPicnic" class="full" viewBox="0 0 1920 1300"></svg>
            <svg id="backActors" class="full" viewBox="0 0 1920 1300"></svg>
            <div id="charWrap" class="abs"><div id="char"></div></div>
            <svg id="actors" class="full" viewBox="0 0 1920 1300"></svg>
            <svg id="front" class="full" viewBox="0 0 1920 1300"></svg>
            <div id="titleBox"></div>
            <svg id="fxSvg" class="full" viewBox="0 0 1920 1300"></svg>
            <div id="crumbBox"></div>
            <div id="sndBox"></div>
            <div id="confBox"></div>
          </div>
        </div>
        <div id="glow" class="abs"></div>
        <div id="vignette" class="abs"></div>
        <svg id="whip" class="abs" viewBox="0 0 1920 1080"></svg>
        <div id="aval" class="abs"></div>
        <svg id="bigCherry" class="abs" viewBox="0 0 1920 1080"></svg>
        <div id="cloth" class="abs"><div id="clothRoll"></div></div>
        <div id="flyBox" class="abs"></div>
        <svg id="tap" class="abs" viewBox="0 0 1920 1080"></svg>
        <div id="flash" class="abs"></div>
        <div id="bug" class="abs">Fıstık <b>Fil</b></div>
        <div id="lyric" class="abs"></div>
        <svg id="laBall" class="abs" viewBox="-40 -24 80 48"></svg>
        <div id="end" class="abs"><div class="rope" style="left:120px"></div><div class="rope" style="right:120px"></div>
          <div class="sign"><div class="big" id="endBig"></div><br/><div class="bye">Hoşça kal!</div></div></div>
      </section>
    </div>

    <script>
/*CAST*/
(function () {
  window.__timelines = window.__timelines || {};
  const $ = (s) => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const D = /*DUR*/, TAU = Math.PI * 2;
  const TC = ["#3D9BFF", "#FF5A5F", "#FFC23D", "#3FBF6F", "#A66BFF", "#FF7A3D"];
  const OL = "#4C76B5";
  const INK = "#2B2D42";
  const C = window.CAST;
  const LINES = /*LINES*/;
  const BEATS = /*BEATS*/;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (e0, e1, x) => { const k = clamp((x - e0) / (e1 - e0), 0, 1); return k * k * (3 - 2 * k); };
  const easeOut = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
  const easeIn = (x) => Math.pow(clamp(x, 0, 1), 3);
  const outBack = (x, s = 1.7) => { x = clamp(x, 0, 1); return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
  const lerp = (a, b, k) => a + (b - a) * k;
  const pIn = (t, t0, d) => clamp((t - t0) / d, 0, 1);
  const mixC = (c1, c2, k) => { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
    const r = Math.round(lerp(a >> 16, b >> 16, k)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, k)), bl = Math.round(lerp(a & 255, b & 255, k));
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1); };

/*RIG*/

  // ───────────────────────── tempo + lyric helpers ─────────────────────────
  function beatPos(t) {
    const n = BEATS.length;
    if (t <= BEATS[0]) return (t - BEATS[0]) / (BEATS[1] - BEATS[0]);
    if (t >= BEATS[n - 1]) return n - 1 + (t - BEATS[n - 1]) / (BEATS[n - 1] - BEATS[n - 2]);
    let lo = 0, hi = n - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (BEATS[m] <= t) lo = m; else hi = m; }
    return lo + (t - BEATS[lo]) / (BEATS[hi] - BEATS[lo]);
  }
  const BEAT = (BEATS[BEATS.length - 1] - BEATS[0]) / (BEATS.length - 1);
  const beatsIn = (a, b) => BEATS.filter((x) => x >= a && x <= b);
  const LT = {}; LINES.forEach((L, i) => (LT[L.tag] = i));
  const ts = (tag) => LINES[LT[tag]].words[0][1];
  const te = (tag) => LINES[LT[tag]].end;
  const words = (tag) => LINES[LT[tag]].words;
  const norm = (w) => w.replace("İ", "i").replace("I", "ı").toLowerCase().replace(/[^a-zçğıöşü]/g, "");
  const SOUND = { "kıtır": "crunch", "kıtırdık": "crunch", "vırak": "frog", "vır": "frog", "vak": "duck", "gurul": "rumble", "guruldar": "rumble", "hey": "all" };
  const SCOL = { crunch: "#C9772B", frog: "#3FA34D", duck: "#F59E1B", rumble: "#A66BFF", all: "#FF5A5F" };

  // ───────────────────────── key times ─────────────────────────
  const T = {
    jarIn: 3.9, pond: 32.1, throw: 31.55, corn: 59.8, picnic: 78.92, aval: 22.55, avalCut: 23.3, frogPop: 32.7,
    cherryBig: 58.9, clothIn: 78.0, night: 110.0, end: 127.6, la0: 118.9, la1: 127.4, seat: 106.9,
  };
  const scene = (t) => t < T.pond ? 0 : t < T.corn ? 1 : t < T.picnic ? 2 : 3;
  const RUMBLE = [[ts("k1.7"), te("k1.7") + 0.2, "fistik"], [ts("k2.7"), te("k2.7") + 0.2, "frog"], [ts("k3.7"), te("k3.7") + 0.2, "duck"], [ts("f.7"), te("f.7"), "all"]];
  const rumbleOf = (t, who) => { for (const [a, b, w] of RUMBLE) if (t >= a && t <= b && (w === who || w === "all")) return Math.min(1, (t - a) / 0.15, (b - t) / 0.2); return 0; };
  const CH = [["k1.5", "k1.8"], ["k2.5", "k2.8"], ["k3.5", "k3.8"], ["f.1", "f.8"]].map(([a, b]) => [ts(a) - 0.2, te(b) + 0.3]);
  const pulse = (t) => { if (!CH.some(([a, b]) => t >= a && t <= b)) return 0; const f = beatPos(t) % 1; return Math.exp(-7 * (f < 0 ? f + 1 : f)); };

  // ───────────────────────── layout (scene space 1920×1300) ─────────────────────────
  const S = 840;                                                     // pond water surface
  const KT = { x: 1000, y: 730 }, JAR = { x: 820, y: 712 }, CUP = { x: 1650, y: 905 };
  const LILY = 1250, TREE = { x: 1760, y: 840 }, BR = { x: 1690, y: 600 };
  const BRC = [[-60, 12], [-120, 26], [-180, 42], [-240, 60], [-300, 80]].map(([x, y]) => [BR.x + x, BR.y + y + 36]);
  const DUCK = { x: 1250, y: 1010, s: 1.35 }, SCARE = { x: 1660, y: 960 };
  const SEATS = { fistik: [640, 905, 0.6], frog: [1290, 905, 0.85], duck: [1540, 995, 0.92], sen: [960, 1135] };
  const PLATES = [{ x: 1120, y: 712, s: 0.72, kind: "tabak", face: "fistik" }, { x: 930, y: S + 6, s: 0.8, kind: "yaprak", face: "frog" },
    { x: 860, y: 1050, s: 0.78, kind: "sepet", face: "duck" }, { x: 960, y: 985, s: 0.85, kind: "ortu", face: "all" }];
  const slotPos = (k, side) => { const p = PLATES[k]; return [p.x + (side < 0 ? -80 : 80) * p.s, p.y + 4 * p.s]; };

  const mk = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const cloud = (x, y, s, c = "#fff") => `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><circle cx="80" cy="80" r="50"/><circle cx="150" cy="58" r="62"/><circle cx="222" cy="82" r="46"/><rect x="60" y="80" width="190" height="50" rx="25"/></g>`;
  const flower = (x, y, c, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 V40" stroke="#3E9B47" stroke-width="5"/>
      ${[0, 72, 144, 216, 288].map((a) => `<ellipse cx="0" cy="-14" rx="9" ry="14" fill="${c}" transform="rotate(${a})"/>`).join("")}<circle r="8" fill="#FFD84D"/></g>`;
  const tuft = (x, y, c = "#4FAE48") => `<path d="M${x - 16} ${y} q6 -26 10 0 q4 -34 10 0 q6 -24 12 0z" fill="${c}"/>`;
  const sun = (id) => `<g id="${id}"><g class="rays" fill="#FFD84D" opacity=".9">${Array.from({ length: 12 }, (_, i) => `<rect x="-6" y="-112" width="12" height="40" rx="6" transform="rotate(${i * 30})"/>`).join("")}</g>
      <circle r="66" fill="#FFD84D" stroke="#F5B921" stroke-width="5"/><ellipse cx="-19" cy="-7" rx="6" ry="8" fill="#9A5B1E"/><ellipse cx="19" cy="-7" rx="6" ry="8" fill="#9A5B1E"/>
      <ellipse cx="-33" cy="11" rx="11" ry="7" fill="#FF9F7A" opacity=".7"/><ellipse cx="33" cy="11" rx="11" ry="7" fill="#FF9F7A" opacity=".7"/><path d="M-17 13 Q0 29 17 13" stroke="#9A5B1E" stroke-width="5" fill="none" stroke-linecap="round"/></g>`;

  // ── jar with individually removable peanuts ──
  const jarDyn = (id) => `<g id="${id}"><rect x="-62" y="-170" width="124" height="166" rx="30" fill="rgba(200,235,255,.55)" stroke="#7FB2D9" stroke-width="5"/>
    ${Array.from({ length: 14 }, (_, i) => `<g id="${id}p${i}" transform="translate(${-36 + (i % 3) * 36 + (Math.floor(i / 3) % 2) * 10} ${-28 - Math.floor(i / 3) * 28}) rotate(${(i * 47) % 90 - 45}) scale(.6)">${C.peanut()}</g>`).join("")}
    <g id="${id}lid"><rect x="-70" y="-196" width="140" height="34" rx="12" fill="#E5484D" stroke="${INK}" stroke-width="4"/></g><rect x="-40" y="-120" width="80" height="44" rx="10" fill="#FFF4DC" stroke="#B5763A" stroke-width="3"/>
    <text x="0" y="-90" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="24" fill="#B5763A">FISTIK</text>
    <path d="M-44 -150 Q-48 -90 -40 -30" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" opacity=".6"/></g>`;

  // ───────────────────────── SET 1 · kitchen ─────────────────────────
  E("setKitchen").innerHTML = `<defs><linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1CF"/><stop offset="1" stop-color="#FFE2A8"/></linearGradient></defs>
    <rect x="-300" y="-400" width="2520" height="1400" fill="url(#gWall)"/>
    ${Array.from({ length: 26 }, (_, i) => `<circle cx="${-200 + (i * 173) % 2300}" cy="${60 + (i * 97) % 760}" r="7" fill="#FFD27A" opacity=".55"/>`).join("")}
    <rect x="-300" y="560" width="2520" height="22" fill="#F5C26B"/>
    ${Array.from({ length: 24 }, (_, i) => `<rect x="${-300 + i * 110}" y="582" width="106" height="${320}" fill="${i % 2 ? "#FFFFFF" : "#E8F4FF"}" stroke="#CFE3F7" stroke-width="3"/>`).join("")}
    <rect x="-300" y="900" width="2520" height="500" fill="#E9A866"/>${Array.from({ length: 22 }, (_, i) => `<path d="M${-300 + i * 120} 900 L${-700 + i * 170} 1400" stroke="#C98A4E" stroke-width="5"/>`).join("")}
    <rect x="-300" y="893" width="2520" height="14" fill="#B5763A"/>
    <g transform="translate(330 300) scale(.85)">${C.kWindow()}</g>
    <g id="clock" transform="translate(1650 200)"><circle r="78" fill="#fff" stroke="#3D9BFF" stroke-width="12"/>${Array.from({ length: 12 }, (_, i) => `<circle cx="${(58 * Math.sin(i * TAU / 12)).toFixed(1)}" cy="${(-58 * Math.cos(i * TAU / 12)).toFixed(1)}" r="5" fill="${INK}"/>`).join("")}
      <path id="clkM" d="M0 0 V-50" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><path id="clkH" d="M0 0 V-32" stroke="#E5484D" stroke-width="9" stroke-linecap="round"/><circle r="9" fill="${INK}"/></g>
    <g transform="translate(240 560)">${C.pot("#3FBF6F")}</g><g transform="translate(340 560) scale(.8)">${C.pot("#FF7A3D")}</g>
    <g transform="translate(${CUP.x} ${CUP.y})">${C.cupboard()}</g>
    <g transform="translate(${KT.x} ${KT.y})">${C.kTable()}</g>
    <g transform="translate(${JAR.x} ${JAR.y})">${jarDyn("jarK")}</g>`;

  // ───────────────────────── SET 2 · pond + cherry tree ─────────────────────────
  E("setPond").innerHTML = `<defs><linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CCBFF"/><stop offset=".6" stop-color="#C7EBFF"/><stop offset="1" stop-color="#FDE7F0"/></linearGradient>
      <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FD0F7"/><stop offset="1" stop-color="#2E8FD0"/></linearGradient></defs>
    <rect x="-300" y="-400" width="2520" height="2000" fill="url(#gSky)"/>
    <g id="pondClouds">${cloud(100, 90, 0.9) + cloud(900, 40, 0.7) + cloud(1400, 160, 0.55)}</g>
    <g transform="translate(260 170)">${sun("pondSun")}</g>
    <path d="M-300 700 Q240 600 600 680 T1300 650 T2220 690 V1500 H-300Z" fill="#F9C9DA"/>
    ${Array.from({ length: 9 }, (_, i) => `<g transform="translate(${-100 + i * 260} ${650 + (i % 2) * 20}) scale(.5)"><circle cx="0" cy="-60" r="70" fill="#FFB3CC" stroke="#F28AB0" stroke-width="5"/><rect x="-10" y="0" width="20" height="60" fill="#A0703F"/></g>`).join("")}
    <path d="M-300 760 Q320 720 700 760 T2220 770 V1500 H-300Z" fill="#94D474"/>
    <path d="M-300 900 Q200 870 680 880 Q720 840 700 ${S} L2220 ${S} L2220 1500 L-300 1500Z" fill="#6CC75A"/>
    <path d="M700 ${S} Q760 1000 900 1060 Q1400 1110 2220 1080 V1500 H700Z" fill="#B48558"/>
    <path id="water" fill="url(#gWater)" opacity=".92"/><path id="waterHi" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
    <path d="M1650 ${S - 10} Q1700 ${S - 40} 2220 ${S - 50} V1500 H1700 Q1680 1000 1650 ${S - 10}Z" fill="#6CC75A"/>
    ${[80, 220, 360, 520, 1720, 1860, 2000].map((x, i) => tuft(x, i < 4 ? 900 : S - 30)).join("")}
    ${[[120, 960, "#FF8FB1"], [300, 1010, "#fff"], [520, 970, "#B58CFF"], [1800, 880, "#FFD84D"]].map(([x, y, c]) => flower(x, y, c)).join("")}
    <g id="lilyG">${C.lily(1.25)}</g><g transform="translate(1560 ${S + 30})">${C.lily(0.7)}</g>
    <g id="treeG" transform="translate(${TREE.x} ${TREE.y})">${C.cherryTree()}</g>
    <g transform="translate(${BR.x} ${BR.y})">${C.branchLow()}</g>`;
  let rip = ""; for (let i = 0; i < 5; i++) rip += `<ellipse id="rp${i}" fill="none" stroke="#fff" stroke-width="4" rx="0" ry="0"/>`;
  E("setPond").insertAdjacentHTML("beforeend", rip);

  // ───────────────────────── SET 3 · corn field ─────────────────────────
  E("setCorn").innerHTML = `<defs><linearGradient id="gSky3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD3FF"/><stop offset=".7" stop-color="#E2F5FF"/><stop offset="1" stop-color="#FFF3C4"/></linearGradient></defs>
    <rect x="-300" y="-400" width="2520" height="2000" fill="url(#gSky3)"/>
    <g id="cornClouds">${cloud(200, 60, 0.8) + cloud(1200, 110, 0.65)}</g>
    <g transform="translate(1640 170)">${sun("cornSun")}</g>
    <path d="M-300 640 Q300 570 900 630 T2220 620 V1500 H-300Z" fill="#E8C766"/>
    <g id="cornBack">${Array.from({ length: 30 }, (_, i) => `<g class="cp" data-x="${-260 + i * 85}" data-y="${700 + (i % 3) * 14}" data-s="${0.55 + (i % 4) * 0.05}">${C.cornPlant(1)}</g>`).join("")}</g>
    <path d="M-300 820 Q400 790 960 815 T2220 800 V1500 H-300Z" fill="#F2D27A"/>
    <path d="M-300 900 Q600 860 1100 900 T2220 890 V1500 H-300Z" fill="#E3B65C"/>
    <path d="M600 1300 Q900 1000 1200 930 L1500 930 Q1300 1050 1300 1300Z" fill="#D9A05B" opacity=".6"/>
    <g id="scare" transform="translate(${SCARE.x} ${SCARE.y})">${C.scarecrow()}</g>
    <g transform="translate(${PLATES[2].x} ${PLATES[2].y + 30})">${C.basket()}</g>
