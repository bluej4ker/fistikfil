<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Fıstık Fil · /*TITLE*/</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Baloo 2 · SIL OFL 1.1 (assets/fonts/OFL-Baloo2.txt) */
      @font-face { font-family: "Baloo 2"; font-weight: 400 800; font-display: block; src: url("assets/fonts/Baloo2-wght.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Baloo 2", sans-serif; font-weight: 800; }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      /* bant: rozet merkezi (190, 920) */
      #pill { left: 150px; top: 835px; width: 760px; height: 170px; border-radius: 85px; background: #fff; border: 10px solid #2B5FB0;
              box-shadow: 0 10px 0 rgba(20, 40, 90, .35); transform-origin: 40px 85px; }
      #pin { position: absolute; inset: 0; overflow: hidden; border-radius: 75px; }
      #name { left: 180px; top: 10px; font-size: 52px; line-height: 1.1; letter-spacing: 1px; white-space: nowrap; }
      #name .a { color: #3D9BFF; } #name .b { color: #FF7A3D; }
      #btn { left: 172px; top: 70px; width: 410px; height: 74px; border-radius: 22px; background: #E5484D; box-shadow: 0 6px 0 #B3262B; transform-origin: 205px 37px; }
      #btn div { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; white-space: nowrap; padding-top: 6px; }
      #bt1 { font-size: 64px; } #bt2 { font-size: 46px; gap: 10px; }
      #bell { left: 612px; top: 22px; width: 110px; height: 110px; transform-origin: 55px 14px; }
      #badge { left: 60px; top: 790px; width: 260px; height: 260px; transform-origin: 130px 130px; }
      #badge > svg { position: absolute; inset: 0; width: 260px; height: 260px; overflow: visible; }
      #win { position: absolute; inset: 0; clip-path: circle(94px at 130px 130px); }
      #charWrap { left: 0; top: 0; width: 600px; height: 640px; transform-origin: 0 0; }
      #char { position: absolute; inset: 0; overflow: visible; }
      #char svg { width: 600px; height: 640px; overflow: visible; }
      #hand { left: 0; top: 0; width: 120px; height: 160px; transform-origin: 30px 6px; filter: drop-shadow(0 8px 4px rgba(0,0,0,.3)); }
      #fx { inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="/*DUR*/" data-width="1920" data-height="1080">
      <section id="world" class="clip" data-start="0" data-duration="/*DUR*/" data-track-index="0" data-layout-allow-overflow>
        <div id="pill" class="abs"><div id="pin">
          <div id="name" class="abs"><span class="a">FISTIK</span> <span class="b">FİL</span></div>
          <div id="btn" class="abs"><div id="bt1">ABONE OL</div><div id="bt2">ABONE OLUNDU <svg width="44" height="44" viewBox="0 0 40 40"><path d="M7 21 L16 30 L33 10" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
          <svg id="bell" class="abs" viewBox="0 0 110 110"><g id="waves" fill="none" stroke="#FFB627" stroke-width="6" stroke-linecap="round"><path d="M16 30 Q6 50 16 70"/><path d="M94 30 Q104 50 94 70"/></g>
            <path d="M55 16 C35 16 27 34 27 52 L27 68 L17 80 L93 80 L83 68 L83 52 C83 34 75 16 55 16Z" fill="#FFD84D" stroke="#2B5FB0" stroke-width="7" stroke-linejoin="round"/><circle cx="55" cy="90" r="9" fill="#FFD84D" stroke="#2B5FB0" stroke-width="6"/><circle cx="55" cy="12" r="6" fill="#2B5FB0"/></svg>
        </div></div>
        <div id="badge" class="abs">
          <svg viewBox="0 0 260 260"><defs><radialGradient id="gSky" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#BDE6FF"/><stop offset="1" stop-color="#5AAEF5"/></radialGradient>
            <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE07A"/><stop offset=".5" stop-color="#FFB627"/><stop offset="1" stop-color="#F08A0C"/></linearGradient></defs>
            <circle cx="130" cy="130" r="122" fill="#2B5FB0"/><circle cx="130" cy="130" r="112" fill="url(#gGold)"/><circle cx="130" cy="130" r="97" fill="#fff"/><circle cx="130" cy="130" r="94" fill="url(#gSky)"/></svg>
          <div id="win"><div id="charWrap" class="abs"><div id="char"></div></div></div>
          <svg viewBox="0 0 260 260"><path d="M62 86 A80 80 0 0 1 120 46" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" opacity=".7"/></svg>
        </div>
        <div id="fx" class="abs"></div>
        <svg id="hand" class="abs" viewBox="0 0 120 160"><g fill="#fff" stroke="#2B2D42" stroke-width="6" stroke-linejoin="round">
          <path d="M14 76 Q2 70 6 92 L18 118 Q30 150 64 152 Q104 152 108 116 L108 82 Q108 70 96 70 Q88 70 86 78 Q84 64 72 64 Q62 64 60 74 Q58 60 46 60 L46 18 Q46 4 30 4 Q16 4 16 18 L16 96 Z"/>
          <path d="M46 60 L46 92 M60 74 L60 94 M86 78 L86 98" fill="none" stroke-width="5" stroke-linecap="round"/></g></svg>
      </section>
    </div>

    <script>
(function () {
  window.__timelines = window.__timelines || {};
  const $ = (s) => document.querySelector(s);
  const E = (id) => document.getElementById(id);
  const D = /*DUR*/, BEAT = 0.5, TAU = Math.PI * 2;
  const OL = "#4C76B5";
  const TC = ["#3D9BFF", "#FF5A5F", "#FFC23D", "#3FBF6F", "#A66BFF", "#FF7A3D"];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const CLICKS = [[1.45, 160 + 172 + 205, 845 + 70 + 37], [2.4, 160 + 612 + 55, 845 + 22 + 55]];   // [t, x, y] (ekran)
/*RIG*/

  let fxh = "";
  for (let i = 0; i < 2; i++) fxh += `<div class="abs" id="rp${i}" style="opacity:0;width:200px;height:200px;border-radius:50%;border:10px solid #fff"></div>`;
  for (let i = 0; i < 24; i++) fxh += `<div class="abs" id="cf${i}" style="opacity:0;width:16px;height:22px;border-radius:5px;background:${TC[i % 6]}"></div>`;
  E("fx").innerHTML = fxh;

  const R = { A: 88, C: -140, L: 22, mouth: 0.1, blink: 0, lookX: 0, lookY: 0, earAmp: 1 };
  const POSE = { rest: [88, -140, 22], trumpet: [25, -110, 28], kick: [18, -112, 29.5] };
  const ST = { badge: 0, pill: 0, hx: 1150, hy: 1180, hs: 1, btn: 1, done: 0 };
  const FS = 0.5;

  function render(t) {
    const beatPh = TAU * t / BEAT;
    // rozet + bant
    E("badge").style.transform = `scale(${ST.badge.toFixed(4)}) rotate(${((1 - ST.badge) * -90).toFixed(2)}deg)`;
    const p = clamp(ST.pill, 0, 1);
    E("pill").style.clipPath = `inset(-30px ${((1 - p) * 100).toFixed(2)}% -30px -30px round 85px)`;
    E("pill").style.opacity = p > 0.001 ? 1 : 0;
    E("btn").style.transform = `scale(${ST.btn.toFixed(4)})`;
    E("btn").style.background = ST.done > 0.5 ? "#8E97AB" : "#E5484D";
    E("btn").style.boxShadow = ST.done > 0.5 ? "0 6px 0 #646C80" : "0 6px 0 #B3262B";
    E("bt1").style.opacity = (1 - ST.done).toFixed(3); E("bt2").style.opacity = ST.done.toFixed(3);
    const bu = t - 2.45, ring = bu > 0 ? 22 * Math.sin(bu * 22) * Math.exp(-bu * 2.2) : 0;
    E("bell").style.transform = `rotate(${ring.toFixed(2)}deg)`;
    E("waves").setAttribute("opacity", (bu > 0 && bu < 1.4 ? Math.abs(Math.sin(bu * 11)) * (1 - bu / 1.4) : 0).toFixed(3));
    // Fıstık
    el.rig.setAttribute("transform", `translate(0 ${(-4 * (1 - Math.cos(beatPh)) / 2).toFixed(2)})`);
    const ea = R.earAmp * 6 * Math.sin(beatPh);
    el.earL.setAttribute("transform", `rotate(${(-ea).toFixed(2)} 222 230)`);
    el.earR.setAttribute("transform", `translate(600 0) scale(-1 1) rotate(${(-ea).toFixed(2)} 222 230)`);
    el.pom.setAttribute("transform", `rotate(${(12 * Math.sin(beatPh - 0.8)).toFixed(2)} 300 100)`);
    el.head.setAttribute("transform", `rotate(${(4 * Math.sin(beatPh / 2)).toFixed(2)} 300 360)`);
    el.legs.forEach((g, i) => { const [px, py] = LEGP[i]; g.setAttribute("transform", `translate(${px} ${py})`); });
    el.pupils.setAttribute("transform", `translate(${R.lookX.toFixed(1)} ${R.lookY.toFixed(1)})`);
    const lid = clamp(R.blink, 0, 1) * 92; el.lidL.setAttribute("height", lid.toFixed(1)); el.lidR.setAttribute("height", lid.toFixed(1));
    const m = Math.max(0, R.mouth), my = 334, md = `M224 ${my} Q250 ${my + 12} 276 ${my - 2} Q252 ${(my + 8 + 46 * m).toFixed(1)} 224 ${my} Z`;
    el.mouth.setAttribute("d", md); el.mclip.setAttribute("d", md); el.mouth.setAttribute("fill", m > 0.04 ? "#8C2F45" : "none");
    el.tongue.setAttribute("ry", (m > 0.15 ? 12 * m : 0).toFixed(1)); el.tongue.setAttribute("cy", (my + 6 + 24 * m).toFixed(1));
    drawTrunk(R.A + 3 * Math.sin(t * 2.3), R.C, R.L);
    E("charWrap").style.transform = `translate(${(130 - 300 * FS).toFixed(1)}px, ${(150 - 236 * FS).toFixed(1)}px) scale(${FS})`;
    // el imleci
    E("hand").style.transform = `translate(${(ST.hx - 30).toFixed(1)}px, ${(ST.hy - 6).toFixed(1)}px) rotate(-12deg) scale(${ST.hs.toFixed(4)})`;
    // tıklama dalgası + mini konfeti
    CLICKS.forEach(([c, x, y], i) => { const u = (t - c) / 0.5, r = E("rp" + i);
      if (u < 0 || u > 1) { r.style.opacity = 0; return; }
      r.style.transform = `translate(${x - 100}px, ${y - 100}px) scale(${(0.2 + 0.9 * u).toFixed(3)})`; r.style.opacity = (0.9 * (1 - u)).toFixed(3); });
    const cu = t - CLICKS[0][0];
    for (let i = 0; i < 24; i++) { const c = E("cf" + i);
      if (cu < 0 || cu > 1.2) { c.style.opacity = 0; continue; }
      const a = -Math.PI / 2 + (i / 24 - 0.5) * 2.6, v = 420 + (i % 5) * 70;
      c.style.transform = `translate(${(CLICKS[0][1] + Math.cos(a) * v * cu).toFixed(1)}px, ${(CLICKS[0][2] + Math.sin(a) * v * cu + 700 * cu * cu).toFixed(1)}px) rotate(${(cu * 700 + i * 40).toFixed(0)}deg)`;
      c.style.opacity = (cu < 0.8 ? 1 : 1 - (cu - 0.8) / 0.4).toFixed(3); }
  }

  gsap.defaults({ lazy: false });
  const tl = gsap.timeline({ paused: true });
  const blink = (t) => { tl.to(R, { blink: 1, duration: 0.07 }, t); tl.to(R, { blink: 0, duration: 0.09 }, t + 0.1); };
  const press = (t) => { tl.to(ST, { hs: 0.82, duration: 0.07 }, t - 0.05); tl.to(ST, { hs: 1, duration: 0.15, ease: "back.out(3)" }, t + 0.06); };
  tl.to(ST, { badge: 1, duration: 0.5, ease: "back.out(2)" }, 0.0);
  tl.to(ST, { pill: 1, duration: 0.45, ease: "power3.out" }, 0.25);
  tl.to(ST, { hx: CLICKS[0][1] + 20, hy: CLICKS[0][2] + 10, duration: 0.6, ease: "power2.out" }, 0.7);
  press(CLICKS[0][0]);
  tl.to(ST, { btn: 0.9, duration: 0.07 }, CLICKS[0][0] - 0.05); tl.to(ST, { btn: 1, duration: 0.25, ease: "back.out(3)" }, CLICKS[0][0] + 0.06);
  tl.to(ST, { done: 1, duration: 0.15 }, CLICKS[0][0] + 0.05);
  tl.to(R, { mouth: 0.8, earAmp: 2.6, A: POSE.trumpet[0], C: POSE.trumpet[1], L: POSE.trumpet[2], duration: 0.2, ease: "back.out(2)" }, CLICKS[0][0] + 0.05);
  tl.to(ST, { hx: CLICKS[1][1] + 10, hy: CLICKS[1][2] + 20, duration: 0.45, ease: "power2.inOut" }, 1.8);
  press(CLICKS[1][0]);
  tl.to(R, { A: POSE.kick[0], C: POSE.kick[1], L: POSE.kick[2], duration: 0.06 }, 2.42); tl.to(R, { A: POSE.trumpet[0], C: POSE.trumpet[1], L: POSE.trumpet[2], duration: 0.2 }, 2.5);
  tl.to(R, { mouth: 0.15, earAmp: 1, A: POSE.rest[0], C: POSE.rest[1], L: POSE.rest[2], duration: 0.4, ease: "power2.inOut" }, 3.1);
  blink(0.9); blink(3.4);
  tl.to(ST, { hx: 1150, hy: 1200, duration: 0.45, ease: "power2.in" }, 3.15);
  tl.to(ST, { pill: 0, duration: 0.3, ease: "power2.in" }, 3.95);
  tl.to(ST, { badge: 0, duration: 0.3, ease: "back.in(2)" }, 4.15);

  const master = gsap.timeline({ paused: true });
  const clock = { _t: 0 };
  Object.defineProperty(clock, "t", { get() { return this._t; }, set(v) { this._t = v; render(v); } });
  tl.paused(false); master.add(tl, 0);
  master.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", immediateRender: false }, 0);
  window.addEventListener("hf-seek", (e) => render(e && e.detail ? e.detail.time : master.time()));
  render(0);
  window.__timelines["main"] = master;
})();
    </script>
  </body>
</html>
