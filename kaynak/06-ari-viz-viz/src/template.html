<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Arı Vız Vız · Fıstık Fil</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Baloo 2 · SIL OFL 1.1 (assets/fonts/OFL-Baloo2.txt) */
      @font-face { font-family: "Baloo 2"; font-weight: 400 800; font-display: block; src: url("assets/fonts/Baloo2-wght.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #FFE9A8; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Baloo 2", sans-serif; font-weight: 800; color: #2B2D42; background: #FFE9A8; }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      #shake { position: absolute; inset: 0; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1300px; overflow: visible; }
      #charWrap { left: 0; top: 0; width: 600px; height: 640px; transform-origin: 0 0; }
      #char { position: absolute; inset: 0; overflow: visible; transform-origin: 300px 620px; }
      #char svg { width: 600px; height: 640px; overflow: visible; }
      .snd { left: 0; top: 0; font-size: 92px; line-height: 1; white-space: nowrap; -webkit-text-stroke: 14px #fff; paint-order: stroke fill; text-shadow: 0 8px 0 rgba(0,0,0,.14); transform-origin: 50% 60%; }
      .conf { width: 26px; height: 30px; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
      .crumb { width: 14px; height: 14px; border-radius: 50%; background: #FFE45C; border: 3px solid #E0A800; }
      .ov { inset: 0; pointer-events: none; }
      #bug { left: 40px; top: 36px; padding: 6px 26px 0; border-radius: 30px; background: rgba(255,255,255,.95); font-size: 36px; color: #3D7DD8; z-index: 60; box-shadow: 0 4px 0 rgba(0,0,0,.1); }
      #bug b { color: #F59E1B; }
      #lyric { left: 0; right: 0; top: 34px; height: 90px; display: flex; justify-content: center; z-index: 60; }
      .line { opacity: 0; position: absolute; top: 0; padding: 4px 40px 0; border-radius: 42px; background: #fff; font-size: 60px; line-height: 82px; white-space: nowrap; color: #8A93A6; box-shadow: 0 6px 0 rgba(0,0,0,.1); border: 4px solid #FFD43B; }
      .line span { display: inline-block; margin: 0 11px; }
      .big { display: inline-block; font-size: 150px; line-height: 1; }
      .big span { display: inline-block; -webkit-text-stroke: 12px #fff; paint-order: stroke fill; text-shadow: 0 9px 0 rgba(0,0,0,.13); }
      #end { left: 0; top: 0; width: 760px; height: 420px; opacity: 0; z-index: 55; }
      #end .rope { position: absolute; top: 0; width: 8px; height: 110px; background: #3B2A1F; border-radius: 4px; }
      #end .sign { position: absolute; left: 0; right: 0; top: 100px; padding: 30px 0 34px; text-align: center; background: #FFF4DC; border: 12px solid #D9891A; border-radius: 40px; box-shadow: 0 14px 0 rgba(60,30,0,.25); }
      .bye { margin-top: 8px; font-size: 62px; font-weight: 700; line-height: 1.3; color: #fff; display: inline-block; padding: 8px 40px 0; border-radius: 50px; background: #3D9BFF; }
      #flash { inset: 0; background: #fff; opacity: 0; z-index: 48; pointer-events: none; }
      #glow { inset: 0; background: radial-gradient(circle at 50% 55%, rgba(255,255,255,.5) 0, rgba(255,255,255,0) 60%); opacity: 0; mix-blend-mode: soft-light; z-index: 20; pointer-events: none; }
      #hapsu { left: 0; top: 0; font-size: 210px; line-height: 1; color: #FFC21A; -webkit-text-stroke: 18px #fff; paint-order: stroke fill; text-shadow: 0 12px 0 rgba(0,0,0,.18); opacity: 0; z-index: 47; white-space: nowrap; }
      #panels { z-index: 45; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="/*DUR*/" data-width="1920" data-height="1080">
      <audio id="song" src="assets/song.m4a" data-start="0" data-duration="/*DUR*/" data-volume="1"></audio>
      <section id="world" class="clip" data-start="0" data-duration="/*DUR*/" data-track-index="0" data-layout-allow-overflow>
        <div id="cam" data-layout-allow-overflow>
          <div id="shake" data-layout-allow-overflow>
            <svg id="setHive" class="full" viewBox="0 0 1920 1300"></svg>
            <svg id="setPoppy" class="full" viewBox="0 0 1920 1300"></svg>
            <svg id="setSun" class="full" viewBox="0 0 1920 1300"></svg>
            <svg id="setLav" class="full" viewBox="0 0 1920 1300"></svg>
            <svg id="setParty" class="full" viewBox="0 0 1920 1300"></svg>
            <svg id="backActors" class="full" viewBox="0 0 1920 1300"><ellipse id="fShadow" rx="120" ry="26" fill="url(#gShadow)"/></svg>
            <div id="charWrap" class="abs"><div id="char"></div></div>
            <svg id="actors" class="full" viewBox="0 0 1920 1300"></svg>
            <svg id="fxSvg" class="full" viewBox="0 0 1920 1300"></svg>
            <div id="crumbBox"></div>
            <div id="sndBox"></div>
            <div id="confBox"></div>
          </div>
        </div>
        <div id="glow" class="abs"></div>
        <svg id="pollenOv" class="abs ov" viewBox="0 0 1920 1080" style="z-index:44"></svg>
        <div id="hapsu" class="abs">HAPŞU!</div>
        <svg id="mapOv" class="abs ov" viewBox="0 0 1920 1080" style="z-index:43;opacity:0"></svg>
        <svg id="panels" class="abs ov" viewBox="0 0 1920 1080" style="opacity:0"></svg>
        <svg id="hexWipe" class="abs ov" viewBox="0 0 1920 1080" style="z-index:49"></svg>
        <svg id="comb" class="abs" viewBox="0 0 300 130" style="left:1590px;top:24px;width:300px;height:130px;z-index:58;opacity:0;overflow:visible"></svg>
        <div id="flash" class="abs"></div>
        <div id="bug" class="abs">Fıstık <b>Fil</b></div>
        <div id="lyric" class="abs"></div>
        <div id="end" class="abs"><div class="rope" style="left:150px"></div><div class="rope" style="right:150px"></div>
          <div class="sign"><div class="big" id="endBig"></div><br/><div class="bye">Hoşça kal!</div></div></div>
      </section>
    </div>

    <script>
/*CAST*/
(function () {
  window.__timelines = window.__timelines || {};
  const $ = (s) => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const D = /*DUR*/, TAU = Math.PI * 2;
  const TC = ["#3D9BFF", "#FF5A5F", "#FFC23D", "#3FBF6F", "#A66BFF", "#FF7A3D"];
  const OL = "#4C76B5";
  const INK = "#2B2D42";
  const C = window.CAST;
  const LINES = /*LINES*/;
  const BEATS = /*BEATS*/;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (e0, e1, x) => { const k = clamp((x - e0) / (e1 - e0), 0, 1); return k * k * (3 - 2 * k); };
  const easeOut = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
  const easeIn = (x) => Math.pow(clamp(x, 0, 1), 3);
  const outBack = (x, s = 1.7) => { x = clamp(x, 0, 1); return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
  const lerp = (a, b, k) => a + (b - a) * k;
  const pIn = (t, t0, d) => clamp((t - t0) / d, 0, 1);

/*RIG*/

  // ───────────────────────── tempo + lyric helpers ─────────────────────────
  function beatPos(t) {
    const n = BEATS.length;
    if (t <= BEATS[0]) return (t - BEATS[0]) / (BEATS[1] - BEATS[0]);
    if (t >= BEATS[n - 1]) return n - 1 + (t - BEATS[n - 1]) / (BEATS[n - 1] - BEATS[n - 2]);
    let lo = 0, hi = n - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (BEATS[m] <= t) lo = m; else hi = m; }
    return lo + (t - BEATS[lo]) / (BEATS[hi] - BEATS[lo]);
  }
  const BEAT = (BEATS[BEATS.length - 1] - BEATS[0]) / (BEATS.length - 1);
  const beatsIn = (a, b) => BEATS.filter((x) => x >= a && x <= b);
  const LT = {}; LINES.forEach((L, i) => (LT[L.tag] = i));
  const ts = (tag) => LINES[LT[tag]].words[0][1];
  const te = (tag) => LINES[LT[tag]].end;
  const words = (tag) => LINES[LT[tag]].words;
  const norm = (w) => w.replace("İ", "i").replace("I", "ı").toLowerCase().replace(/[^a-zçğıöşü]/g, "");
  const SOUND = { "vız": "bee", "vızır": "bee", "vızıldar": "bee", "bal": "honey" };
  const SCOL = { bee: "#F5A800", honey: "#E07B0C" };

  // ───────────────────────── key times + scenes ─────────────────────────
  const T = { door: 7.6, poppy: 9.1, sun: 38.75, lav: 72.4, party: 89.95, sneeze: 47.05, fly0: 56.2, fall: 60.7, wag0: 64.4, wag1: 71.2,
    map0: 79.0, map1: 81.5, wipe: 89.25, pan0: 98.2, pan1: 111.0, end: 115.9 };
  const scene = (t) => t < T.poppy ? 0 : t < T.sun ? 1 : t < T.lav ? 2 : t < T.party ? 3 : 4;
  const SETS = ["setHive", "setPoppy", "setSun", "setLav", "setParty"];

  // ───────────────────────── layout (scene space 1920×1300) ─────────────────────────
  const POP = [[780, 1010, 380, 0.95], [1150, 1010, 470, 1.0], [1560, 1010, 350, 0.9]];       // x, y, stem h, scale
  const SFL = [[880, 1020, 470, 0.95], [1240, 1020, 520, 1.0]];
  const POND = { x: 1660, y: 935 };
  const PURP = { x: 1120, y: 1020, h: 400 };
  const TREE = { x: 1000, y: 1010 }, HIVE = { x: 1300, y: 575 }, POTP = { x: 1300, y: 1065 };
  const SEAT = { fistik: [540, 1010, 0.62], mouse: [800, 1022, 0.95], duckling: [1060, 1022, 0.66], frog: [1560, 1022, 0.82], duck: [1770, 1032, 0.86] };
  const headPos = (P, i) => [P[i][0], P[i][1] - P[i][2] * P[i][3]];
  const TONGUE = ts("k2.8") + 0.95, CATCH = [POND.x - 70, POND.y - 210];          // the frog catches the honey drop here

  const mk = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const cloud = (x, y, s, c = "#fff") => `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><circle cx="80" cy="80" r="50"/><circle cx="150" cy="58" r="62"/><circle cx="222" cy="82" r="46"/><rect x="60" y="80" width="190" height="50" rx="25"/></g>`;
  const sunFace = (id) => `<g id="${id}"><g class="rays" fill="#FFD84D">${Array.from({ length: 12 }, (_, i) => `<rect x="-7" y="-118" width="14" height="42" rx="7" transform="rotate(${i * 30})"/>`).join("")}</g>
      <circle r="70" fill="#FFD84D" stroke="#F5B921" stroke-width="6"/><ellipse cx="-20" cy="-8" rx="7" ry="9" fill="#9A5B1E"/><ellipse cx="20" cy="-8" rx="7" ry="9" fill="#9A5B1E"/>
      <ellipse cx="-36" cy="12" rx="12" ry="7" fill="#FF9F7A" opacity=".75"/><ellipse cx="36" cy="12" rx="12" ry="7" fill="#FF9F7A" opacity=".75"/><path d="M-18 14 Q0 32 18 14" stroke="#9A5B1E" stroke-width="6" fill="none" stroke-linecap="round"/></g>`;
  const tuft = (x, y, c = "#4FAE48") => `<path d="M${x - 18} ${y} q7 -30 11 0 q5 -38 11 0 q7 -28 14 0z" fill="${c}"/>`;
  const groundSet = (top, c1, c2) => `<path d="M-300 ${top} Q500 ${top - 40} 1000 ${top - 10} T2220 ${top} V1600 H-300Z" fill="${c1}"/><path d="M-300 ${top + 120} Q600 ${top + 90} 1200 ${top + 110} T2220 ${top + 105} V1600 H-300Z" fill="${c2}"/>`;
  const sky = (id, a, b, c) => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".6" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient></defs><rect x="-300" y="-400" width="2520" height="2100" fill="url(#${id})"/>`;

  // ── SET 0 · hive interior (honeycomb wall) ──
  { let cells = ""; const r = 74, w = r * Math.sqrt(3);
    for (let row = -1; row < 12; row++) for (let col = -1; col < 15; col++) { const x = col * w + (row % 2 ? w / 2 : 0), y = row * r * 1.5;
      if (Math.hypot(x - 960, y - 610) < 120) continue;
      const k = (row * 7 + col * 13) % 9, fill = k < 3 ? "url(#gHoney)" : k < 5 ? "#FFE7A0" : "#F6C55A";
      cells += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><path d="${C.hexPath(r - 4)}" fill="${fill}" stroke="#C47A12" stroke-width="7"/>${k < 3 ? `<ellipse cx="-18" cy="-20" rx="16" ry="9" fill="#fff" opacity=".45" transform="rotate(-25 -18 -20)"/>` : ""}</g>`; }
    E("setHive").innerHTML = `<rect x="-300" y="-400" width="2520" height="2100" fill="#E9A53A"/>${cells}
      <g transform="translate(960 610)"><path d="${C.hexPath(150)}" fill="#7A4A12" stroke="#C47A12" stroke-width="10"/><path d="${C.hexPath(130)}" fill="#5A3408"/></g>
      <g id="door" transform="translate(960 150)"><path d="${C.hexPath(120)}" fill="#BFE9FF" stroke="#C47A12" stroke-width="12"/><circle cx="40" cy="-20" r="30" fill="#FFF3B0"/><path d="M-100 50 Q-20 0 100 40 L100 70 L-100 70Z" fill="#8CD46A"/></g>
      <g id="zzz" font-family="Baloo 2" font-weight="800" fill="#fff" stroke="#C47A12" stroke-width="5" paint-order="stroke">${[0, 1, 2].map((i) => `<text id="zz${i}" font-size="${60 + i * 16}" opacity="0">Z</text>`).join("")}</g>`; }

  // ── SET 1 · red poppies ──
  E("setPoppy").innerHTML = sky("gSk1", "#6EC3FF", "#B9E6FF", "#F2FBFF") + `<g id="cl1">${cloud(140, 120, 0.8) + cloud(1300, 70, 0.6) + cloud(800, 200, 0.45)}</g>
    <g transform="translate(1680 180)">${sunFace("sun1")}</g>
    <path d="M-300 760 Q300 680 900 740 T2220 720 V1600 H-300Z" fill="#CFEFB4"/>
    ${Array.from({ length: 16 }, (_, i) => `<g transform="translate(${-150 + i * 140} ${770 + (i % 3) * 12}) scale(.28)">${C.poppy(260)}</g>`).join("")}
    ${groundSet(900, "#8FD46E", "#79C25A")}
    ${[60, 220, 1880, 1980, 360, 1720].map((x, i) => tuft(x, 960 + (i % 3) * 30)).join("")}
    ${POP.map(([x, y, h, s], i) => `<g id="pp${i}" transform="translate(${x} ${y})">${C.poppy(h, s)}</g>`).join("")}`;

  // ── SET 2 · sunflowers + frog pond ──
  E("setSun").innerHTML = sky("gSk2", "#79CCFF", "#C6EDFF", "#FFF6D6") + `<g id="cl2">${cloud(200, 90, 0.7) + cloud(1100, 140, 0.55)}</g>
    <path d="M-300 740 Q400 660 1000 720 T2220 700 V1600 H-300Z" fill="#E6F3B8"/>
    ${Array.from({ length: 14 }, (_, i) => `<g class="sfb" data-x="${-120 + i * 160}" data-y="${790 + (i % 2) * 18}">${C.sunflower("sb" + i, 300, 0.36)}</g>`).join("")}
    ${groundSet(905, "#93D673", "#7FC860")}
    <ellipse cx="${POND.x}" cy="${POND.y + 20}" rx="300" ry="70" fill="#5CC2F0" stroke="#3A9AD0" stroke-width="7"/><ellipse cx="${POND.x - 60}" cy="${POND.y + 8}" rx="160" ry="22" fill="#B9EAFF" opacity=".6"/>
    <g id="lily6" transform="translate(${POND.x} ${POND.y + 14})">${C.lily(1.2)}</g>
    ${SFL.map(([x, y, h, s], i) => `<g id="sf${i}" transform="translate(${x} ${y})">${C.sunflower("sf" + i, h, s)}</g>`).join("")}`;

  // ── SET 3 · lavender at golden hour ──
  { let lav = ""; for (let i = 0; i < 70; i++) { const x = -200 + (i * 37) % 2320, y = 880 + (i * 53) % 260, h = 150 + (i * 29) % 90; lav += `<g class="lv" data-x="${x}" data-y="${y}" data-i="${i}">${C.lavender(h)}</g>`; }
    E("setLav").innerHTML = sky("gSk3", "#FFB3A8", "#FFD6B0", "#FFF1D6") + `<g id="cl3">${cloud(160, 110, 0.7, "#FFF6F0") + cloud(1250, 70, 0.55, "#FFF6F0")}</g>
      <g transform="translate(300 260)">${sunFace("sun3")}</g>
      <path d="M-300 760 Q400 690 1000 740 T2220 720 V1600 H-300Z" fill="#D9C2F0"/>
      ${groundSet(880, "#B99AE6", "#A584DC")}
      ${lav}<g id="purpG" transform="translate(${PURP.x} ${PURP.y})">${C.purple(PURP.h)}</g>`; }

  // ── SET 4 · honey party under the oak ──
  E("setParty").innerHTML = sky("gSk4", "#7CCBFF", "#C8EEFF", "#FFF4D6") + `<g id="cl4">${cloud(120, 80, 0.7) + cloud(1450, 120, 0.6)}</g>
    <g transform="translate(260 200)">${sunFace("sun4")}</g>
    <path d="M-300 760 Q300 690 900 740 T2220 720 V1600 H-300Z" fill="#CDEFB0"/>
    ${groundSet(920, "#8FD46E", "#7BC55C")}
    ${[[200, 980, "#FF5A5F"], [380, 1050, "#FFC21A"], [1820, 990, "#A66BFF"], [1500, 1120, "#FF5A5F"], [120, 1130, "#A66BFF"]].map(([x, y, c]) => `<g transform="translate(${x} ${y}) scale(.4)">${c === "#FF5A5F" ? C.poppy(200) : c === "#FFC21A" ? C.sunflower("ps" + x, 220) : C.purple(200)}</g>`).join("")}
    <g transform="translate(${TREE.x} ${TREE.y})">${C.oak()}</g>
    <g id="hiveG" transform="translate(${HIVE.x} ${HIVE.y})">${C.hive()}</g>
    <path id="fall" fill="url(#gHoney)" stroke="#C47A12" stroke-width="4" opacity="0"/>
    <g transform="translate(${POTP.x} ${POTP.y})">${C.honeyPot()}</g>`;

  // ───────────────────────── actors ─────────────────────────
  E("actors").innerHTML = `${C.defs()}
    <g id="frogPos"><g id="frog">${C.frog("fr")}</g></g>
    <g id="mousePos"><g id="mouse">${C.mouse("ms")}</g></g>
    <g id="ducklingPos"><g id="duckling">${C.duck("dl", true)}</g></g>
    <g id="duckPos"><g id="duck">${C.duck("dk")}</g></g>
    <g id="spoons">${["fistik", "mouse", "duckling", "frog", "duck"].map((k) => `<g id="sp_${k}" opacity="0">${C.spoon()}</g>`).join("")}</g>
    <g id="minis">${Array.from({ length: 16 }, (_, i) => `<g id="mb${i}" opacity="0">${C.beeMini()}</g>`).join("")}</g>
    <g id="bfly" opacity="0">${C.butterfly()}</g>
    <path id="trail" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="4 18" opacity="0"/>
    <g id="beePos"><g id="bee">${C.bee("be")}</g></g>
    <g id="drops">${Array.from({ length: 6 }, (_, i) => `<g id="hd${i}" opacity="0">${C.honeyDrop(1.1)}</g>`).join("")}</g>
    <g id="hearts">${Array.from({ length: 15 }, (_, i) => `<g id="ht${i}" opacity="0">${C.heart(0.8)}</g>`).join("")}</g>
    <g id="bridge">${Array.from({ length: 14 }, (_, i) => `<g id="bh${i}" opacity="0">${C.heart(0.6)}</g>`).join("")}</g>
    <path id="tongue6" fill="none" stroke="#FF6F91" stroke-width="15" stroke-linecap="round" opacity="0"/>
    <g id="title" font-family="Baloo 2" font-weight="800"><clipPath id="titleClip"><rect id="titleR" x="0" y="0" width="0" height="600"/></clipPath>
      <g clip-path="url(#titleClip)">${[..."Arı Vız Vız"].map((ch, i) => `<text class="tch" x="${420 + i * 106}" y="330" font-size="190" fill="${TC[i % 6]}" stroke="#fff" stroke-width="22" paint-order="stroke" text-anchor="middle">${ch}</text>`).join("")}</g></g>
    <g id="rings">${[0, 1].map((i) => `<g id="rg${i}" opacity="0" stroke="#FF5A5F" stroke-width="6" fill="none" stroke-linecap="round"><path d="M-22 -10 q-10 10 0 20"/><path d="M22 -10 q10 10 0 20"/><path d="M-34 -18 q-16 18 0 36"/><path d="M34 -18 q16 18 0 36"/></g>`).join("")}</g>`;
  E("fxSvg").innerHTML = `<g id="spark">${Array.from({ length: 14 }, (_, i) => `<path id="sk${i}" d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4Z" fill="#FFF3B0" stroke="#F5A800" stroke-width="2.5" opacity="0"/>`).join("")}</g>
    <g id="dust">${Array.from({ length: 10 }, (_, i) => `<circle id="du${i}" r="20" fill="#fff" opacity="0"/>`).join("")}</g>`;

  // ── screen-space overlays ──
  E("pollenOv").innerHTML = `<rect id="polBg" width="1920" height="1080" fill="#FFE45C" opacity="0"/>${Array.from({ length: 46 }, (_, i) => `<circle id="pl${i}" r="10" fill="#FFE45C" stroke="#F0B400" stroke-width="3" opacity="0"/>`).join("")}`;
  { // map: top-down patchwork, trail from the lavender to the hive
    const P = [[1390, 790], [1180, 690], [980, 600], [860, 470], [1000, 360], [1240, 300], [1430, 330], [1520, 310]];
