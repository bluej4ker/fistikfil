<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Fıstık Fil ve Şırıl Şırıl Dere</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      /* Baloo 2 · SIL OFL 1.1 (assets/fonts/OFL-Baloo2.txt) */
      @font-face { font-family: "Baloo 2"; font-weight: 400 800; font-display: block; src: url("assets/fonts/Baloo2-wght.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #9BD8FF; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Baloo 2", sans-serif; font-weight: 800; color: #2B2D42;
              background: linear-gradient(#7CCBFF 0%, #B5E3FF 50%, #E6F6FF 100%); }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      #shake { position: absolute; inset: 0; }
      .layer { position: absolute; left: 0; top: 0; width: 3840px; height: 1300px; }
      .layer svg { position: absolute; top: 0; width: 1920px; height: 1300px; overflow: visible; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1300px; overflow: visible; }
      #sun { left: 1600px; top: 50px; width: 230px; height: 230px; transform-origin: 115px 115px; }
      #charWrap { left: 460px; top: 265px; width: 600px; height: 640px; transform-origin: 300px 620px; }
      #char { position: absolute; inset: 0; overflow: visible; }
      #char svg { width: 600px; height: 640px; overflow: visible; }
      .snd { font-size: 92px; line-height: 1; white-space: nowrap; -webkit-text-stroke: 13px #fff; paint-order: stroke fill; text-shadow: 0 7px 0 rgba(0,0,0,.13); }
      .bub { width: 22px; height: 22px; border-radius: 50%; border: 4px solid rgba(255,255,255,.95); background: rgba(160,225,255,.35); }
      .drop { width: 18px; height: 24px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #7FD3F5; border: 3px solid #fff; }
      .rain { width: 5px; height: 46px; border-radius: 3px; background: rgba(220,240,255,.85); }
      .note { font-size: 66px; -webkit-text-stroke: 6px #fff; paint-order: stroke fill; }
      #title { left: 0; right: 0; top: 70px; text-align: center; }
      .big { display: inline-block; font-size: 150px; line-height: 1; }
      .big span { display: inline-block; -webkit-text-stroke: 11px #fff; paint-order: stroke fill; text-shadow: 0 9px 0 rgba(0,0,0,.13); }
      .sub { margin-top: 8px; font-size: 54px; font-weight: 700; line-height: 1.3; color: #fff; display: inline-block; padding: 6px 38px 0; background: #2E9BD6; border-radius: 40px; }
      #bug { left: 40px; top: 36px; padding: 6px 26px 0; border-radius: 30px; background: rgba(255,255,255,.9); font-size: 36px; color: #3D7DD8; }
      #bug b { color: #F59E1B; }
      #lyric { left: 0; right: 0; top: 34px; height: 90px; display: flex; justify-content: center; }
      .line { position: absolute; top: 0; padding: 4px 40px 0; border-radius: 42px; background: rgba(255,255,255,.95); font-size: 54px; line-height: 76px; white-space: nowrap; color: #8A93A6; box-shadow: 0 6px 0 rgba(0,0,0,.08); }
      .line span { display: inline-block; margin: 0 11px; }
      #end { left: 1040px; right: 20px; top: 260px; text-align: center; }
      .bye { margin-top: 10px; font-size: 64px; font-weight: 700; line-height: 1.3; color: #fff; display: inline-block; padding: 8px 40px 0; border-radius: 50px; background: #3D9BFF; }
      #vignette { inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,30,60,.16) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="180.27" data-width="1920" data-height="1080">
      <audio id="song" src="assets/song.mp3" data-start="0" data-duration="180.27" data-volume="1"></audio>
      <section id="world" class="clip" data-start="0" data-duration="180.27" data-track-index="0" data-layout-allow-overflow>
        <div id="skyDim" class="abs" style="inset:0;background:#5B6B88;opacity:0"></div>
        <div id="heat" class="abs" style="inset:0;background:radial-gradient(circle at 88% 12%, #FF9A3C 0%, #FFC46B 35%, rgba(255,214,140,.0) 80%);opacity:0"></div>
        <svg id="sun" class="abs" viewBox="0 0 230 230">
          <g id="rays" fill="#FFD84D" opacity=".9"></g>
          <circle id="sunDisk" cx="115" cy="115" r="66" fill="#FFD84D" stroke="#F5B921" stroke-width="5"/>
          <ellipse cx="96" cy="108" rx="6" ry="8" fill="#9A5B1E"/><ellipse cx="134" cy="108" rx="6" ry="8" fill="#9A5B1E"/>
          <ellipse cx="82" cy="126" rx="11" ry="7" fill="#FF9F7A" opacity=".7"/><ellipse cx="148" cy="126" rx="11" ry="7" fill="#FF9F7A" opacity=".7"/>
          <path d="M98 128 Q115 144 132 128" stroke="#9A5B1E" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg>
        <div id="cam" data-layout-allow-overflow>
          <div id="shake" data-layout-allow-overflow>
            <svg id="rainbow" class="full" viewBox="0 0 1920 1300"></svg>
            <div id="Lclouds" class="layer"></div>
            <svg id="storm" class="full" viewBox="0 0 1920 1300"></svg>
            <div id="Lfar" class="layer"></div>
            <div id="Lmid" class="layer"></div>
            <div id="Lground" class="layer"></div>
            <div id="streamBack" class="full"><svg class="full" viewBox="0 0 1920 1300" id="bedSvg"></svg></div>
            <div id="charWrap" class="abs"><div id="char"></div></div>
            <div id="streamFront" class="full"><svg class="full" viewBox="0 0 1920 1300" id="waterSvg"></svg></div>
            <svg id="fx" class="full" viewBox="0 0 1920 1300"></svg>
            <div id="drops"></div>
            <div id="bubs"></div>
            <div id="notes"></div>
            <div id="rainBox"></div>
            <div id="bulbBox" class="abs" style="left:700px;top:250px;width:120px;height:140px"></div>
            <div id="sndBox"></div>
          </div>
        </div>
        <div id="vignette" class="abs"></div>
        <div id="sadOv" class="abs" style="inset:0;background:#4A5A7A;mix-blend-mode:multiply;opacity:0"></div>
        <div id="title" class="abs"><div class="big" id="titleBig"></div><br/><div class="sub" id="titleSub">ve Şırıl Şırıl Dere</div></div>
        <div id="bug" class="abs">Fıstık <b>Fil</b></div>
        <div id="lyric" class="abs"></div>
        <div id="end" class="abs"><div class="big" id="endBig"></div><br/><div class="bye" id="bye">Hoşça kal!</div></div>
      </section>
    </div>

    <script>
/*CAST*/
(function () {
  window.__timelines = window.__timelines || {};
  const $ = (s) => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const D = 180.27, BEAT = 0.4936, B0 = 0.152, TAU = Math.PI * 2;
  const TC = ["#3D9BFF", "#FF5A5F", "#FFC23D", "#3FBF6F", "#A66BFF", "#FF7A3D"];
  const OL = "#4C76B5";
  const INK = "#2B2D42";
  const C = window.CAST;
  const LINES = /*LINES*/;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (e0, e1, x) => { const k = clamp((x - e0) / (e1 - e0), 0, 1); return k * k * (3 - 2 * k); };

/*RIG*/

  // ───────────────────────── geometry of the stream ─────────────────────────
  const SC = 0.85, WRAP = { x: 460, y: 265 };                         // charWrap position (scale about 300,620)
  const toScene = (p) => [WRAP.x + 300 + (p[0] - 300) * SC, WRAP.y + 620 + (p[1] - 620) * SC];
  const bedY = (x) => x < 900 ? 905 : x < 1160 ? 905 + 140 * smooth(900, 1160, x) : 1045 + 6 * Math.sin(x / 70);
  const surfY = (wl) => 788 + (1 - wl) * 250;                          // wl 1 → 788, wl 0 → 1038

  // water level as a pure function of time (seek-safe)
  const WLK = [[0, 1]];
  const step = (t, d, dur = 0.18) => { const prev = WLK[WLK.length - 1][1]; WLK.push([t, prev], [t + dur, clamp(prev + d, 0, 1.05)]); };
  const LIK1 = [41.6, 42.2, 42.5, 44.1, 44.3, 44.7, 46.0, 46.3, 46.7, 47.7, 48.4];
  const LIK2 = [70.0, 70.4, 70.8, 72.0, 72.3, 72.7, 74.0, 74.3, 74.7, 75.6, 76.3];
  LIK1.forEach((t) => step(t, -0.026));
  LIK2.forEach((t) => step(t, -0.03));
  WLK.push([86, WLK[WLK.length - 1][1]], [101.0, 0.12], [104.0, 0.0], [123.9, 0.0]);
  const FIS = [124.0, 124.7, 125.1, 127.7, 128.4, 128.9, 132.0, 132.7, 133.1];
  FIS.forEach((t) => step(t + 0.25, 0.084, 0.35));
  WLK.push([135.0, WLK[WLK.length - 1][1]], [139.2, 1.02], [D, 1.0]);
  const wlAt = (t) => { for (let i = 1; i < WLK.length; i++) { const [t1, v1] = WLK[i], [t0, v0] = WLK[i - 1];
      if (t <= t1) return t1 === t0 ? v1 : v0 + (v1 - v0) * smooth(0, 1, (t - t0) / (t1 - t0)); } return WLK[WLK.length - 1][1]; };

  // ───────────────────────── scenery ─────────────────────────
  const mk = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  for (let i = 0; i < 12; i++) mk("rect", { x: 109, y: 2, width: 12, height: 40, rx: 6, transform: `rotate(${i * 30} 115 115)` }, E("rays"));
  const tree = (x, y, s, c1, c2) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-12" y="-10" width="24" height="90" rx="10" fill="#A0703F" stroke="#6E4A27" stroke-width="4"/>
      <circle cx="0" cy="-60" r="70" fill="${c1}" stroke="${c2}" stroke-width="5"/><circle cx="-45" cy="-25" r="45" fill="${c1}" stroke="${c2}" stroke-width="5"/>
      <circle cx="45" cy="-25" r="45" fill="${c1}" stroke="${c2}" stroke-width="5"/><circle cx="-20" cy="-85" r="16" fill="#fff" opacity=".25"/></g>`;
  const flower = (x, y, c, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 V40" stroke="#3E9B47" stroke-width="5"/>
      ${[0, 72, 144, 216, 288].map((a) => `<ellipse cx="0" cy="-14" rx="9" ry="14" fill="${c}" transform="rotate(${a})"/>`).join("")}<circle r="8" fill="#FFD84D"/></g>`;
  const tuft = (x, y) => `<path d="M${x - 16} ${y} q6 -26 10 0 q4 -34 10 0 q6 -24 12 0z" fill="#4FAE48"/>`;
  const cloud = (x, y, s, c = "#fff") => `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><circle cx="80" cy="80" r="50"/><circle cx="150" cy="58" r="62"/><circle cx="222" cy="82" r="46"/><rect x="60" y="80" width="190" height="50" rx="25"/></g>`;
  const tileSet = (id, inner) => { E(id).innerHTML = [0, 1].map((k) => `<svg viewBox="0 0 1920 1300" style="left:${k * 1920}px">${inner}</svg>`).join(""); };
  tileSet("Lclouds", cloud(80, 150, 1) + cloud(1050, 110, 0.8) + cloud(1500, 230, 0.6));
  tileSet("Lfar", `<path d="M0 690 Q240 590 480 670 T960 660 T1440 650 T1920 690 V1300 H0Z" fill="#B9E5A0"/>` +
    [150, 520, 860, 1260, 1700].map((x, i) => tree(x, 670 - (i % 2) * 20, 0.45, "#8CCB6E", "#6FAF55")).join(""));
  tileSet("Lmid", `<path d="M0 760 Q320 700 640 750 T1280 745 T1920 760 V1300 H0Z" fill="#94D474"/>` +
    [300, 1000, 1550].map((x, i) => tree(x, 760, 0.8 + (i % 2) * 0.15, "#5DBB55", "#3F9442")).join("") +
    `<g fill="#78C760" stroke="#4F9F45" stroke-width="4"><circle cx="640" cy="760" r="40"/><circle cx="690" cy="755" r="32"/><circle cx="1320" cy="765" r="38"/></g>`);
  tileSet("Lground", `<path d="M0 800 Q480 770 960 795 T1920 792 V1300 H0Z" fill="#6CC75A"/><path d="M0 980 Q480 950 960 975 T1920 970 V1300 H0Z" fill="#62BB51"/>` +
    [80, 260, 430, 610, 900, 1120, 1340, 1500, 1690, 1850].map((x, i) => tuft(x, 860 + (i * 37) % 120)).join("") +
    [[140, 900, "#FF8FB1"], [380, 960, "#fff"], [700, 920, "#B58CFF"], [1060, 990, "#FFD84D"], [1270, 910, "#FF8FB1"], [1580, 970, "#fff"], [1780, 920, "#B58CFF"]].map(([x, y, c]) => flower(x, y, c)).join(""));
  E("storm").innerHTML = `<g id="stormG">${cloud(-60, 40, 1.6, "#8A94A8") + cloud(420, -10, 1.9, "#7D879C") + cloud(980, 30, 1.7, "#8A94A8") + cloud(1450, -20, 1.8, "#7D879C") + cloud(250, 120, 1.2, "#98A2B6") + cloud(1200, 130, 1.3, "#98A2B6")}</g>`;
  E("rainbow").innerHTML = `<g id="rbG" opacity="0" fill="none" stroke-linecap="round">${["#FF5A5F", "#FF9F1C", "#FFD84D", "#3FBF6F", "#3D9BFF", "#A66BFF"].map((c, i) =>
    `<path class="rbArc" d="M${380 + i * 26} 760 A${580 - i * 26} ${520 - i * 26} 0 0 1 ${1540 - i * 26} 760" stroke="${c}" stroke-width="28" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>`).join("")}</g>`;

  // stream bed (mud channel) + cracks + stones; fish live here (under the water)
  const bedPts = []; for (let x = 560; x <= 2000; x += 20) bedPts.push(`${x} ${bedY(x).toFixed(1)}`);
  E("bedSvg").innerHTML = `<defs><linearGradient id="gMud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C79B6B"/><stop offset="1" stop-color="#9C6E45"/></linearGradient>
      <clipPath id="cChan"><path d="M560 1300 L560 812 Q600 776 700 774 Q1300 768 2000 772 L2000 1300Z"/></clipPath></defs>
    <path d="M560 1300 L560 812 Q600 776 700 774 Q1300 768 2000 772 L2000 1300Z" fill="url(#gMud)"/>
    <path d="M560 1300 L${bedPts.join(" L")} L2000 1300Z" fill="#B48558"/>
    <g id="cracks" opacity="0" stroke="#7A5232" stroke-width="5" fill="none" stroke-linecap="round">
      ${[[700, 930], [1000, 1010], [1250, 1065], [1500, 1070], [1760, 1062]].map(([x, y]) => `<path d="M${x} ${y} l30 12 l-10 16 l34 10 M${x + 30} ${y + 12} l26 -8"/>`).join("")}</g>
    ${[[760, 912, 26, 12], [1010, 1000, 30, 14], [1340, 1060, 40, 16], [1620, 1066, 32, 13], [1880, 1058, 36, 15]].map(([x, y, w, h]) => `<g transform="translate(${x} ${y})">${C.rock(w, h)}</g>`).join("")}
    <path d="M560 812 Q600 776 700 774 Q1300 768 2000 772" stroke="#4FAE48" stroke-width="16" fill="none" stroke-linecap="round"/>
    ${[640, 820, 1040, 1320, 1580, 1840].map((x) => tuft(x, 780)).join("")}
    <g id="fish0" class="fish">${C.fish("#FF9F43", "#FF6B3D")}</g><g id="fish1" class="fish">${C.fish("#FFD84D", "#F5B921")}</g><g id="fish2" class="fish">${C.fish("#FF8FB1", "#F2668B")}</g>`;
  // water (surface path computed per frame), lily + frog, ducks
  E("waterSvg").innerHTML = `<defs><linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FD0F7" stop-opacity=".5"/><stop offset=".55" stop-color="#3FA6E0" stop-opacity=".62"/><stop offset="1" stop-color="#2E8FD0" stop-opacity=".85"/></linearGradient>
      <clipPath id="cChan2"><path d="M560 1300 L560 812 Q600 776 700 774 Q1300 768 2000 772 L2000 1300Z"/></clipPath></defs>
    <g clip-path="url(#cChan2)"><path id="water" fill="url(#gWater)"/><path id="waterHi" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
      <g id="ripples" fill="none" stroke="#fff" stroke-width="4" opacity=".6"></g></g>
    <g id="lilyG">${C.lily()}<g id="frog">${C.frog()}</g></g>
    <g id="duck0" class="duck">${C.duck("#FFFFFF", 0.95)}</g><g id="duck1" class="duck">${C.duck("#FFD84D", 0.62)}</g>
    <path id="jet" fill="none" stroke="#7FD3F5" stroke-width="22" stroke-linecap="round" opacity="0"/><path id="jet2" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0"/>`;
  for (let i = 0; i < 6; i++) mk("ellipse", { id: "rp" + i, rx: 0, ry: 0 }, E("ripples"));
  E("bulbBox").innerHTML = `<svg viewBox="-70 -80 140 160" width="120" height="140">${C.bulb()}</svg>`;

  // pools: drops, bubbles, rain, notes
  for (let i = 0; i < 40; i++) { const d = document.createElement("div"); d.className = "abs drop"; d.id = "dr" + i; d.style.opacity = 0; d.style.left = "0px"; d.style.top = "0px"; E("drops").appendChild(d); }
  for (let i = 0; i < 36; i++) { const d = document.createElement("div"); d.className = "abs bub"; d.id = "bb" + i; d.style.opacity = 0; d.style.left = "0px"; d.style.top = "0px"; E("bubs").appendChild(d); }
  for (let i = 0; i < 90; i++) { const d = document.createElement("div"); d.className = "abs rain"; d.id = "rn" + i; E("rainBox").appendChild(d); }
  for (let i = 0; i < 18; i++) { const n = document.createElement("div"); n.className = "abs note"; n.id = "n" + i; n.style.left = "0px"; n.style.top = "0px"; n.textContent = i % 2 ? "♫" : "♪"; n.style.color = TC[i % 6]; n.style.opacity = 0; E("notes").appendChild(n); }
  const letters = (txt, host) => [...txt].forEach((ch, i) => { const s = document.createElement("span"); s.textContent = ch === " " ? " " : ch; s.style.color = TC[i % 6]; host.appendChild(s); });
  letters("Fıstık Fil", $("#titleBig")); letters("Fıstık Fil", $("#endBig"));

  // ───────────────────────── poses ─────────────────────────
  const POSE = { rest: [88, -140, 22], trumpet: [25, -110, 28], kick: [18, -112, 29.5], drink: [86, -12, 30], wave: [40, -130, 26] };
  const TRUMP = toScene(tipLocal(...POSE.trumpet));
  const FX = { x: 760, feet: 885 };
  const DRINK = toScene(tipLocal(86, -12, 30));                                    // Fıstık in the water (scene)

  // ───────────────────────── lyrics + sound words ─────────────────────────
  const SW = { "güm": "#4E73D1", "lık": "#2E9BD6", "blup": "#FF7A3D", "vrak": "#3FA34D", "vak": "#F59E1B", "fış": "#2E9BD6", "tıp": "#3D7DD8", "şap": "#A66BFF", "şırıl": "#2E9BD6", "pırrt": "#FF7A3D" };
  const norm = (w) => w.toLowerCase().replace(/[!,.?“”]/g, "");
  LINES.forEach((L, li) => { const d = document.createElement("div"); d.className = "line"; d.id = "ln" + li;
    L.forEach((w, wi) => { const s = document.createElement("span"); s.id = `w${li}_${wi}`; s.textContent = w[0]; d.appendChild(s); }); E("lyric").appendChild(d); });
  const WORDS = LINES.flat().map((w) => w[1]).sort((a, b) => a - b);
  // place a big sound word near whoever makes the sound
  const SND = []; let k = 0;
  LINES.flat().forEach(([w, t]) => { const n = norm(w); if (!(n in SW) || n === "şırıl" && t < 41) return; k++;
    const S = surfY(wlAt(t)), j = k % 3, r = [-10, 8, -4][j];
    let x = 0, y = 0;
    if (n === "güm") { x = [140, 520, 330][j] - 120; y = [820, 840, 900][j] - 60; }
    else if (n === "lık") { x = [880, 1000, 940][j]; y = Math.min(S, 990) - [170, 110, 230][j]; }
    else if (n === "blup") { x = [1180, 1380, 1560][j]; y = Math.min(S, 990) - 210 + j * 30; }
    else if (n === "vrak") { x = [1520, 1680, 1600][j]; y = Math.min(S, 1000) - 330 + j * 40; }
    else if (n === "vak") { x = [1140, 1320, 1240][j]; y = Math.min(S, 1000) - 300 + j * 40; }
    else if (n === "fış") { x = [1060, 1240, 1150][j]; y = [540, 610, 470][j]; }
    else if (n === "tıp") { x = [520, 1100, 1500][j]; y = [300, 250, 340][j]; }
    else if (n === "şap") { x = [520, 1280, 900][j]; y = [560, 520, 330][j]; }
    else if (n === "şırıl") { x = [1250, 1500, 1350][j]; y = Math.min(S, 990) - 170; }
    else if (n === "pırrt") { x = 330; y = 300; }
    SND.push([w.replace(/[,.?“”]/g, "").toUpperCase().replace("I", "I").replace(/!*$/, "!"), t, x, y, r, SW[n]]); });
  SND.forEach((s, i) => { const d = document.createElement("div"); d.className = "abs snd"; d.id = "sd" + i;
    d.textContent = s[0].replace("İ", "İ"); d.style.color = s[5]; d.style.left = s[2] + "px"; d.style.top = s[3] + "px"; d.style.opacity = 0; E("sndBox").appendChild(d); });

  // ───────────────────────── animated state ─────────────────────────
  const R = { A: POSE.rest[0], C: POSE.rest[1], L: POSE.rest[2], drink: 0, mouth: 0, blink: 0, lookX: 0, lookY: 0, earAmp: 1, walk: 0, sway: 0, tilt: 0, bob: 1, sad: 0, sweat: 0, tongue: 0, tear: 0 };
  const W = { x: 0, sx: 1920 };                                       // world scroll, stream slide-in
  const CAM = { x: 960, y: 560, s: 1.0, r: 0 };
  const ENV = { heat: 0, sun: 1, dim: 0, rain: 0, storm: 0, rainbow: 0, sadOv: 0, cracks: 0 };
  const AN = { fishSad: 0, frogSad: 0, duckSad: 0, frogOpen: 0, duckOpen: 0, fishO: 0, party: 0, swim: 0 };
