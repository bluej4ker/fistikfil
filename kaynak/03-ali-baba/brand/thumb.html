<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Baloo 2"; font-weight: 400 800; src: url("../proj/assets/fonts/Baloo2-wght.ttf"); }
*{margin:0;padding:0;box-sizing:border-box} body{width:1280px;height:720px;overflow:hidden;font-family:"Baloo 2";font-weight:800}
.abs{position:absolute} .bg{inset:0;background:url("bg.png") center/cover}
.g{font-size:118px;line-height:.86;-webkit-text-stroke:16px #fff;paint-order:stroke fill;text-shadow:0 10px 0 rgba(0,0,0,.18);white-space:nowrap}
.yeni{left:24px;top:22px;background:#FF3B5C;color:#fff;font-size:44px;padding:4px 24px 0;border-radius:18px;transform:rotate(-6deg);border:6px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.brand{right:26px;bottom:20px;background:#fff;border-radius:40px;padding:6px 28px 0;font-size:44px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.chip{font-size:46px;color:#fff;border-radius:30px;padding:4px 22px 0;border:5px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.15)}

<div class="abs bg"></div>
<div class="abs g" style="left:150px;top:96px;color:#E5484D;transform:rotate(-4deg)">ALİ BABA'NIN</div>
<div class="abs g" style="left:250px;top:200px;color:#2E7FD9;transform:rotate(2deg)">ÇİFTLİĞİ</div>
<div class="abs chip" style="left:860px;top:205px;background:#3FA34D;transform:rotate(6deg)">MÖÖ!</div>
<div class="abs chip" style="left:960px;top:118px;background:#F59E1B;transform:rotate(-5deg)">VAK!</div>
<div class="abs yeni">YENİ!</div>
<div class="abs brand"><span style="color:#3D9BFF">Fıstık</span> <span style="color:#FF7A3D">Fil</span></div>
</body></html>
