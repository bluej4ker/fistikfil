<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Fıstık Fil · Adımları</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      /* Baloo 2 · SIL OFL 1.1 (assets/fonts/OFL-Baloo2.txt) — full Turkish coverage (ş ğ İ) */
      @font-face { font-family: "Baloo 2"; font-weight: 400 800; font-display: block; src: url("assets/fonts/Baloo2-wght.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #9BD8FF; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Baloo 2", sans-serif; font-weight: 700; color: #2B2D42;
              background: linear-gradient(#7CCBFF 0%, #B5E3FF 50%, #E6F6FF 100%); }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      #shake { position: absolute; inset: 0; }
      .layer { position: absolute; left: 0; top: 0; width: 3840px; height: 1300px; }
      .layer svg { position: absolute; top: 0; width: 1920px; height: 1300px; overflow: visible; }
      #sun { left: 1600px; top: 50px; width: 230px; height: 230px; }
      #burst { left: -300px; top: -300px; width: 2520px; height: 1680px; }
      #flyGroup { position: absolute; inset: 0; }
      #char { left: 460px; top: 290px; width: 600px; height: 640px; overflow: visible; }
      #char svg { width: 600px; height: 640px; overflow: visible; }
      #shadow { left: 610px; top: 890px; width: 300px; height: 46px; border-radius: 50%; background: rgba(30,80,30,.28); }
      .balloon { width: 160px; height: 330px; transform-origin: 80px 180px; }
      .balloon svg { width: 160px; height: 330px; overflow: visible; }
      .note { font-size: 66px; -webkit-text-stroke: 6px #fff; paint-order: stroke fill; }
      .snd { font-size: 96px; line-height: 1; white-space: nowrap; -webkit-text-stroke: 13px #fff; paint-order: stroke fill; text-shadow: 0 7px 0 rgba(0,0,0,.13); }
      .wind { height: 14px; border-radius: 7px; background: rgba(255,255,255,.9); }
      .conf { width: 22px; height: 22px; border-radius: 6px; }
      .bfly { width: 70px; height: 60px; }
      .bird { width: 90px; height: 50px; }
      #title { left: 0; right: 0; top: 64px; text-align: center; }
      .big { display: inline-block; font-size: 156px; line-height: 1; }
      .big span { display: inline-block; -webkit-text-stroke: 11px #fff; paint-order: stroke fill; text-shadow: 0 9px 0 rgba(0,0,0,.13); }
      .sub { margin-top: 14px; font-size: 52px; font-weight: 500; color: #fff; display: inline-block; padding: 8px 36px; background: #FF7A3D; border-radius: 40px; }
      #bug { left: 40px; top: 36px; padding: 10px 26px; border-radius: 30px; background: rgba(255,255,255,.88); font-size: 34px; color: #3D7DD8; }
      #bug b { color: #F59E1B; }
      #lyric { left: 0; right: 0; top: 968px; height: 84px; display: flex; justify-content: center; }
      .line { position: absolute; top: 0; padding: 8px 40px; border-radius: 42px; background: rgba(255,255,255,.94); font-size: 54px; line-height: 68px; white-space: nowrap; color: #8A93A6; box-shadow: 0 6px 0 rgba(0,0,0,.08); }
      .line span { display: inline-block; margin: 0 13px; }
      #end { left: 1040px; right: 20px; top: 300px; text-align: center; }
      .bye { margin-top: 18px; font-size: 64px; color: #fff; display: inline-block; padding: 10px 40px; border-radius: 50px; background: #3D9BFF; }
      #vignette { inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,30,60,.16) 100%); pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="90.8" data-width="1920" data-height="1080">
      <audio id="song" src="assets/gemini.mp3" data-start="0" data-duration="90.8" data-volume="1"></audio>
      <section id="world" class="clip" data-start="0" data-duration="90.8" data-track-index="0" data-layout-allow-overflow>
        <svg id="sun" class="abs" viewBox="0 0 230 230">
          <g id="rays" fill="#FFD84D" opacity=".9"></g>
          <circle cx="115" cy="115" r="66" fill="#FFD84D" stroke="#F5B921" stroke-width="5"/>
          <ellipse cx="96" cy="108" rx="6" ry="8" fill="#9A5B1E"/><ellipse cx="134" cy="108" rx="6" ry="8" fill="#9A5B1E"/>
          <ellipse cx="82" cy="126" rx="11" ry="7" fill="#FF9F7A" opacity=".7"/><ellipse cx="148" cy="126" rx="11" ry="7" fill="#FF9F7A" opacity=".7"/>
          <path d="M98 128 Q115 144 132 128" stroke="#9A5B1E" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg>
        <div id="cam" data-layout-allow-overflow>
          <div id="shake" data-layout-allow-overflow>
            <div id="Lclouds" class="layer"></div>
            <div id="Lfar" class="layer"></div>
            <div id="Lmid" class="layer"></div>
            <div id="Lground" class="layer"></div>
            <div id="burst" class="abs"></div>
            <div id="winds"></div>
            <div id="birds"></div>
            <div id="shadow" class="abs"></div>
            <div id="flyGroup">
              <div id="char" class="abs"></div>
              <div id="balloons"></div>
              <div id="localSnd"></div>
              <div id="notes"></div>
            </div>
            <div id="bflies"></div>
            <div id="Lfront" class="layer"></div>
            <div id="sceneSnd"></div>
            <div id="confetti"></div>
          </div>
        </div>
        <div id="vignette" class="abs"></div>
        <div id="title" class="abs"><div class="big" id="titleBig"></div><br/><div class="sub" id="titleSub">Fıstık Fil'in Adımları</div></div>
        <div id="bug" class="abs">Fıstık <b>Fil</b></div>
        <div id="lyric" class="abs"></div>
        <div id="end" class="abs"><div class="big" id="endBig"></div><br/><div class="bye" id="bye">Hoşça kal!</div></div>
      </section>
    </div>

    <script>
(function () {
  window.__timelines = window.__timelines || {};
  const $ = (s) => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const D = 90.8, BEAT = 60 / 123, TAU = Math.PI * 2;
  const TC = ["#3D9BFF", "#FF5A5F", "#FFC23D", "#3FBF6F", "#A66BFF", "#FF7A3D"];
  const COLORS = ["#FF5A5F", "#FFC23D", "#3FBF6F", "#3D9BFF", "#A66BFF"];
  const OL = "#4C76B5";                                   // outline colour

  function leg(c) { return `<path d="M-38 -30 L38 -30 L38 74 Q38 104 0 104 Q-38 104 -38 74 Z" fill="${c}"/><path d="M-38 -6 L-38 74 Q-38 104 0 104 Q38 104 38 74 L38 -6" fill="none" stroke="${OL}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      <g fill="#EEF5FD" stroke="${OL}" stroke-width="2"><ellipse cx="-20" cy="96" rx="9" ry="6"/><ellipse cx="0" cy="99" rx="9" ry="6"/><ellipse cx="20" cy="96" rx="9" ry="6"/></g>`; }
  function ear() { return `<path d="M222 168 C128 92 26 160 44 278 C60 374 160 386 222 322 Z" fill="url(#gEar)" stroke="${OL}" stroke-width="5" stroke-linejoin="round"/>
      <path d="M205 196 C140 146 76 192 88 272 C100 336 164 344 205 302 Z" fill="#F7B3C8"/>`; }

  // ───────────────────────── Fıstık rig (SVG) ─────────────────────────
  $("#char").innerHTML = `
  <svg viewBox="0 0 600 640">
    <defs>
      <radialGradient id="gHead" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#C4E1FD"/><stop offset=".6" stop-color="#A3CAF2"/><stop offset="1" stop-color="#85B1E6"/></radialGradient>
      <radialGradient id="gBody" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#B5D6F8"/><stop offset="1" stop-color="#7FA9DE"/></radialGradient>
      <radialGradient id="gEar" cx="60%" cy="40%" r="80%"><stop offset="0" stop-color="#A6CBF2"/><stop offset="1" stop-color="#7DA6DC"/></radialGradient>
      <linearGradient id="gTrunk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A2C8F1"/><stop offset="1" stop-color="#7AA6DD"/></linearGradient>
      <linearGradient id="gHat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD966"/><stop offset="1" stop-color="#FFB627"/></linearGradient>
      <clipPath id="cEyeL"><ellipse cx="248" cy="246" rx="34" ry="41"/></clipPath>
      <clipPath id="cEyeR"><ellipse cx="352" cy="246" rx="34" ry="41"/></clipPath>
      <clipPath id="cHat"><path d="M156 196 C160 60 440 60 444 196 Z"/></clipPath>
    </defs>
    <g id="rig">
      <g id="tail"><path d="M432 470 Q482 452 494 492" stroke="${OL}" stroke-width="18" fill="none" stroke-linecap="round"/>
        <path d="M432 470 Q482 452 494 492" stroke="#8DB6E8" stroke-width="10" fill="none" stroke-linecap="round"/>
        <path d="M486 488 q8 22 -2 30 q16 -4 18 -24 z" fill="#5E86C2" stroke="${OL}" stroke-width="3"/></g>
      <g id="legBL">${leg("#86AEE2")}</g><g id="legBR">${leg("#86AEE2")}</g>
      <g id="earL">${ear()}</g><g id="earR">${ear()}</g>
      <ellipse cx="300" cy="462" rx="146" ry="116" fill="url(#gBody)" stroke="${OL}" stroke-width="5"/>
      <g id="legFL">${leg("#8DB4E6")}</g><g id="legFR">${leg("#8DB4E6")}</g>
      <ellipse cx="300" cy="482" rx="92" ry="66" fill="#D3E7FA"/>
      <g id="head">
        <ellipse cx="300" cy="236" rx="152" ry="141" fill="url(#gHead)" stroke="${OL}" stroke-width="5"/>
        <g id="hat">
          <path d="M156 196 C160 60 440 60 444 196 Q300 170 156 196Z" fill="url(#gHat)" stroke="#D9861A" stroke-width="5"/>
          <g clip-path="url(#cHat)" opacity=".9"><path d="M150 120 Q300 92 450 120" stroke="#FF8A3D" stroke-width="16" fill="none"/><path d="M150 152 Q300 126 450 152" stroke="#FF8A3D" stroke-width="16" fill="none"/></g>
          <path d="M150 194 Q300 160 450 194 L452 218 Q300 186 148 218Z" fill="#FF9F1C" stroke="#D9861A" stroke-width="5" stroke-linejoin="round"/>
          <g id="pom"><circle cx="300" cy="74" r="30" fill="#FF6B4A" stroke="#C94A2E" stroke-width="5"/><circle cx="290" cy="64" r="9" fill="#FF9F86"/></g>
        </g>
        <ellipse cx="203" cy="304" rx="27" ry="16" fill="#FF8FAB" opacity=".7"/><ellipse cx="397" cy="304" rx="27" ry="16" fill="#FF8FAB" opacity=".7"/>
        <g id="eyes">
          <ellipse cx="248" cy="246" rx="34" ry="41" fill="#fff" stroke="#2B2D42" stroke-width="3.5"/>
          <ellipse cx="352" cy="246" rx="34" ry="41" fill="#fff" stroke="#2B2D42" stroke-width="3.5"/>
          <g id="pupils">
            <circle cx="254" cy="254" r="24" fill="#2B2D42"/><circle cx="358" cy="254" r="24" fill="#2B2D42"/>
            <circle cx="263" cy="243" r="8.5" fill="#fff"/><circle cx="367" cy="243" r="8.5" fill="#fff"/>
            <circle cx="248" cy="265" r="3.8" fill="#fff"/><circle cx="352" cy="265" r="3.8" fill="#fff"/>
          </g>
          <g clip-path="url(#cEyeL)"><rect id="lidL" x="210" y="200" width="80" height="0" fill="#9EC6F0"/></g>
          <g clip-path="url(#cEyeR)"><rect id="lidR" x="314" y="200" width="80" height="0" fill="#9EC6F0"/></g>
        </g>
        <clipPath id="cMouth"><path id="mouthClip" d=""/></clipPath><path id="mouth" d="" fill="#8C2F45" stroke="#2B2D42" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
        <g clip-path="url(#cMouth)"><ellipse id="tongue" cx="252" cy="350" rx="16" ry="0" fill="#FF8FA3"/></g>
        <g id="trunk"><path id="trunkShadow" fill="rgba(40,70,130,.22)" transform="translate(7 9)"/><path id="trunkFill" fill="url(#gTrunk)"/><path id="trunkLine" fill="none" stroke="${OL}" stroke-width="5" stroke-linejoin="round"/>
          <path id="trunkWr" fill="none" stroke="#6F9AD3" stroke-width="4" stroke-linecap="round"/><ellipse id="nostril" rx="12" ry="7" fill="#6F9AD3"/></g>
      </g>
    </g>
  </svg>`;
  const E = (id) => document.getElementById(id);
  const el = { rig: E("rig"), tail: E("tail"), earL: E("earL"), earR: E("earR"), head: E("head"), pom: E("pom"), pupils: E("pupils"),
    lidL: E("lidL"), lidR: E("lidR"), mouth: E("mouth"), mclip: E("mouthClip"), tongue: E("tongue"), tf: E("trunkFill"), ts: E("trunkShadow"), tl: E("trunkLine"), tw: E("trunkWr"), nos: E("nostril"),
    legs: [E("legFL"), E("legFR"), E("legBL"), E("legBR")] };
  const LEGP = [[250, 518, 0], [350, 518, Math.PI], [218, 500, Math.PI], [382, 500, 0]];  // pivot x,y, phase

  // trunk geometry: base at TB, TN segments, direction A + C·f²
  const TB = [300, 298], TN = 9, TL = 22;
  function trunkGeom(A, C, TLx = TL) {
    const P = [[TB[0], TB[1]]], ANG = [];
    for (let i = 0; i < TN; i++) { const f = i / (TN - 1), a = (A + C * f * f) * Math.PI / 180; ANG.push(a);
      const p = P[P.length - 1]; P.push([p[0] + TLx * Math.cos(a), p[1] + TLx * Math.sin(a)]); }
    ANG.push(ANG[ANG.length - 1]);
    return { P, ANG };
  }
  function drawTrunk(A, C, Lx) {
    const { P, ANG } = trunkGeom(A, C, Lx), Lp = [], Rp = [];
    P.forEach((p, i) => { const w = (60 - 26 * i / TN) / 2, a = ANG[i], nx = -Math.sin(a), ny = Math.cos(a);
      Lp.push([p[0] + nx * w, p[1] + ny * w]); Rp.push([p[0] - nx * w, p[1] - ny * w]); });
    const f = (q) => q[0].toFixed(1) + " " + q[1].toFixed(1), wt = (60 - 26) / 2;
    const side = "M" + Lp.map(f).join(" L") + ` A${wt} ${wt} 0 0 0 ` + f(Rp[TN]) + " L" + Rp.slice(0, TN).reverse().map(f).join(" L");
    el.tf.setAttribute("d", side + " Z"); el.tl.setAttribute("d", side); el.ts.setAttribute("d", side + " Z");
    let wr = ""; [3, 4, 5].forEach((i) => { const a = Lp[i], b = Rp[i], m = P[i];
      const ax = m[0] + (a[0] - m[0]) * 0.55, ay = m[1] + (a[1] - m[1]) * 0.55, bx = m[0] + (b[0] - m[0]) * 0.55, by = m[1] + (b[1] - m[1]) * 0.55;
      wr += `M${ax.toFixed(1)} ${ay.toFixed(1)} Q${(m[0] + Math.cos(ANG[i]) * 5).toFixed(1)} ${(m[1] + Math.sin(ANG[i]) * 5).toFixed(1)} ${bx.toFixed(1)} ${by.toFixed(1)} `; });
    el.tw.setAttribute("d", wr);
    const tp = P[TN], ta = ANG[TN], nx = tp[0] + Math.cos(ta) * 4, ny = tp[1] + Math.sin(ta) * 4;
    el.nos.setAttribute("cx", nx.toFixed(1)); el.nos.setAttribute("cy", ny.toFixed(1));
    el.nos.setAttribute("transform", `rotate(${(ta * 180 / Math.PI + 90).toFixed(1)} ${nx.toFixed(1)} ${ny.toFixed(1)})`);
  }
  const tipLocal = (A, C, Lx) => trunkGeom(A, C, Lx).P[TN];

  // ───────────────────────── scenery ─────────────────────────
  const mk = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  for (let i = 0; i < 12; i++) mk("rect", { x: 109, y: 2, width: 12, height: 40, rx: 6, transform: `rotate(${i * 30} 115 115)` }, E("rays"));
  const tree = (x, y, s, c1, c2) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-12" y="-10" width="24" height="90" rx="10" fill="#A0703F" stroke="#6E4A27" stroke-width="4"/>
      <circle cx="0" cy="-60" r="70" fill="${c1}" stroke="${c2}" stroke-width="5"/><circle cx="-45" cy="-25" r="45" fill="${c1}" stroke="${c2}" stroke-width="5"/>
      <circle cx="45" cy="-25" r="45" fill="${c1}" stroke="${c2}" stroke-width="5"/><circle cx="-20" cy="-85" r="16" fill="#fff" opacity=".25"/></g>`;
  const flower = (x, y, c, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 V40" stroke="#3E9B47" stroke-width="5"/>
      ${[0, 72, 144, 216, 288].map((a) => `<ellipse cx="0" cy="-14" rx="9" ry="14" fill="${c}" transform="rotate(${a})"/>`).join("")}<circle r="8" fill="#FFD84D"/></g>`;
  const tuft = (x, y) => `<path d="M${x - 16} ${y} q6 -26 10 0 q4 -34 10 0 q6 -24 12 0z" fill="#4FAE48"/>`;
  const cloud = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})" fill="#fff"><circle cx="80" cy="80" r="50"/><circle cx="150" cy="58" r="62"/><circle cx="222" cy="82" r="46"/><rect x="60" y="80" width="190" height="50" rx="25"/></g>`;
  const tileSet = (id, inner) => { $(id).innerHTML = [0, 1].map((k) => `<svg viewBox="0 0 1920 1300" style="left:${k * 1920}px">${inner}</svg>`).join(""); };
  tileSet("#Lclouds", cloud(80, 150, 1) + cloud(1050, 90, 0.8) + cloud(600, -380, 1.2) + cloud(1450, -620, 1.0) + cloud(150, -820, 0.9) + cloud(900, -1080, 1.3) + cloud(1600, -260, 0.7));
  tileSet("#Lfar", `<path d="M0 720 Q240 600 480 700 T960 690 T1440 680 T1920 720 V1300 H0Z" fill="#B9E5A0"/>` +
    [150, 520, 860, 1260, 1700].map((x, i) => tree(x, 700 - (i % 2) * 20, 0.45, "#8CCB6E", "#6FAF55")).join(""));
  tileSet("#Lmid", `<path d="M0 800 Q320 720 640 790 T1280 780 T1920 800 V1300 H0Z" fill="#94D474"/>` +
    [300, 1000, 1550].map((x, i) => tree(x, 790, 0.85 + (i % 2) * 0.15, "#5DBB55", "#3F9442")).join("") +
    `<g fill="#78C760" stroke="#4F9F45" stroke-width="4"><circle cx="640" cy="790" r="40"/><circle cx="690" cy="785" r="32"/><circle cx="1320" cy="800" r="38"/></g>`);
  tileSet("#Lground", `<path d="M0 870 Q480 830 960 862 T1920 858 V1300 H0Z" fill="#6CC75A"/><path d="M0 1010 Q480 980 960 1004 T1920 1000 V1300 H0Z" fill="#62BB51"/>` +
    [80, 260, 430, 610, 900, 1120, 1340, 1500, 1690, 1850].map((x, i) => tuft(x, 900 + (i * 37) % 100)).join("") +
    [[140, 940, "#FF8FB1"], [380, 990, "#fff"], [700, 950, "#B58CFF"], [1060, 1000, "#FFD84D"], [1270, 940, "#FF8FB1"], [1580, 990, "#fff"], [1780, 950, "#B58CFF"]].map(([x, y, c]) => flower(x, y, c)).join(""));
  tileSet("#Lfront", [[120, 1070, "#FF6F91", 1.7], [1000, 1090, "#FFC23D", 1.5], [1560, 1075, "#A66BFF", 1.8]].map(([x, y, c, s]) => flower(x, y, c, s)).join("") +
    `<g fill="#4FAE48">${[60, 220, 900, 1150, 1480, 1700].map((x) => `<path d="M${x} 1080 q14 -70 24 0 q8 -90 22 0 q12 -60 26 0z"/>`).join("")}</g>`);

  // chorus burst (rays + glow), revealed through a growing circle
  $("#burst").innerHTML = `<svg viewBox="0 0 2520 1680" width="2520" height="1680"><defs><radialGradient id="gb"><stop offset="0" stop-color="#FFF6C9"/><stop offset=".55" stop-color="#FFE07A" stop-opacity="0"/></radialGradient></defs>
    <rect id="burstBg" width="2520" height="1680" fill="#FFB547"/><g id="burstRays" transform="translate(1060 920)">${Array.from({ length: 18 }, (_, i) => {
      const a1 = (i * 20 - 5) * Math.PI / 180, a2 = (i * 20 + 5) * Math.PI / 180;
      return `<path d="M0 0 L${(2400 * Math.cos(a1)).toFixed(0)} ${(2400 * Math.sin(a1)).toFixed(0)} L${(2400 * Math.cos(a2)).toFixed(0)} ${(2400 * Math.sin(a2)).toFixed(0)}Z" fill="#fff" opacity=".22"/>`; }).join("")}</g>
    <circle cx="1060" cy="920" r="700" fill="url(#gb)"/>
    <g id="burstDots">${Array.from({ length: 26 }, (_, i) => { const a = i * 2.4, r = 380 + (i * 97) % 700; return `<circle cx="${(1060 + r * Math.cos(a)).toFixed(0)}" cy="${(920 + r * Math.sin(a) * 0.8).toFixed(0)}" r="${10 + (i % 4) * 6}" fill="#fff" opacity=".45"/>`; }).join("")}</g></svg>`;

  // butterflies & birds
  for (let i = 0; i < 2; i++) { const b = document.createElement("div"); b.className = "abs bfly"; b.id = "bf" + i;
    const c = i ? "#FF8FB1" : "#FFC23D";
    b.innerHTML = `<svg viewBox="-35 -30 70 60" width="70" height="60"><g class="wing"><ellipse cx="-14" cy="-8" rx="16" ry="20" fill="${c}" stroke="#7A4A2A" stroke-width="3"/><ellipse cx="-12" cy="14" rx="11" ry="12" fill="${c}" stroke="#7A4A2A" stroke-width="3"/></g>
      <g class="wing2"><ellipse cx="14" cy="-8" rx="16" ry="20" fill="${c}" stroke="#7A4A2A" stroke-width="3"/><ellipse cx="12" cy="14" rx="11" ry="12" fill="${c}" stroke="#7A4A2A" stroke-width="3"/></g>
      <rect x="-4" y="-18" width="8" height="38" rx="4" fill="#5A3A22"/></svg>`;
    $("#bflies").appendChild(b); }
  for (let i = 0; i < 4; i++) { const b = document.createElement("div"); b.className = "abs bird"; b.id = "bd" + i;
    b.innerHTML = `<svg viewBox="0 0 90 50" width="90" height="50"><path class="wingp" d="M5 25 Q25 5 45 25 Q65 5 85 25" stroke="#3B4A6B" stroke-width="7" fill="none" stroke-linecap="round"/></svg>`;
    $("#birds").appendChild(b); }

  // balloons, notes, confetti, wind
