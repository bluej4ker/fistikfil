<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Pırt Pırt Boya Döktüm · Fıstık Fil</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Baloo 2"; font-weight: 400 800; font-display: block; src: url("assets/fonts/Baloo2-wght.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #B9824F; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Baloo 2", sans-serif; font-weight: 800; color: #2B2D42; background: #B9824F; }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
      #page { left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 960px 540px; background: #fff; }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      #charWrap { left: 0; top: 0; width: 600px; height: 640px; transform-origin: 0 0; }
      #char { position: absolute; inset: 0; overflow: visible; }
      #char svg { width: 600px; height: 640px; overflow: visible; }
      #bug { left: 40px; top: 36px; padding: 6px 26px 0; border-radius: 30px; background: rgba(255,255,255,.95); font-size: 36px; color: #3D7DD8; z-index: 60; box-shadow: 0 4px 0 rgba(0,0,0,.1); }
      #bug b { color: #F59E1B; }
      #lyric { left: 0; right: 0; top: 24px; height: 80px; display: flex; justify-content: center; z-index: 60; }
      .line { position: absolute; top: 0; padding: 4px 30px 0; border-radius: 40px; background: rgba(255,255,255,.94); font-size: 46px; line-height: 66px; white-space: nowrap; color: #8A93A6; box-shadow: 0 4px 0 rgba(0,0,0,.08); border: 3px solid #FFD43B; }
      .line span { display: inline-block; margin: 0 7px; transform-origin: 50% 80%; }
      .line span.on { color: #2B2D42; }
      .line span.snd { color: #E5484D; }
      .line span.hot { transform: scale(1.14); }
      #dim { inset: 0; background: #1B2340; opacity: 0; z-index: 54; }
      #end { left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; z-index: 55; display: flex; align-items: center; justify-content: center; }
      #end .sign { padding: 30px 60px 34px; text-align: center; background: #FFF4DC; border: 12px solid #D9891A; border-radius: 40px; box-shadow: 0 14px 0 rgba(60,30,0,.25); font-size: 104px; color: #3D9BFF; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="/*DUR*/" data-width="1920" data-height="1080">
      <audio id="song" src="assets/song2x_mix.m4a" data-start="0" data-duration="/*DUR*/" data-volume="1"></audio>
      <section id="world" class="clip" data-start="0" data-duration="/*DUR*/" data-track-index="0" data-layout-allow-overflow>
        <svg id="table" class="full" viewBox="0 0 1920 1080"></svg>
        <div id="page" class="abs" data-layout-allow-overflow>
          <div id="cam" data-layout-allow-overflow>
            <svg id="bgSvg" class="full" viewBox="0 0 1920 1080"></svg>
            <svg id="backSvg" class="full" viewBox="0 0 1920 1080"></svg>
            <div id="charWrap" class="abs"><div id="char"></div></div>
            <svg id="objSvg" class="full" viewBox="0 0 1920 1080"></svg>
            <svg id="fxSvg" class="full" viewBox="0 0 1920 1080"></svg>
          </div>
        </div>
        <div id="bug" class="abs">Fıstık <b>Fil</b></div>
        <div id="lyric" class="abs"></div>
        <div id="dim" class="abs"></div>
        <div id="end" class="abs"><div class="sign">Hoşça kalın çocuklar!</div></div>
      </section>
    </div>

    <script>
(function () {
  window.__timelines = window.__timelines || {};
  const $ = (s) => document.querySelector(s);
  const D = /*DUR*/, TAU = Math.PI * 2, OL = "#4C76B5", INK = "#2B2D42", PEN = "#55556A";
  const LINES = /*LINES*/;
  const BEAT = 60 / 118;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (e0, e1, x) => { const k = clamp((x - e0) / (e1 - e0), 0, 1); return k * k * (3 - 2 * k); };
  const lerp = (a, b, k) => a + (b - a) * k;
  const outBack = (x, s = 1.7) => { x = clamp(x, 0, 1); return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
  const win = (t, a, b, fi = 0.3, fo = 0.3) => smooth(a, a + fi, t) * (1 - smooth(b - fo, b, t));
  const beatPh = (t) => ((t - 8.298) / BEAT) * TAU;
  const f1 = (x) => x.toFixed(1), f3 = (x) => x.toFixed(3);
  const pen = (s) => s.replace(/<(path|circle|ellipse|line|rect)\b/g, '<$1 pathLength="1" class="pen"');

  // ───────── structure: two passes of the song, one swap moment ─────────
  const PULL0 = 79.75, PULL1 = 80.35, FLIP0 = 80.35, T_SWAP = 80.7, FLIP1 = 81.05, PUSH1 = 81.8;
  const P2 = 80;                                                  // pass-2 audio offset
  const VS = [0, 2, 4, 6, 8, 10];                                 // first line index of verses 1–6
  const tk = (k, p) => LINES[(p === 1 ? 0 : 14) + VS[k]].words[0][1];
  const tb = (k, p) => LINES[(p === 1 ? 0 : 14) + VS[k] + 1].words[0][1];
  const HOPS = (k, p) => LINES[(p === 1 ? 0 : 14) + VS[k] + 1].words.slice(0, 2).map((w) => w[1]);
  const IDS = ["apple", "banana", "fish", "frog", "grapes", "carrot"];
  const COL = { apple: "#FF5A5F", banana: "#FFC23D", fish: "#3D9BFF", frog: "#3FBF6F", grapes: "#A66BFF", carrot: "#FF7A3D", sun: "#FFC23D" };
  const FX1 = 560, FX2 = 700, FY = 1000, FS = 0.75;               // Fıstık spot per pass
  const STAGE = [{ x: 1090, y: 780 }, { x: 1170, y: 780 }];       // the object being coloured
  const SLOT = (k) => ({ x: 960 + k * 168, y: 585, s: 0.42 });    // shelf / sticker row
  const pop0 = (k, p) => tk(k, p) - (p === 1 ? 0.6 : 1.3);         // object arrives
  const mov0 = (k, p) => tb(k, p) + 2.5;                           // object leaves for the shelf
  const MOV = 0.9;
  const STAGE_DY = { grapes: 70, carrot: 40 }, STAGE_S = { grapes: 0.85 };
  const BANDS = [128, 186, 244, 302, 360, 418];
  const RAIN = ["#FF5A5F", "#FF9F1C", "#FFD43B", "#3FBF6F", "#3D9BFF", "#4C76B5", "#A66BFF"];

  // ───────── Fıstık rig ─────────
/*RIG*/
  const REST = [88, -140, 22], TRUMPET = [25, -110, 28], PUSH = [20, 70, 26], HOLD = [5, 40, 26], YAWN = [-60, -40, 26];

  // ───────── art ─────────
/*ART*/
  const ART = { apple: APPLE, banana: BANANA, fish: FISH, frog: FROG, grapes: GRAPES, carrot: CARROT, sun: SUN };

  // ───────── table (seen only while the page is pulled back) ─────────
  $("#table").innerHTML = `<rect width="1920" height="1080" fill="#C89466"/>` +
    Array.from({ length: 9 }, (_, i) => `<path d="M0 ${60 + i * 120} Q960 ${40 + i * 120} 1920 ${70 + i * 120}" stroke="#A9764B" stroke-width="5" fill="none" opacity=".7"/>`).join("") +
    `<g transform="translate(260 900) rotate(-20)"><rect x="-150" y="-16" width="300" height="32" rx="10" fill="#FF5A5F" stroke="#7A2B2B" stroke-width="5"/><path d="M150 -16 L200 0 L150 16Z" fill="#F2C9A0" stroke="#7A2B2B" stroke-width="5"/></g>
     <g transform="translate(1690 170) rotate(25)"><rect x="-130" y="-14" width="260" height="28" rx="10" fill="#3FBF6F" stroke="#245E35" stroke-width="5"/><path d="M130 -14 L172 0 L130 14Z" fill="#F2C9A0" stroke="#245E35" stroke-width="5"/></g>`;

  // ───────── backgrounds ─────────
  const HILLS = (a, b, s) => `<path d="M0 720 Q480 620 960 700 T1920 690 V1080 H0Z" fill="${a}" stroke="${s}" stroke-width="5"/><path d="M0 800 Q600 740 1200 800 T1920 790 V1080 H0Z" fill="${b}" stroke="${s}" stroke-width="5"/>`;
  const SHELF = (c, s) => `<rect x="860" y="628" width="1040" height="22" rx="8" fill="${c}" stroke="${s}" stroke-width="5"/><rect x="900" y="648" width="16" height="60" fill="${c}" stroke="${s}" stroke-width="4"/><rect x="1846" y="648" width="16" height="60" fill="${c}" stroke="${s}" stroke-width="4"/>`;
  const SKY = `<linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD3FF"/><stop offset="1" stop-color="#D8F3FF"/></linearGradient>`;
  $("#bgSvg").innerHTML = `
    <defs>${SKY}<clipPath id="cWipe"><circle id="wipeC" cx="900" cy="990" r="0"/></clipPath></defs>
    <g id="w1">
      <g id="grey"><rect width="1920" height="1080" fill="#D2D2D2"/>${HILLS("#BDBDBD", "#ABABAB", "#8E8E8E")}${SHELF("#BEBEBE", "#8E8E8E")}
        <g transform="translate(1640 180)">${SUN("#C8C8C8")}</g></g>
      <g id="colour" clip-path="url(#cWipe)"><rect width="1920" height="1080" fill="url(#gSky)"/>${HILLS("#9BDB7A", "#6FC05A", OL)}${SHELF("#C98A4B", "#7A4A22")}</g>
      <g id="bands"></g>
      <g id="clouds" fill="#fff" stroke="${OL}" stroke-width="4"></g>
      <g clip-path="url(#cWipe)"><g id="sunC" transform="translate(1640 180)">${SUN("#FFC23D")}</g></g>
    </g>
    <g id="w2">
      <rect width="1920" height="1080" fill="#FFF8E7"/>
      <g stroke="#BFD9F2" stroke-width="2">${Array.from({ length: 17 }, (_, i) => `<line x1="40" y1="${90 + i * 58}" x2="1880" y2="${90 + i * 58}"/>`).join("")}</g>
      <line x1="150" y1="40" x2="150" y2="1040" stroke="#F4A6A6" stroke-width="3"/>
      <rect x="30" y="30" width="1860" height="1020" rx="28" fill="none" stroke="#E3B778" stroke-width="12"/>
      <g id="frame2"></g>
      <g id="dusk" opacity="0"><rect width="1920" height="1080" fill="#3B4A8C" opacity=".35"/></g>
    </g>`;
  const FRAME_SEG = ["M58 58 H960", "M960 58 H1862", "M1862 58 V1022", "M1862 1022 H960", "M960 1022 H58", "M58 1022 V58"];

  // ───────── objects (both passes share the same nodes; pass decides how they are drawn) ─────────
  const HATCH = (() => { let d = "M-210 -250"; for (let i = 0, y = -250; y <= 230; i++, y += 34) d += ` L${i % 2 ? -210 : 210} ${y} L${i % 2 ? -210 : 210} ${y + 34}`; return d; })();
  let defs = "", body = "";
  [...IDS, "sun"].forEach((id) => {
    defs += `<clipPath id="cc_${id}"><circle id="ccr_${id}" cx="0" cy="-110" r="0"/></clipPath>
      <mask id="mh_${id}" maskUnits="userSpaceOnUse" x="-400" y="-400" width="800" height="800"><path id="mhp_${id}" d="${HATCH}" pathLength="1" stroke="#fff" stroke-width="60" fill="none" stroke-dasharray="1 1" stroke-dashoffset="1"/></mask>`;
    body += `<g id="o_${id}" opacity="0">
      <g id="tape_${id}" opacity="0"><rect x="-80" y="-120" width="90" height="34" fill="#F7E7A6" opacity=".85" transform="rotate(-18)"/><rect x="10" y="-112" width="90" height="34" fill="#F7E7A6" opacity=".85" transform="rotate(16)"/></g>
      <g id="g1_${id}">${ART[id]("#C4C4C4")}</g>
      <g id="g2_${id}" clip-path="url(#cc_${id})"><g id="g2m_${id}">${ART[id](COL[id])}</g></g>
      <g id="pn_${id}">${pen(ART[id]("none"))}</g>
    </g>`;
  });
  const CAN = `<g id="canG"><path d="M-70 -90 L70 -90 L60 90 L-60 90 Z" fill="#FFFFFF" stroke="${OL}" stroke-width="6" stroke-linejoin="round"/><path id="canBand" d="M-66 -40 L66 -40 L62 10 L-62 10 Z" fill="#FF5A5F"/><path d="M-70 -90 Q0 -130 70 -90" fill="none" stroke="${OL}" stroke-width="8"/><path d="M-50 -95 Q0 -170 50 -95" fill="none" stroke="${OL}" stroke-width="7"/></g>`;
  const PENCIL = `<g id="pencil" opacity="0"><g transform="rotate(-35)"><rect x="0" y="-13" width="190" height="26" rx="4" fill="#FFC94D" stroke="#7A5A12" stroke-width="4"/><rect x="190" y="-13" width="30" height="26" fill="#FF8FAB" stroke="#7A5A12" stroke-width="4"/><path d="M0 -13 L-38 0 L0 13Z" fill="#F2C9A0" stroke="#7A5A12" stroke-width="4"/><path d="M-26 -4 L-38 0 L-26 4Z" fill="#444"/></g></g>`;
  const CRAYON = `<g id="crayon" opacity="0"><rect x="0" y="-15" width="150" height="30" rx="8" id="crayBody" fill="#FF5A5F" stroke="${INK}" stroke-width="4"/><rect x="30" y="-15" width="16" height="30" fill="#fff" opacity=".5"/><path d="M150 -15 L195 0 L150 15Z" id="crayTip" fill="#FF5A5F" stroke="${INK}" stroke-width="4"/></g>`;
  $("#backSvg").innerHTML = `<g id="rainbow1"></g><g id="rainbow2"></g><ellipse id="fShadow" rx="170" ry="30" fill="rgba(40,60,90,.18)"/>`;
  $("#rainbow1").innerHTML = RAIN.map((c, i) => { const r = 640 - i * 22; return `<path d="M${960 - r} 1000 A${r} ${r} 0 0 1 ${960 + r} 1000" fill="none" stroke="${c}" stroke-width="20" stroke-linecap="round"/>`; }).join("");
  $("#rainbow2").innerHTML = RAIN.map((c, i) => { const r = 600 - i * 26; return `<path id="rb2_${i}" d="M${1100 - r} 1000 A${r} ${r} 0 0 1 ${1100 + r} 1000" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" fill="none" stroke="${c}" stroke-width="22" stroke-linecap="round"/>`; }).join("");
  $("#objSvg").innerHTML = `<defs>${defs}</defs>${body}<g id="stream"></g><g id="canW">${CAN}</g>${CRAYON}${PENCIL}`;
  $("#clouds").innerHTML = [[380, 230], [1180, 140]].map(([x, y], i) => `<g id="cl${i}"><ellipse cx="${x}" cy="${y}" rx="110" ry="50"/><ellipse cx="${x - 80}" cy="${y + 10}" rx="60" ry="40"/><ellipse cx="${x + 80}" cy="${y + 10}" rx="70" ry="42"/></g>`).join("");
  $("#frame2").innerHTML = FRAME_SEG.map((d, k) => `<path id="fr_${k}" d="${d}" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" stroke="${COL[IDS[k]]}" stroke-width="26" stroke-linecap="round" fill="none"/>`).join("");
  document.querySelectorAll(".pen").forEach((e) => { e.setAttribute("stroke", PEN); e.setAttribute("stroke-width", "5"); e.setAttribute("fill", "none"); e.setAttribute("stroke-dasharray", "1 1"); e.setAttribute("stroke-dashoffset", "1"); });

  // ───────── pure helpers ─────────
  // where is object k (scene coords + scale) at time t, in pass p
  function objAt(k, p, t) {
    const st0 = STAGE[p - 1], st = { x: st0.x, y: st0.y + (STAGE_DY[IDS[k]] || 0) }, sl = SLOT(k), m = smooth(mov0(k, p), mov0(k, p) + MOV, t);
    const arc = Math.sin(Math.PI * m) * 160;
    const s0 = STAGE_S[IDS[k]] || 1;
    let x = lerp(st.x, sl.x, m), y = lerp(st.y, sl.y, m) - arc, s = lerp(s0, sl.s, m);
    const pin = t - pop0(k, p);
    if (p === 1) s *= outBack(clamp(pin / 0.45, 0, 1));                       // pops in
    const hops = HOPS(k, p); hops.forEach((h) => { const u = t - h; if (u > 0 && u < 0.4) y -= 40 * Math.sin(Math.PI * u / 0.4); });
    return { x, y, s, vis: t >= pop0(k, p), m };
  }
  // lip-sync from word times
  function mouthAt(t) {
    let m = 0;
    LINES.forEach((L) => { if (t < L.words[0][1] - 0.1 || t > L.end + 0.3) return;
      L.words.forEach(([w, wt], i) => { const nt = (L.words[i + 1] || [0, L.end])[1], hold = clamp(nt - wt - 0.04, 0.1, 0.32), u = t - wt;
        if (u > 0 && u < hold) m = Math.max(m, Math.sin(Math.PI * u / hold) * (/^(pırt|hop|hey)/i.test(w) ? 1 : 0.75)); }); });
    return m;
  }
  const SOUND = /^(pırt|hop|hey)/i;

  // camera: event list [t0, hold, x, y, s]; strongest active event wins
  const CAMEV = [];
  for (let k = 0; k < 6; k++) {
    CAMEV.push([tk(k, 1) + 0.05, 1.5, 980, 720, 1.16]);                 // pass 1: punch to the pour
    CAMEV.push([tb(k, 1) - 0.1, 1.9, 960, 360, 1.08]);                  // pass 1: tilt up to the sky band
    CAMEV.push([tk(k, 2) - 1.3, 2.4, 1130, 760, 1.2]);                  // pass 2: close on the pencil + crayon
  }
  CAMEV.push([32.4, 4.2, 1090, 700, 1.15]);                             // fish dances on stage
  CAMEV.push([112.2, 3.4, 1170, 640, 1.12]);                            // fish sticker flutters
  CAMEV.push([118.4, 2.0, 1060, 330, 1.15]);                            // heart doodle
  CAMEV.push([168.0, 3.0, 1600, 260, 1.2]);                             // moon
  function camAt(t) {
    let best = { e: 0, x: 960, y: 540, s: 1 };
    CAMEV.forEach(([t0, hold, x, y, s]) => { const e = smooth(t0, t0 + 0.4, t) * (1 - smooth(t0 + hold, t0 + hold + 0.8, t)); if (e > best.e) best = { e, x, y, s }; });
    return { x: lerp(960, best.x, best.e), y: lerp(540, best.y, best.e), s: lerp(1, best.s, best.e) };
  }
  // page transform for the pass-1 → pass-2 page turn
  function pageAt(t) {
    const out = smooth(PULL0, PULL1, t), back = smooth(FLIP1, PUSH1, t);
    const k = out * (1 - back), s = lerp(1, 0.6, k), rot = -3 * k;
    let fx = 1;
    if (t > FLIP0 && t < FLIP1) { const u = (t - FLIP0) / (FLIP1 - FLIP0); fx = Math.abs(Math.cos(Math.PI * u)); }
    return { s, rot, fx, k };
  }

  // ───────── render(t) — every frame is a pure function of t ─────────
  const CAMEL = $("#cam"), PAGE = $("#page");
  function render(t) {
    const P = t < T_SWAP ? 1 : 2;

    // page + camera
    const pg = pageAt(t);
    PAGE.style.transform = `rotate(${f3(pg.rot)}deg) scale(${f3(pg.s)}) scaleX(${f3(Math.max(pg.fx, 0.002))})`;
    PAGE.style.boxShadow = pg.k > 0.01 ? `0 0 0 ${f1(16 / pg.s)}px #fff, 0 30px 60px rgba(0,0,0,${f3(0.35 * pg.k)})` : "none";
    const c = camAt(t), s = Math.max(1, c.s), hx = 960 / s, hy = 540 / s;
    const cx = clamp(c.x, hx, 1920 - hx), cy = clamp(c.y, hy, 1080 - hy);
    CAMEL.style.transform = `translate(960px, 540px) scale(${s.toFixed(4)}) translate(${f1(-cx)}px, ${f1(-cy)}px)`;

    // worlds
    $("#w1").style.display = P === 1 ? "block" : "none";
    $("#w2").style.display = P === 2 ? "block" : "none";
    $("#wipeC").setAttribute("r", f1(2400 * smooth(4.55, 6.3, t)));
    $("#clouds").querySelectorAll("g").forEach((g, i) => g.setAttribute("transform", `translate(${f1(((t * (14 + 8 * i) + i * 700) % 2400) - 600)} 0)`));
    const wink = t > 45.5 && t < 45.9 ? 1 - 0.9 * Math.sin((t - 45.5) / 0.4 * Math.PI) : 1;
    const se = $("#sunC .sunEyes"); if (se) se.setAttribute("transform", `scale(1 ${f3(wink)})`);
    let bands = "";
    for (let k = 0; k < 6; k++) { const b0 = tb(k, 1), w = 1920 * smooth(b0, b0 + 1.8, t); if (w <= 0) continue;
      bands += `<rect x="0" y="${BANDS[k]}" width="${f1(w)}" height="52" fill="${COL[IDS[k]]}" opacity=".85"/>`;
      if (t < b0 + 1.9) bands += `<g transform="translate(${f1(w)} ${BANDS[k] + 26})"><rect x="-10" y="-38" width="40" height="76" rx="8" fill="#8B5A2B" stroke="${INK}" stroke-width="4"/><rect x="30" y="-12" width="120" height="24" rx="10" fill="#C98A4B" stroke="${INK}" stroke-width="4"/></g>`; }
    $("#bands").innerHTML = bands;
    const dash = (e, q) => { e.setAttribute("stroke-dashoffset", f3(1 - q)); e.setAttribute("visibility", q > 0.002 ? "visible" : "hidden"); };
    for (let k = 0; k < 6; k++) { const a = tb(k, 2); dash($(`#fr_${k}`), smooth(a, a + 1.8, t)); }
    $("#dusk").setAttribute("opacity", f3(smooth(166, 170, t)));

    // objects
    const fx = P === 1 ? FX1 : FX2;
    [...IDS, "sun"].forEach((id) => {
      const g = $(`#o_${id}`), g1 = $(`#g1_${id}`), g2 = $(`#g2_${id}`), pn = $(`#pn_${id}`), mh = $(`#mhp_${id}`), cc = $(`#ccr_${id}`), tape = $(`#tape_${id}`);
      if (id === "sun") {
        if (P === 1) { g.setAttribute("opacity", 0); return; }
        const sk = smooth(81.9, 83.3, t), ht = smooth(83.3, 84.4, t), dn = smooth(166, 168.5, t);
        g.setAttribute("opacity", t > 81.85 && dn < 0.999 ? 1 : 0); g.setAttribute("transform", `translate(1640 ${f1(180 + 1100 * dn)})`);
        g1.setAttribute("opacity", 0); cc.setAttribute("r", 900); g2.setAttribute("mask", "url(#mh_sun)"); mh.setAttribute("stroke-dashoffset", f3(1 - ht));
        pn.querySelectorAll(".pen").forEach((e) => e.setAttribute("stroke-dashoffset", f3(1 - sk)));
        return;
      }
      const k = IDS.indexOf(id), o = objAt(k, P, t);
      g.setAttribute("opacity", o.vis ? 1 : 0);
      if (!o.vis) return;
      const bob = t > (P === 1 ? 72.85 : 152.85) && t < (P === 1 ? 79.7 : 166) ? 14 * Math.max(0, Math.sin(beatPh(t) / 2 + k)) : 0;
      let ex = 0, ey = 0, er = 0;
      if (P === 1 && id === "fish") { const u = t - 32.4; if (u > 0 && u < 5.0) { const go = smooth(0, 0.8, u), back = smooth(4.2, 5.0, u), j = go * (1 - back);
          ex = (STAGE[0].x - o.x) * j; ey = (STAGE[0].y - 40 - o.y) * j - 200 * Math.sin(Math.PI * Math.min(1, u / 0.8)) - 200 * Math.sin(Math.PI * clamp((u - 4.2) / 0.8, 0, 1));
          er = 18 * Math.sin(beatPh(t)) * j; } }
      if (P === 2 && id === "fish") { const u = t - 112.2; if (u > 0 && u < 3.6) { const j = win(t, 112.2, 115.8, 0.5, 0.6); ey = -140 * j + 20 * Math.sin(t * 7) * j; er = 25 * Math.sin(t * 5) * j; } }

        const a = tk(k, 1) + 0.5;

      } else {
        const a = tk(k, 2), sk = smooth(a - 1.3, a - 0.15, t), ht = smooth(a + 0.15, a + 1.6, t);

    });

    // pass 1: can + stream ; pass 2: pencil + crayon
    let stream = "", fx_ = "";
    const can = $("#canW"), pencil = $("#pencil"), crayon = $("#crayon");
    if (P === 1) {
      can.setAttribute("opacity", 1);

      let tilt = 95 * fall, k = -1;
      for (let i = 0; i < 6; i++) { const a = tk(i, 1); const w = smooth(a - 0.05, a + 0.25, t) * (1 - smooth(a + 1.3, a + 1.7, t)); if (w > 0.001) { tilt = Math.max(tilt, 62 * w); k = i; } }
      const walkIn = smooth(0.4, 3.4, t), cxp = lerp(-120, FX1 + 260, walkIn), cyp = 910;
      const tr = tilt * Math.PI / 180, lip = [cxp + 70 * Math.cos(tr) + 90 * Math.sin(tr), cyp + 70 * Math.sin(tr) - 90 * Math.cos(tr)];
      can.setAttribute("transform", `translate(${f1(cxp)} ${f1(cyp + 90)}) rotate(${f1(tilt)}) translate(0 -90)`);
      $("#canBand").setAttribute("fill", k >= 0 ? COL[IDS[k]] : "#FF5A5F");
      if (fall > 0.2 && t < 7.0) { const r = 60 + 340 * smooth(4.4, 5.2, t); stream += `<ellipse cx="${f1(cxp + 170)}" cy="996" rx="${f1(r)}" ry="${f1(r * 0.18)}" fill="#FF5A5F" opacity="${f3(1 - smooth(6.3, 7.0, t))}"/>`; }
      if (k >= 0) { const a = tk(k, 1), u = t - (a + 0.1);
        if (u > 0 && u < 1.25) { const st = { x: STAGE[0].x, y: STAGE[0].y + (STAGE_DY[IDS[k]] || 0) }, ty = st.y - 120 * (STAGE_S[IDS[k]] || 1), y = lerp(lip[1], ty, smooth(0, 0.35, u)), x = lerp(lip[0], st.x, smooth(0, 0.35, u)), wdt = 22 * (1 - smooth(0.9, 1.25, u));
          stream += `<path d="M${f1(lip[0])} ${f1(lip[1])} Q${f1((lip[0] + x) / 2 + 30)} ${f1(Math.min(lip[1], y) - 120)} ${f1(x)} ${f1(y)}" stroke="${COL[IDS[k]]}" stroke-width="${f1(wdt)}" fill="none" stroke-linecap="round"/>`;
          if (u > 0.35 && u < 1.0) for (let d = 0; d < 6; d++) { const ang = -Math.PI * (0.15 + d * 0.14), r = 30 + 90 * smooth(0.35, 0.9, u);
            stream += `<circle cx="${f1(st.x + Math.cos(ang) * r)}" cy="${f1(ty + Math.sin(ang) * r)}" r="${f1(11 * (1 - smooth(0.6, 1.0, u)))}" fill="${COL[IDS[k]]}"/>`; } } }
      pencil.setAttribute("opacity", 0); crayon.setAttribute("opacity", 0);
    } else {
      can.setAttribute("opacity", 0);
      // pencil sketches: the sun (81.9–83.3), each object, the heart, the moon
      const SK = [[81.9, 83.3, 1640, 180, 150]];
      for (let i = 0; i < 6; i++) SK.push([tk(i, 2) - 1.3, tk(i, 2) - 0.15, STAGE[1].x, STAGE[1].y, 130]);
      SK.push([118.4, 120.4, 1060, 330, 110]); SK.push([168.0, 170.0, 1600, 230, 100]);
      let pv = 0, px = 0, py = 0;
      SK.forEach(([a, b, x, y, r]) => { if (t > a - 0.2 && t < b + 0.3) { const u = clamp((t - a) / (b - a), 0, 1), ang = -Math.PI / 2 + u * TAU * 1.1;
        pv = win(t, a - 0.2, b + 0.3, 0.2, 0.3); px = x + Math.cos(ang) * r; py = y + Math.sin(ang) * r * 0.85 + 6 * Math.sin(t * 40); } });
      pencil.setAttribute("opacity", f3(pv)); pencil.setAttribute("transform", `translate(${f1(px)} ${f1(py)})`);
      // heart + moon doodles
      const hp = smooth(118.4, 120.4, t), mp = smooth(168.0, 170.0, t);
      if (hp > 0) fx_ += `<path d="M1060 400 C900 290 960 170 1060 250 C1160 170 1220 290 1060 400Z" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${f3(1 - hp)}" stroke="#FF5A5F" stroke-width="14" fill="${hp > 0.99 ? "rgba(255,90,95,.35)" : "none"}" stroke-linejoin="round"/>`;
      if (mp > 0) { fx_ += `<path d="M1640 140 A100 100 0 1 0 1700 320 A80 80 0 1 1 1640 140Z" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${f3(1 - mp)}" stroke="#E8B500" stroke-width="10" fill="${mp > 0.99 ? "#FFE27A" : "none"}"/>`;
        [[1300, 140], [1460, 320], [1780, 420], [1180, 300], [900, 160]].forEach(([x, y], i) => { const q = outBack(smooth(170 + i * 0.25, 170.4 + i * 0.25, t)); if (q > 0) fx_ += `<path transform="translate(${x} ${y}) scale(${f3(q)})" d="M0 -30 L9 -9 L30 0 L9 9 L0 30 L-9 9 L-30 0 L-9 -9Z" fill="#FFE27A" stroke="#C99A00" stroke-width="4"/>`; }); }
      // rainbow drawn arc by arc
      for (let i = 0; i < 7; i++) dash($(`#rb2_${i}`), smooth(152.85 + i * 0.35, 153.9 + i * 0.35, t));
    }
    $("#rainbow1").setAttribute("opacity", P === 1 ? f3(smooth(72.85, 74.5, t)) : 0);
    $("#rainbow1").setAttribute("transform", `translate(960 1000) scale(${f3(0.2 + 0.8 * outBack(smooth(72.85, 74.6, t), 1.2))}) translate(-960 -1000)`);
    $("#rainbow2").setAttribute("opacity", P === 2 ? 1 : 0);
    $("#stream").innerHTML = stream;

    // ── Fıstık ──
    let x = fx, y = FY, sc = FS, dance = 0, walk = 0, lift = 0, sq = 1;
    let A = REST[0], C = REST[1], L = REST[2], sleep = 0, crayOn = 0;
    if (P === 1) {
      const wi = smooth(0.4, 3.4, t); x = lerp(-260, FX1, wi); walk = wi > 0 && wi < 1 ? 1 : 0;
      if (t > 4.25 && t < 6.4) { A = lerp(REST[0], 60, smooth(4.25, 4.5, t)); }                        // surprised
      for (let k = 0; k < 6; k++) { const a = tk(k, 1), w = smooth(a - 0.1, a + 0.2, t) * (1 - smooth(a + 1.3, a + 1.7, t)); if (w > 0) { A = lerp(A, PUSH[0], w); C = lerp(C, PUSH[1], w); L = lerp(L, PUSH[2], w); } }
      if (t > 6.4 && t < 7.2) { const w = win(t, 6.4, 7.2, 0.2, 0.3); A = lerp(A, PUSH[0], w); C = lerp(C, PUSH[1], w); }      // sets the can upright
      if (t > 38.4 && t < 40.2) { const w = win(t, 38.4, 40.2, 0.2, 0.3); A = lerp(A, TRUMPET[0], w); C = lerp(C, TRUMPET[1], w); L = lerp(L, TRUMPET[2], w); }
      dance = Math.max(win(t, 40.6, 47.6, 0.4, 0.5), win(t, 72.85, 79.6, 0.3, 0.3));
    } else {
      const pop = smooth(84.0, 84.6, t); sq = pop <= 0 ? 0 : outBack(pop, 2.2); lift = 0;
      crayOn = smooth(86.4, 86.8, t) * (1 - smooth(176, 176.5, t));
      A = lerp(REST[0], HOLD[0], crayOn); C = lerp(REST[1], HOLD[1], crayOn); L = lerp(REST[2], HOLD[2], crayOn);
      for (let k = 0; k < 6; k++) { const a = tk(k, 2), w = win(t, a + 0.1, a + 1.7, 0.2, 0.3); if (w > 0) { A += 12 * w * Math.sin(t * 26); } }
      if (t > 118.3 && t < 120.6) A += 10 * win(t, 118.3, 120.6, 0.2, 0.2) * Math.sin(t * 20);
      dance = Math.max(win(t, 124.6, 128.2, 0.4, 0.5), win(t, 152.85, 165.5, 0.3, 0.5));
      const yawn = win(t, 172.0, 173.8, 0.4, 0.6); A = lerp(A, YAWN[0], yawn); C = lerp(C, YAWN[1], yawn);
      sleep = smooth(174.0, 175.0, t);
      if (sleep > 0) { A = lerp(A, 120, sleep); C = lerp(C, -40, sleep); }
    }
    const bph = beatPh(t);
    const bob = (8 + 12 * dance) * (1 - Math.cos(bph)) / 2 * (1 - sleep);
    el.rig.setAttribute("transform", `translate(0 ${f1(-bob + 14 * sleep)})`);
    const ea = 6 * Math.sin(bph) + 7 * dance * Math.sin(bph * 2);
    el.earL.setAttribute("transform", `rotate(${f1(-ea)} 222 230)`);
    el.earR.setAttribute("transform", `translate(600 0) scale(-1 1) rotate(${f1(-ea)} 222 230)`);
    el.tail.setAttribute("transform", `rotate(${f1(14 * Math.sin(bph / 2))} 432 470)`);
    el.pom.setAttribute("transform", `rotate(${f1(10 * Math.sin(bph - 0.8))} 300 100)`);
    el.head.setAttribute("transform", `rotate(${f1(8 * dance * Math.sin(bph / 2) + 10 * sleep)} 300 360)`);
    el.legs.forEach((g, i) => { const [px, py, ph] = LEGP[i], a = (walk ? 22 * Math.sin(t * 10 + ph) : 0) + 16 * dance * Math.sin(bph + ph), lf = walk ? 10 * Math.max(0, Math.sin(t * 10 + ph)) : 0;
      g.setAttribute("transform", `translate(${px} ${f1(py - lf)}) rotate(${f1(a)})`); });
    const blink = ((t + 1.3) % 3.7) < 0.13 ? 1 : 0, surprise = P === 1 ? win(t, 4.3, 6.2, 0.1, 0.4) : 0;
    el.lidL.setAttribute("height", f1(Math.max(blink * (1 - surprise), sleep) * 92)); el.lidR.setAttribute("height", f1(Math.max(blink * (1 - surprise), sleep) * 92));
    let lookX = 0, lookY = 0;
    if (P === 1 && t > 4.3) { lookX = 14; lookY = 4; }
    if (P === 2) { lookX = 16; lookY = 6; }
    if (P === 1 && t > 72.85) { lookX = 4; lookY = -14; }
    el.pupils.setAttribute("transform", `translate(${f1(lookX)} ${f1(lookY)}) scale(${f3(1 + 0.25 * surprise)})`);
    const mo = Math.max(mouthAt(t), 0.9 * surprise, P === 2 ? 0.9 * win(t, 172.0, 173.8, 0.4, 0.6) : 0) * (1 - sleep);
    const my = 334, md = `M224 ${my} Q250 ${my + 12} 276 ${my - 2} Q252 ${f1(my + 8 + 46 * mo)} 224 ${my} Z`;
    el.mouth.setAttribute("d", md); el.mclip.setAttribute("d", md); el.mouth.setAttribute("fill", mo > 0.04 ? "#8C2F45" : "none");
    el.tongue.setAttribute("ry", f1(mo > 0.15 ? 12 * mo : 0)); el.tongue.setAttribute("cy", f1(my + 6 + 24 * mo));
    drawTrunk(A + 3 * Math.sin(t * 2.3) * (1 - sleep), C, L);
    $("#charWrap").style.display = sq > 0.001 ? "block" : "none";
    $("#charWrap").style.transform = `translate(${f1(x - 300 * sc)}px, ${f1(y - 620 * sc - lift)}px) scale(${f3(sc)}) translate(300px, 620px) scale(${f3(Math.min(1.2, 0.6 + 0.4 * sq))}, ${f3(sq)}) translate(-300px, -620px)`;
    $("#fShadow").setAttribute("cx", f1(x)); $("#fShadow").setAttribute("cy", f1(FY + 2)); $("#fShadow").setAttribute("opacity", f3(Math.min(1, sq)));
    // crayon at the trunk tip
    if (crayOn > 0) {
      const tip = tipLocal(A, C, L), sx = x + (tip[0] - 300) * sc, sy = y + (tip[1] - 620) * sc - bob * sc;
      let kk = 0; for (let k = 0; k < 6; k++) if (t > tk(k, 2) - 2.5) kk = k;
      const ccol = t > 152 ? "#A66BFF" : t > 118 && t < 121 ? "#FF5A5F" : COL[IDS[kk]];
      $("#crayon").setAttribute("opacity", f3(crayOn)); $("#crayon").setAttribute("transform", `translate(${f1(sx - 20)} ${f1(sy)}) rotate(-8)`);
      $("#crayBody").setAttribute("fill", ccol); $("#crayTip").setAttribute("fill", ccol);
    }
    // paper tear when Fıstık pops out
    if (P === 2) { const tear = win(t, 83.5, 85.4, 0.2, 0.6); if (tear > 0) fx_ += `<path d="M${FX2 - 170} ${FY} q40 -${f1(30 * tear)} 85 0 q40 -${f1(26 * tear)} 85 0 q40 -${f1(32 * tear)} 85 0 q40 -${f1(24 * tear)} 85 0" stroke="#7A6A55" stroke-width="6" fill="#E8DCC4" opacity="${f3(tear)}"/>`; }

    // notes (pass-1 trumpet) and Zzz
    if (P === 1) for (let i = 0; i < 6; i++) { const u = t - (38.7 + i * 0.25); if (u > 0 && u < 1.6) fx_ += `<text x="${f1(FX1 - 150 - 40 * u + 30 * Math.sin(u * 6 + i))}" y="${f1(560 - 220 * u)}" font-size="64" fill="${RAIN[i]}" stroke="#fff" stroke-width="6" paint-order="stroke" opacity="${f3(1 - smooth(1.1, 1.6, u))}">♪</text>`; }
    if (P === 2 && sleep > 0) for (let i = 0; i < 3; i++) { let u = t - 174.5 - i * 0.9; if (u < 0) continue; u %= 2.7; fx_ += `<text x="${f1(FX2 + 120 + 40 * u)}" y="${f1(560 - 90 * u)}" font-size="${f1(50 + 20 * u)}" fill="#6C7BD9" stroke="#fff" stroke-width="6" paint-order="stroke" opacity="${f3(sleep * (1 - smooth(2.0, 2.7, u)))}">Z</text>`; }
    // confetti after the pass-2 song
    if (P === 2) for (let i = 0; i < 46; i++) { const u = t - (160.4 + (i % 9) * 0.05); if (u > 0 && u < 3.2) { const x0 = 120 + (i * 397) % 1700, y0 = -40 + 420 * u + 60 * u * u, r = (i * 47 + u * 300) % 360;
        fx_ += `<rect x="-12" y="-7" width="24" height="14" rx="3" fill="${RAIN[i % 7]}" transform="translate(${f1(x0 + 40 * Math.sin(u * 3 + i))} ${f1(y0)}) rotate(${f1(r)})" opacity="${f3(1 - smooth(2.6, 3.2, u))}"/>`; } }
    // sound words
    const POPS = [];
    for (let k = 0; k < 6; k++) { POPS.push([tk(k, 1) + 0.05, "PIRT!", FX1 + 330, 600, COL[IDS[k]], 1]); POPS.push([tb(k, 1), "HOP!", STAGE[0].x + 60, 560, COL[IDS[k]], 1]);
      POPS.push([tk(k, 2) + 0.05, "PIRT!", STAGE[1].x - 40, 560, COL[IDS[k]], 2]); POPS.push([tb(k, 2), "HOP!", 960, 230, COL[IDS[k]], 2]); }
    LINES.forEach((Ln) => Ln.words.forEach(([w, wt]) => { if (/^hey/i.test(w)) POPS.push([wt, "HEY!", 640 + (wt * 997 % 640), 420, "#FF7A3D", wt < T_SWAP ? 1 : 2]); }));
    POPS.forEach(([t0, txt, px, py, colr, pp]) => { const u = t - t0; if (pp !== P || u < 0 || u > 0.8) return; const q = outBack(clamp(u / 0.25, 0, 1), 2.6), o = 1 - smooth(0.55, 0.8, u);
      fx_ += `<text transform="translate(${px} ${f1(py - 30 * u)}) rotate(-6) scale(${f3(q)})" text-anchor="middle" font-size="130" font-weight="800" fill="${colr}" stroke="#fff" stroke-width="16" paint-order="stroke" opacity="${f3(o)}">${txt}</text>`; });
    $("#fxSvg").innerHTML = fx_;

    // lyrics (hidden while the page is pulled back)
    const lyr = $("#lyric");
    const i = LINES.findIndex((Ln) => t >= Ln.words[0][1] - 0.25 && t <= Ln.end + 0.5);
    const show = i >= 0 && pg.k < 0.02;
    if (lyr.dataset.i !== String(show ? i : -1)) { lyr.dataset.i = String(show ? i : -1); lyr.innerHTML = show ? `<div class="line" style="left:50%;transform:translateX(-50%)">${LINES[i].words.map(([w]) => `<span>${w}</span>`).join("")}</div>` : ""; }
    if (show) lyr.querySelectorAll("span").forEach((sp, j) => { const [w, wt] = LINES[i].words[j]; const on = t >= wt;
      sp.className = (on ? (SOUND.test(w) ? "snd" : "on") : "") + (on && t < wt + 0.25 ? " hot" : ""); });

    $("#dim").style.opacity = f3(0.45 * smooth(179.0, 180.2, t));
    const card = smooth(180.2, 180.8, t);
    $("#end").style.opacity = f3(card);
    $("#end").style.transform = `scale(${f3(0.6 + 0.4 * outBack(card, 2))})`;
  }

  // ───────── seek-safe timeline (CLAUDE.md §6.3) ─────────
  gsap.defaults({ lazy: false });
  const master = gsap.timeline({ paused: true });
  const clock = { _t: 0 };
  Object.defineProperty(clock, "t", { get() { return this._t; }, set(v) { this._t = v; render(v); } });
  master.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", immediateRender: false }, 0);
  window.addEventListener("hf-seek", (e) => render(e?.detail ? e.detail.time : master.time()));
  render(0);
  window.__timelines["main"] = master;
})();
