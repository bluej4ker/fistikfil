      let tilt = 0;
      for (let k = 0; k < 6; k++) { const tk = v(k, 1); tilt = Math.max(tilt, 80 * smooth(tk + 0.2, tk + 0.6, t) * (1 - smooth(tk + 1.2, tk + 1.6, t))); }
      tilt = -tilt;
      cano = `<g transform="translate(${cx0} ${cy0})">${CAN(tilt)}</g>`;
      for (let k = 0; k < 6; k++) {
        const tk = v(k, 1), u = t - (tk + 0.2);
        if (u > 0 && u < 1.0) {
          const [id, sx, sy] = STATIONS[k];
          const top = sy - 110, y = lerp(cy0 - 60, top, smooth(0, 0.5, u));
          fxo += `<path d="M${cx0 - 34} ${cy0 - 70} Q${cx0 - 70} ${(cy0 + y) / 2 - 60} ${sx + 10} ${y}" stroke="${OBJ_COL[id]}" stroke-width="${(18 * (1 - u * 0.3)).toFixed(1)}" fill="none" stroke-linecap="round" opacity=".9"/>`;
        }
      }
    }
    $("#can").innerHTML = cano;
    $("#scribble").innerHTML = "";
    for (let i = 0; i < 18; i++) {
      const ph = i * 1.37, x = (i * 211) % 1920 + 60 * Math.sin(t * 0.5 + ph), y = 120 + ((i * 317) % 760) + 40 * Math.cos(t * 0.7 + ph);
      const col = ["#FFE27A", "#FFFFFF", "#FF9FB2", "#B9E4FF"][i % 4];
      fxo += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(7 + (i % 4) * 3).toFixed(1)}" fill="${col}" opacity="${(0.55 + 0.4 * Math.sin(t * 2 + ph)).toFixed(2)}"/>`;
    }
    fxSvg.innerHTML = fxo;

    // brush (pass 1 line 2): a crayon stroke of the verse colour across the sky, handled by bands above
    // pass 2 brush: scribble drawn progressively in the verse colour
    if (!p1) {
      let sc = "";
      for (let k = 0; k < 6; k++) {
        const tb = vb(k, 2), q = smooth(tb, tb + 1.8, t);
        if (q <= 0) continue;
        const y0 = 170 + (k % 3) * 300, x0 = 200 + (k % 2) * 900;
        let d = `M${x0} ${y0}`; for (let i = 1; i < 9; i++) d += ` L${x0 + i * 110} ${y0 + (i % 2 ? 90 : -40)}`;
        sc += `<path d="${d}" pathLength="1" stroke="${OBJ_COL[STATIONS[k][0]]}" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1" stroke-dashoffset="${(1 - q).toFixed(3)}"/>`;
      }
      $("#scribble").innerHTML = sc;
      $("#scribble").setAttribute("transform", `translate(${(4 * Math.sin(t * 1.7)).toFixed(2)} ${(3 * Math.cos(t * 1.3)).toFixed(2)})`);
    }

    // Fıstık
    const fp = fistik(t);
    if (t > PASS2 - 0.2 && t < PASS2 + 1.0) fp.s *= 0.2 + 0.8 * outBack(smooth(PASS2 - 0.2, PASS2 + 0.8, t));
    const k = fp.k;
    const pose = fp.pose;
    const lead = p1 ? (k >= 0 ? v(k, 1) : 0) : (k >= 0 ? v(k, 2) : 0);
    const pour = p1 && k >= 0 ? smooth(lead, lead + 0.5, t) * (1 - smooth(lead + 1.2, lead + 1.6, t)) : 0;
    const dance = fp.dance || (isSinging(t) && fp.pose === "pour" ? 0.6 : 0);
    const bob = (9 + 10 * dance) * (1 - Math.cos(beatPh(t))) / 2;
    el.rig.setAttribute("transform", `translate(0 ${(-bob).toFixed(2)})`);
    const ea = 6 * Math.sin(beatPh(t)) + (dance ? 6 * Math.sin(beatPh(t) * 2) : 0);
    el.earL.setAttribute("transform", `rotate(${(-ea).toFixed(2)} 222 230)`);
    el.earR.setAttribute("transform", `translate(600 0) scale(-1 1) rotate(${(-ea).toFixed(2)} 222 230)`);
    el.tail.setAttribute("transform", `rotate(${(14 * Math.sin(beatPh(t) / 2)).toFixed(2)} 432 470)`);
    el.pom.setAttribute("transform", `rotate(${(10 * Math.sin(beatPh(t) - 0.8)).toFixed(2)} 300 100)`);
    const tilt = (dance ? 7 : 0) * Math.sin(beatPh(t) / 2) + 2 * Math.sin(TAU * t / (BEAT * 8));
    el.head.setAttribute("transform", `rotate(${tilt.toFixed(2)} 300 360)`);
    el.legs.forEach((g, i) => { const [px, py, ph] = LEGP[i], a = (dance ? 18 : 0) * Math.sin(beatPh(t) + ph) + (fp.walk ? 16 * Math.sin(t * 9 + ph) * (1 - fp.walk) : 0);
      g.setAttribute("transform", `translate(${px} ${py}) rotate(${a.toFixed(2)})`); });
    const blink = (t % 4.1) < 0.14 || (t > 44.7 && t < 45.1) ? 1 : 0, sleep = pose === "sleep" ? 1 : 0;
    const lid = clamp(Math.max(blink, sleep), 0, 1) * 92;
    el.lidL.setAttribute("height", lid.toFixed(1)); el.lidR.setAttribute("height", lid.toFixed(1));
    el.pupils.setAttribute("transform", `translate(${(fp.dance ? 6 : 0).toFixed(1)} ${(-4 * Math.sin(t * 1.3)).toFixed(1)})`);
    const sing = isSinging(t) && pose !== "sleep" ? 0.5 + 0.5 * Math.sin(t * 22) : 0;
    const m = Math.max(0, sing, sleep ? 0.9 : 0), my = 334;
    const md = `M224 ${my} Q250 ${my + 12} 276 ${my - 2} Q252 ${(my + 8 + 46 * m).toFixed(1)} 224 ${my} Z`;
    el.mouth.setAttribute("d", md); el.mclip.setAttribute("d", md); el.mouth.setAttribute("fill", m > 0.04 ? "#8C2F45" : "none");
    el.tongue.setAttribute("ry", (m > 0.15 ? 12 * m : 0).toFixed(1)); el.tongue.setAttribute("cy", (my + 6 + 24 * m).toFixed(1));
    let A = REST[0], C = REST[1], L = REST[2];
    if (pose === "pour") { A = lerp(REST[0], POUR[0], pour); C = lerp(REST[1], POUR[1], pour); L = lerp(REST[2], POUR[2], pour); }
    else if (pose === "reach") { A = REACH[0]; C = REACH[1]; L = REACH[2]; }
    else if (pose === "sleep") { A = 120; C = -40; L = 22; }
    if (p1 && k >= 0 && pose === "pour" && t > lead && t < lead + 1.2) { const sway = Math.sin(t * 9) * 10 * (1 - smooth(lead + 0.9, lead + 1.2, t)); A += sway; }
    drawTrunk(A + 3 * Math.sin(t * 2.3), C, L);
    $("#charWrap").style.display = "block";
    $("#charWrap").style.transform = `translate(${(fp.x - 300 * fp.s).toFixed(1)}px, ${(fp.y - 620 * fp.s).toFixed(1)}px) scale(${fp.s})`;

    // final rainbow
    const rb = p1 ? smooth(72.85, 76.5, t) : smooth(152.85, 156.5, t);
    rainbowG.setAttribute("transform", `translate(960 1000) scale(${(0.3 + 0.7 * rb).toFixed(3)}) translate(-960 -1000)`);
    rainbowG.setAttribute("opacity", rb.toFixed(3));

    // transitions
    let o = "";
    const curtain = (t0, d) => { const u = t - t0; if (u < 0 || u > d) return; o += `<rect x="${(1920 * (1 - smooth(0, d, u))).toFixed(1)}" y="0" width="1920" height="1080" fill="#FFF8E7"/>`; };
    curtain(PASS2 - 0.4, 1.0);
    const iu = t - 3.9;
    if (iu > 0 && iu < 0.9) { const r = iu < 0.45 ? 1500 * (1 - smooth(0, 0.45, iu)) : 1500 * smooth(0, 0.45, iu - 0.45);
      o += `<mask id="mIris"><rect width="1920" height="1080" fill="#fff"/><circle cx="960" cy="540" r="${r.toFixed(1)}" fill="#000"/></mask><rect width="1920" height="1080" fill="#2B2D42" mask="url(#mIris)"/>`; }
    tranSvg.innerHTML = o;

    // lyrics, end card
    lyricAt(t);
    $("#end").style.opacity = smooth(180, 184, t).toFixed(3);
    $("#flash").style.opacity = (t > 72.85 && t < 73.1) || (t > 152.85 && t < 153.1) ? 0.6 : 0;
  }

  // ───────── seek-safe timeline (CLAUDE.md §6.3) ─────────
  gsap.defaults({ lazy: false });
  const master = gsap.timeline({ paused: true });
  const clock = { _t: 0 };
  Object.defineProperty(clock, "t", { get() { return this._t; }, set(v) { this._t = v; render(v); } });
  master.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", immediateRender: false }, 0);
  window.addEventListener("hf-seek", (e) => render(e?.detail ? e.detail.time : master.time()));
  render(0);
  window.__timelines["main"] = master;
})();
    </script>
  </body>
