        $("#spraycan").setAttribute("opacity", f3(sprayW)); $("#spraycan").setAttribute("transform", `translate(${f1(sx + 10)} ${f1(sy - 30)}) rotate(${f1(28 + 4 * Math.sin(t * 30))})`);
        if (t > a + 0.1 && t < a + 1.55) for (let i = 0; i < 14; i++) { const u = ((t * 3 + i / 14) % 1), nx = sx + 60, ny = sy - 140;
          fx_ += `<circle cx="${f1(lerp(nx, st.x - 40 + 80 * Math.sin(i * 7.3), u))}" cy="${f1(lerp(ny, st.y - 30 + 60 * Math.cos(i * 4.1), u))}" r="${f1(5 + 9 * u)}" fill="#3D9BFF" opacity="${f3(0.7 * (1 - u))}"/>`; } }

          fx_ += `<line x1="${f1(st.x + Math.cos(ang) * (140 + 160 * u))}" y1="${f1(st.y + Math.sin(ang) * (100 + 120 * u))}" x2="${f1(st.x + Math.cos(ang) * (190 + 200 * u))}" y2="${f1(st.y + Math.sin(ang) * (140 + 150 * u))}" stroke="#3FBF6F" stroke-width="10" stroke-linecap="round" opacity="${f3(1 - u / 0.5)}"/>`; } }

      const cx0 = FX2(k), pts = []; for (let i = 0; i <= 44; i++) { const th = TAU * i / 44, r = 235 + (i % 2 ? 28 : -28); pts.push(`${f1(cx0 + r * Math.cos(th))} ${f1(FY2(k) - 8 + 0.24 * r * Math.sin(th))}`); }

    if (P === 1) for (let k = 0; k < 6; k++) { const b0 = tb(k, 1), bw = win(t, b0 - 0.15, b0 + 2.0, 0.2, 0.3); if (bw <= 0) continue;

      fx_ += `<g opacity="${f3(bw)}" transform="translate(${f1(tx)} ${f1(ty)}) rotate(${f1(-50 + 25 * Math.sin(t * 7))})"><rect x="-12" y="0" width="24" height="120" rx="10" fill="#C98A4B" stroke="${INK}" stroke-width="5"/><rect x="-16" y="-14" width="32" height="20" fill="#B8BCC8" stroke="${INK}" stroke-width="4"/><path d="M-18 -12 Q-22 -60 0 -78 Q22 -60 18 -12Z" fill="${col}" stroke="${INK}" stroke-width="5"/></g>`; }
    // notes (two toots in pass 1)
    if (P === 1) [[3.6, 4], [TOOT2 + 0.1, 6]].forEach(([t0, n]) => { for (let i = 0; i < n; i++) { const u = t - (t0 + i * 0.22); if (u > 0 && u < 1.6) { const [tx, ty] = tipAt();
      fx_ += `<text x="${f1(tx + 20 + 60 * u + 25 * Math.sin(u * 6 + i))}" y="${f1(ty - 40 - 220 * u)}" font-size="64" fill="${RAIN[i]}" stroke="#fff" stroke-width="6" paint-order="stroke" opacity="${f3(1 - smooth(1.1, 1.6, u))}">♪</text>`; } } });
    if (P === 1 && t > PEEK0 && t < PEEK1) { const w1 = win(t, PEEK0 + 0.2, PEEK0 + 1.6, 0.35, 0.35), w2 = win(t, PEEK0 + 2.1, PEEK0 + 3.6, 0.3, 0.35);
      if (w1 > 0) fx_ += `<g transform="translate(${f1(2120 - 500 * w1)} 860) rotate(${f1(-12 * w1)}) scale(1.15)">${FROG("#C4C4C4")}</g>`;

        fx_ += `<rect x="-12" y="-7" width="24" height="14" rx="3" fill="${RAIN[i % 7]}" transform="translate(${f1(x0 + 40 * Math.sin(u * 3 + i))} ${f1(y0)}) rotate(${f1(r)})" opacity="${f3(1 - smooth(2.4, 3.0, u))}"/>`; } }
    // sound words + colour words

    for (let k = 0; k < 6; k++) { const s1 = stageOf(k, 1), s2 = stageOf(k, 2);
      POPS.push([tk(k, 1) + 0.05, "PIRT!", FX1 + 300, 620, COL[IDS[k]], 1, 120]); POPS.push([tb(k, 1), "HOP!", s1.x + 60, 560, COL[IDS[k]], 1, 120]);
      POPS.push([tcw(k, 1), CWORD[IDS[k]], s1.x + 250, s1.y - 150, COL[IDS[k]], 1, 105, 1.6]);
      POPS.push([tk(k, 2) + 0.05, "PIRT!", s2.x - 60, s2.y - 260, COL[IDS[k]], 2, 120]); POPS.push([tb(k, 2), "HOP!", FX2(k) + 280 * (FACE2[k] || 1), FY2(k) - 640, COL[IDS[k]], 2, 120]);

    for (let k = 0; k < 6; k++) { const u = t - (tcw(k, P) - 0.08); if (u > 0 && u < 0.9) { const o = objAt(k, P, t);
