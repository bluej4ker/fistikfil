</div>
<script>
// ═══════════════ Bölüm 11 · Dandini Dandini Dastana · Fıstık Fil Ninnisi ═══════════════
// 6 tur: A (vokal) B (enstrümantal) A B A B. Tur k başı TS[k]. Gece, ay ve kamera bütün videoya göre;
// tur olayları turun saati u'ya göre. render(t) saf (CLAUDE.md §6.3). Uyku videosu: yavaş, parlamasız, kesmesiz.
window.__timelines = window.__timelines || {};
const W = 1920, H = 1080, DPR = window.devicePixelRatio || 1, D = /*DUR*/, L = 177.3, XF = 1.5;
const TS = [0, 1, 2, 3, 4, 5].map((k) => k * (L - XF));
const $ = (s) => document.querySelector(s), OL = "#4C76B5";
const LINES = /*LINES*/;
const [bx, fx, ox] = ["cvBack", "cvFront", "cvOver"].map((id) => { const c = document.getElementById(id); c.width = W * DPR; c.height = H * DPR; return c.getContext("2d"); });
/*PAINT*/
/*NIGHT*/
const io = (k) => (k = clamp(k), k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
const win = (t, a, b, fi = .5, fo = .5) => Math.min(sstep(a - fi, a, t), 1 - sstep(b, b + fo, t));
const WT = {}; LINES.forEach((l) => (WT[l.tag] = l.words.map((w) => w[1])));
const tourOf = (t) => { let k = 0; for (let i = 0; i < 6; i++) if (t >= TS[i]) k = i; return k; };

// ─────────── kamera ───────────
const CAM_A1 = [[0, 960, 540, 1, 0], [13, 1500, 800, 1.32, 3], [23.5, 960, 560, 1.0, 3.5], [29.5, 1320, 300, 1.6, 4], [40.5, 660, 760, 1.42, 3.5], [53, 960, 560, 1.04, 4],
  [73.5, 420, 860, 1.38, 3.5], [79, 1220, 880, 1.32, 3.5], [84.8, 430, 650, 1.42, 3.5], [90.5, 960, 540, 1.0, 4], [117.5, 680, 760, 1.38, 4.5], [139, 960, 540, 1.0, 9]];

const CAM_B = [[0, 960, 540, 1, 0], [22, 1500, 850, 1.28, 12], [55, 420, 860, 1.32, 12], [88, 960, 480, 1.0, 12], [120, 700, 760, 1.32, 12], [152, 960, 540, 1, 12]];

let CAM = [960, 540, 1];
const camOn = (x) => x.setTransform(DPR * CAM[2], 0, 0, DPR * CAM[2], DPR * (W / 2 - CAM[0] * CAM[2]), DPR * (H / 2 - CAM[1] * CAM[2]));

// ─────────── gece, ay ───────────
const nightAt = (t) => t < TS[1] ? lerp(.22, .85, t / TS[1]) : t < TS[2] ? lerp(.85, 1, (t - TS[1]) / (TS[2] - TS[1])) : 1;
const moonAt = (t) => [lerp(1600, 380, t / D), t < 40 ? lerp(600, 300, io(t / 36)) : 300 - 150 * Math.sin(Math.PI * (t - 40) / (D - 40))];

// ─────────── Fıstık ───────────
/*RIG*/
el.legs.forEach((g) => (g.style.display = "none")); el.tail.style.display = "none";
const HAT = document.getElementById("hat");
const BED = [760, 860], FP = [560, 940], FSC = .62, HATPOST = [1112, 772];
function beret(x, cx, cy, s, n) {   // Fıstık'ın beresi (karyolanın ayak ucu direğinde)

  x.fillStyle = mixC("#FF6B4A", "#8A4A4A", n); x.strokeStyle = mixC("#C94A2E", "#5A3030", n); x.beginPath(); x.arc(0, -64, 30, 0, 7); x.fill(); x.stroke();

const POSE = { rest: [88, -140, 22], wave: [45, -150, 28], yawn: [60, -210, 21], point: [20, -70, 27], blanket: [100, -40, 24], trumpet: [25, -110, 28] };

const T1 = (tag, i) => WT[`t1.${tag}`][i];
function fistikState(t) {

}
function drawFistik(st, n) {

  el.tongue.setAttribute("ry", mo > .15 ? (12 * mo).toFixed(1) : 0); el.tongue.setAttribute("cy", (my + 6 + 24 * mo).toFixed(1));
  el.lidL.setAttribute("height", (84 * st.lids).toFixed(1)); el.lidR.setAttribute("height", (84 * st.lids).toFixed(1));
  el.pupils.setAttribute("transform", `translate(${(st.lx * 10).toFixed(1)} ${(st.ly * 9).toFixed(1)})`);
  el.earL.setAttribute("transform", `rotate(${(-st.ea).toFixed(1)} 222 230)`);
  el.earR.setAttribute("transform", `translate(600 0) scale(-1 1) rotate(${(-st.ea).toFixed(1)} 222 230)`);

// ─────────── sahne ───────────
const CALF = [[1430, 860, .8, 1, "#F3E2C7"], [1720, 930, .75, -1, "#FFFFFF"]];
function calves(x, t, k, u, n) {
  CALF.forEach(([cx, cy, s, f, col], i) => {
    let px = cx, sleep = 0, walk = 0;
    if (k === 0) { const ent = io((u - (13.5 + i * 1.2)) / 5); px = lerp(2150 + i * 120, cx, ent); walk = ent > 0 && ent < 1;
      sleep = sstep(66 + i * 2, 70 + i * 2, u); }
    else sleep = 1;

  });
}
function ducks(x, t, k, u, n) {
  const NX = 1160, NY = 1010;
  nest(x, NX, NY, .62, n);
  [[0, 1, false], [-70, .7, true], [-130, .62, true]].forEach(([dx, s, baby], i) => {
    let px = NX + dx * .7 + 10, sleep = 1, walk = false;
    if (k === 0) { const a = io((u - (79.2 + i * .5)) / 4.2); if (u < 79.2 + i * .5) return; px = lerp(2050 + i * 110, px, a); walk = a < 1; sleep = sstep(84.5, 86, u); }

}
function scene(t, k, u, n) {

  // a few big stars wink in "Yıldızlar göz kırpmaya başladı"
  if (k === 0) { const wk = win(u, 36.5, 42, .5, .8); if (wk > 0) for (const [sx, sy, ph] of [[700, 120, 0], [1060, 220, 1.3], [1240, 90, 2.4], [420, 260, 3.1]]) {
    const p = .5 + .5 * Math.sin(u * 2.4 + ph); x.fillStyle = `rgba(255,246,200,${wk * (.4 + .6 * p)})`; x.beginPath();
    for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, r = (i % 2 ? 4 : 13) * (1 + .4 * p); x.lineTo(sx + Math.cos(a) * r, sy + Math.sin(a) * r); } x.fill(); } }
  for (const [tt, x0, y0] of [[TS[1] + 40, 1500, 110], [TS[3] + 70, 1300, 60], [TS[5] + 30, 1650, 140], [TS[0] + 108, 1450, 90]]) shootingStar(x, t, tt, x0, y0, n);
  const [MX, MY] = moonAt(t), glow = k === 0 ? win(u, 30, 36.5, .8, 1.5) : 0;
  moon(x, MX, MY, 72 * (1 + .08 * glow), t);
  hillsNight(x, n, t);
  for (const [tx, sc, sd] of [[150, .75, 1], [300, .6, 2], [1780, .8, 6], [1660, .62, 5]]) treeNight(x, tx, 690, sc, sd, n);
  let g = x.createLinearGradient(0, 680, 0, H); g.addColorStop(0, mixC("#7DBF62", "#28504A", n)); g.addColorStop(1, mixC("#4E9E3C", "#1C3A38", n)); x.fillStyle = g; x.fillRect(-200, 680, W + 400, H - 680 + 200);
  // hive + bee (verse 2 line 3), owl (from tour 4)

  if (k >= 3) owl(x, 1760, 560, .7, t, n, ((t % 7.3) / 7.3) > .94 ? 1 : 0);

  soilRows(x, 1230, 1900, 820, 5, n);

  const pillow = k === 0 ? Math.sin(clamp((u - 45) / .9) * Math.PI) : 0;

function firefliesHeart(x, t, n, heart) {
  const R = rng(5);

// rüya bulutu: sözler bulutun içinde canlanır

  const sec = u < 30 || (u > 53.5 && u < 74) || u > 139.5 ? "calves" : u < 53.5 ? "sky" : u < 96.5 ? "pond" : u < 118.8 ? "fish" : "calves";

    for (let i = 0; i < 3; i++) { const k = ((u / 3.6 + i / 3) % 1), jx = lerp(C[0] - 230, C[0] + 230, k), jy = C[1] + 40 - Math.sin(k * Math.PI) * 120;
