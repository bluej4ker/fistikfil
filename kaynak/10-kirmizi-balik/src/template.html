// ── pass 2 ending above water: everyone bursts out, rainbow, colour words, wave goodbye
function burstFish(u) {

    if (u < 69.4) { const p = jumpArc(u, 68.0 + i * .12, 69.4 + i * .12, 980, X, 760, 420 + i * 40); return { ...p, col: c, s: .5 }; }

// ─────────────── ekran geçişleri (cvOver, ekran koordinatı) ───────────────
