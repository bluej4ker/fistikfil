<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Uçağı Kaldırsana · Fıstık Fil</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Baloo 2 · SIL OFL 1.1 (assets/fonts/OFL-Baloo2.txt) */
      @font-face { font-family: "Baloo 2"; font-weight: 400 800; font-display: block; src: url("assets/fonts/Baloo2-wght.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #BFE6FF; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Baloo 2", sans-serif; font-weight: 800; color: #2B2D42; background: #BFE6FF; }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      #shake { position: absolute; inset: 0; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1300px; overflow: visible; }
      #charWrap { left: 0; top: 0; width: 600px; height: 640px; transform-origin: 0 0; }
      #char { position: absolute; inset: 0; overflow: visible; transform-origin: 300px 620px; }
      #char svg { width: 600px; height: 640px; overflow: visible; }
      .snd { left: 0; top: 0; font-size: 72px; line-height: 1; white-space: nowrap; -webkit-text-stroke: 12px #fff; paint-order: stroke fill; text-shadow: 0 6px 0 rgba(0,0,0,.14); transform-origin: 50% 60%; }
      .conf { width: 26px; height: 30px; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
      .ov { inset: 0; pointer-events: none; }
      #bug { left: 40px; top: 36px; padding: 6px 26px 0; border-radius: 30px; background: rgba(255,255,255,.95); font-size: 36px; color: #3D7DD8; z-index: 60; box-shadow: 0 4px 0 rgba(0,0,0,.1); }
      #bug b { color: #F59E1B; }
      #lyric { left: 0; right: 0; top: 22px; height: 70px; display: flex; justify-content: center; z-index: 60; }
      .line { opacity: 0; position: absolute; top: 0; padding: 2px 26px 0; border-radius: 34px; background: rgba(255,255,255,.9); font-size: 44px; line-height: 60px; white-space: nowrap; color: #8A93A6; box-shadow: 0 4px 0 rgba(0,0,0,.08); border: 3px solid #E2B477; }
      .line span { display: inline-block; margin: 0 8px; }
      #flash { inset: 0; background: #fff; opacity: 0; z-index: 48; pointer-events: none; }
      #burst { inset: 0; opacity: 0; z-index: 47; pointer-events: none; background: radial-gradient(circle at 50% 50%, #FFF6D6 0, #FFB86B 35%, #FF7A8A 70%, #A66BFF 100%); }
      #glow { inset: 0; background: radial-gradient(circle at 50% 55%, rgba(255,255,255,.5) 0, rgba(255,255,255,0) 60%); opacity: 0; mix-blend-mode: soft-light; z-index: 20; pointer-events: none; }
      #speed { z-index: 46; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="/*DUR*/" data-width="1920" data-height="1080">
      <audio id="song" src="assets/song.m4a" data-start="0" data-duration="/*DUR*/" data-volume="1"></audio>
      <section id="world" class="clip" data-start="0" data-duration="/*DUR*/" data-track-index="0" data-layout-allow-overflow>
        <div id="cam" data-layout-allow-overflow>
          <div id="shake" data-layout-allow-overflow>
            <svg id="setGarden" class="full" viewBox="0 0 1920 1300"></svg>

            <svg id="setSky" class="full" viewBox="0 0 1920 1300"></svg>

              <path id="trailTape" fill="none" stroke="#B98546" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0"/><path id="trailTape2" fill="none" stroke="#E2B477" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
              <g id="planeBackG"></g><g id="inPlane"></g></svg>
            <div id="charWrap" class="abs"><div id="char"></div></div>
            <svg id="actors" class="full" viewBox="0 0 1920 1300"></svg>
            <svg id="fxSvg" class="full" viewBox="0 0 1920 1300"></svg>

        </div>
        <div id="glow" class="abs"></div>
        <svg id="speed" class="abs ov" viewBox="0 0 1920 1080"></svg>
        <svg id="boxMask" class="abs ov" viewBox="0 0 1920 1080" style="z-index:49"></svg>
        <svg id="cloudWipe" class="abs ov" viewBox="0 0 1920 1080" style="z-index:49"></svg>
        <svg id="fog" class="abs ov" viewBox="0 0 1920 1080" style="z-index:49;opacity:0"></svg>
        <svg id="lensWheel" class="abs ov" viewBox="0 0 1920 1080" style="z-index:50"></svg>
        <svg id="tapeClose" class="abs ov" viewBox="0 0 1920 1080" style="z-index:52"></svg>
        <div id="burst" class="abs"></div>
        <div id="flash" class="abs"></div>
        <div id="bug" class="abs">Fıstık <b>Fil</b></div>
        <div id="lyric" class="abs"></div>
      </section>

    <script>
/*CAST*/
(function () {
  window.__timelines = window.__timelines || {};
  const $ = (s) => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const D = /*DUR*/, TAU = Math.PI * 2;
  const TC = ["#3D9BFF", "#FF5A5F", "#FFC23D", "#3FBF6F", "#A66BFF", "#FF7A3D"];
  const OL = "#4C76B5";
  const INK = "#2B2D42";
  const C = window.CAST;
  const LINES = /*LINES*/;
  const BEATS = /*BEATS*/;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (e0, e1, x) => { const k = clamp((x - e0) / (e1 - e0), 0, 1); return k * k * (3 - 2 * k); };
  const easeOut = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
  const easeIn = (x) => Math.pow(clamp(x, 0, 1), 3);
  const outBack = (x, s = 1.7) => { x = clamp(x, 0, 1); return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
  const lerp = (a, b, k) => a + (b - a) * k;
  const pIn = (t, t0, d) => clamp((t - t0) / d, 0, 1);
  const bump = (t, t0, d) => { const u = (t - t0) / d; return u > 0 && u < 1 ? Math.sin(Math.PI * u) : 0; };

/*RIG*/

  // ───────────────────────── tempo + lyric helpers ─────────────────────────
  function beatPos(t) {
    const n = BEATS.length;
    if (t <= BEATS[0]) return (t - BEATS[0]) / (BEATS[1] - BEATS[0]);
    if (t >= BEATS[n - 1]) return n - 1 + (t - BEATS[n - 1]) / (BEATS[n - 1] - BEATS[n - 2]);
    let lo = 0, hi = n - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (BEATS[m] <= t) lo = m; else hi = m; }
    return lo + (t - BEATS[lo]) / (BEATS[hi] - BEATS[lo]);
  }
  const BEAT = (BEATS[BEATS.length - 1] - BEATS[0]) / (BEATS.length - 1);
  const beatsIn = (a, b) => BEATS.filter((x) => x >= a && x <= b);
  const LT = {}; LINES.forEach((L, i) => (LT[L.tag] = i));
  const ts = (tag) => LINES[LT[tag]].words[0][1];
  const te = (tag) => LINES[LT[tag]].end;
  const words = (tag) => LINES[LT[tag]].words;
  const wt = (tag, i) => { const w = words(tag); return w[i < 0 ? w.length + i : i][1]; };
  const norm = (w) => w.replace("İ", "i").replace("I", "ı").toLowerCase().replace(/[^a-zçğıöşü]/g, "");
  const SOUND = { "pırt": "pirt", "vın": "vin", "güm": "gum", "olduuu": "oldu" };
  const SCOL = { pirt: "#FF7A3D", vin: "#3D9BFF", gum: "#E5484D", oldu: "#3FBF6F" };

  // ───────────────────────── key times + scenes ─────────────────────────
  const T = { shop: 16.4, run: 31.3, sky: 76.9, sun: 99.65, land: 122.7,
    hatOff: wt("k1.7", 2) + 0.05, crash: wt("k2.2", 2), poke: 66.4, lift: ts("n2.4"), heart0: ts("f.5"), heart1: te("f.6"), roll: ts("f.7"), loop: ts("s.1a"), fog: wt("b.8", 0) + 0.45 };
  const scene = (t) => t < T.shop ? 0 : t < T.run ? 1 : t < T.sky ? 2 : t < T.sun ? 3 : t < T.land ? 4 : 5;
  const SETS = ["setGarden", "setShop", "setRun", "setSky", "setSun", "setGarden"];
  const GROUND = [1010, 1040, 1060, 0, 0, 1040];

  const mk = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const cloud = (x, y, s, c = "#fff", id = "") => `<g ${id ? `id="${id}"` : ""} transform="translate(${x} ${y}) scale(${s})" fill="${c}"><circle cx="80" cy="80" r="50"/><circle cx="150" cy="58" r="62"/><circle cx="222" cy="82" r="46"/><rect x="60" y="80" width="190" height="50" rx="25"/></g>`;
  const sunFace = (id, c1 = "#FFD84D", c2 = "#F5B921") => `<g id="${id}"><g class="rays" fill="${c1}">${Array.from({ length: 12 }, (_, i) => `<rect x="-7" y="-118" width="14" height="42" rx="7" transform="rotate(${i * 30})"/>`).join("")}</g>
      <circle r="70" fill="${c1}" stroke="${c2}" stroke-width="6"/><g class="eyeL"><ellipse cx="-20" cy="-8" rx="7" ry="9" fill="#9A5B1E"/></g><g class="eyeR"><ellipse cx="20" cy="-8" rx="7" ry="9" fill="#9A5B1E"/></g>
      <ellipse cx="-36" cy="12" rx="12" ry="7" fill="#FF9F7A" opacity=".75"/><ellipse cx="36" cy="12" rx="12" ry="7" fill="#FF9F7A" opacity=".75"/><path d="M-18 14 Q0 32 18 14" stroke="#9A5B1E" stroke-width="6" fill="none" stroke-linecap="round"/></g>`;
  const tuft = (x, y, c = "#4FAE48") => `<path d="M${x - 18} ${y} q7 -30 11 0 q5 -38 11 0 q7 -28 14 0z" fill="${c}"/>`;
  const groundSet = (top, c1, c2) => `<path d="M-300 ${top} Q500 ${top - 40} 1000 ${top - 10} T2220 ${top} V1600 H-300Z" fill="${c1}"/><path d="M-300 ${top + 120} Q600 ${top + 90} 1200 ${top + 110} T2220 ${top + 105} V1600 H-300Z" fill="${c2}"/>`;
  const sky = (id, a, b, c, y0 = -400) => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".6" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient></defs><rect x="-400" y="${y0}" width="2720" height="${1700 - y0}" fill="url(#${id})"/>`;
  const flowers = (list) => list.map(([x, y, c]) => `<g transform="translate(${x} ${y})"><path d="M0 0 V-46" stroke="#3E8A32" stroke-width="6"/>${[0, 72, 144, 216, 288].map((a) => `<ellipse cx="0" cy="-60" rx="10" ry="15" fill="${c}" stroke="#fff" stroke-width="2" transform="rotate(${a} 0 -46)"/>`).join("")}<circle cy="-46" r="8" fill="#FFD43B"/></g>`).join("");
  const fence = (y, x0 = -200, n = 24, c = "#FFF4DC") => `<path d="M${x0} ${y - 60} H${x0 + n * 100} M${x0} ${y - 20} H${x0 + n * 100}" stroke="${c}" stroke-width="12"/>${Array.from({ length: n }, (_, i) => `<path d="M${x0 + i * 100} ${y} V${y - 90} l14 -16 l14 16 V${y}Z" fill="${c}" stroke="#C9B48E" stroke-width="3"/>`).join("")}`;

  // ── SET 0/5 · garden (start + landing) ──
  const TREE = { x: 1640, y: 1012 }, BOX = { x: 1240, y: 1015 }, POND = { x: 1660, y: 1100 }, HAY = { x: 330, y: 1060 }, LINE = { x: 1180, y: 1010 };
  E("setGarden").innerHTML = sky("gSkG", "#6EC3FF", "#B9E6FF", "#F2FBFF", -1200) + `<defs><linearGradient id="gEve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9F7A"/><stop offset=".55" stop-color="#FFC98A"/><stop offset="1" stop-color="#FFF1D2"/></linearGradient></defs><rect id="eveTint" x="-400" y="-1200" width="2720" height="2900" fill="url(#gEve)" opacity="0"/>
    <g id="clG">${cloud(140, 120, 0.8) + cloud(900, 60, 0.6) + cloud(1400, 180, 0.5)}</g><g transform="translate(560 220)">${sunFace("sunG")}</g>
    <path d="M-300 790 Q300 700 900 760 T2220 740 V1600 H-300Z" fill="#CFEFB4"/>
    ${[[120, 820, "#FF8FAB", "#E2577A"], [520, 790, "#FFD43B", "#E0A800"], [1420, 800, "#7FC4FF", "#3D7DD8"]].map(([x, y, c, r]) => `<g transform="translate(${x} ${y}) scale(.7)">${C.house(c, r === "#E0A800" ? "#FF7A3D" : "#FF5A5F", 140, 100)}</g>`).join("")}
    ${fence(900)}${groundSet(940, "#8FD46E", "#79C25A")}
    ${[60, 220, 900, 1880, 1980, 360, 1100].map((x, i) => tuft(x, 990 + (i % 3) * 40)).join("")}
    ${flowers([[110, 1000, "#FF5A5F"], [190, 1030, "#FFD43B"], [1880, 1010, "#A66BFF"], [980, 1050, "#FF8FAB"]])}
    <g transform="translate(${TREE.x} ${TREE.y})">${C.oak()}</g>
    <g id="bigBox" transform="translate(${BOX.x} ${BOX.y})"><path d="M-150 -40 L-170 -130 L-60 -130 L-40 -40Z" fill="url(#gKraft)" stroke="#7A4A22" stroke-width="6"/><path d="M150 -40 L176 -128 L70 -128 L40 -40Z" fill="url(#gKraft)" stroke="#7A4A22" stroke-width="6"/>
      <rect x="-150" y="-40" width="300" height="40" fill="#6E431F"/><rect x="-160" y="-30" width="320" height="200" rx="10" fill="url(#gKraft)" stroke="#7A4A22" stroke-width="7" transform="translate(0 0)"/><path d="M-60 -30 V170" stroke="#B98546" stroke-width="40" opacity=".9"/></g>
    <g id="landProps" opacity="0"><g transform="translate(${HAY.x} ${HAY.y})">${C.hay()}</g>
      <ellipse cx="${POND.x}" cy="${POND.y}" rx="230" ry="56" fill="#5CC2F0" stroke="#3A9AD0" stroke-width="7"/><ellipse cx="${POND.x - 50}" cy="${POND.y - 10}" rx="120" ry="18" fill="#B9EAFF" opacity=".6"/>
      <g transform="translate(${LINE.x} ${LINE.y})">${C.clothesline()}</g></g>`;

  // ── SET 1 · workshop (kraft colour event) ──
  E("setShop").innerHTML = `<rect x="-400" y="-400" width="2720" height="2100" fill="#E2AE72"/><rect x="-400" y="-400" width="2720" height="1250" fill="#D9A066"/>
    <g transform="translate(960 760)">${C.pegboard()}</g>
    <g transform="translate(330 170) rotate(-8)">${C.hammer()}</g><g transform="translate(520 150) rotate(6)">${C.wrench()}</g><g transform="translate(1320 200) rotate(-4)">${C.saw()}</g>
    <g transform="translate(1660 210)">${C.tapeRoll(1.1)}</g><g transform="translate(1780 260)">${C.tapeRoll(0.8)}</g>
    <g transform="translate(220 420)"><rect x="-120" y="-90" width="240" height="180" rx="16" fill="#9BD8FF" stroke="#fff" stroke-width="14"/><path d="M0 -90 V90 M-120 0 H120" stroke="#fff" stroke-width="10"/><circle cx="60" cy="-40" r="24" fill="#FFD84D"/></g>
    <g transform="translate(1500 860)">${C.bench()}</g>
    <path d="M-400 960 H2320 V1700 H-400Z" fill="#C98A4E"/>${Array.from({ length: 14 }, (_, i) => `<path d="M${-300 + i * 180} 960 L${-420 + i * 200} 1500" stroke="#B5763A" stroke-width="5"/>`).join("")}
    <path d="M-400 960 H2320" stroke="#7A4A22" stroke-width="10"/>`;

  // ── SET 2 · grass runway (grey + orange lights colour event) ──
  const RWY = 1100;
  E("setRun").innerHTML = sky("gSkR", "#5DB8FF", "#A8DEFF", "#F2FBFF", -1600) + `<g id="clR">${cloud(160, 140, 0.8) + cloud(1000, 40, 0.65) + cloud(1500, 210, 0.5) + cloud(500, -500, 0.9) + cloud(1300, -800, 1.0) + cloud(200, -1100, 0.8)}</g>
    <path d="M-300 820 Q200 690 700 780 T1500 760 T2220 780 V1600 H-300Z" fill="#B7E39A"/><path d="M-300 880 Q400 820 900 870 T2220 860 V1600 H-300Z" fill="#9AD67C"/>
    ${fence(950, -200, 26, "#FFFFFF")}${groundSet(985, "#8FD46E", "#7BC55C")}
    <path d="M-400 ${RWY - 70} L2320 ${RWY - 70} L2320 ${RWY + 70} L-400 ${RWY + 70}Z" fill="#9CA3AF" stroke="#6B7280" stroke-width="6"/>
    <path d="M-400 ${RWY} H2320" stroke="#fff" stroke-width="12" stroke-dasharray="70 60"/>
    ${Array.from({ length: 13 }, (_, i) => `<g transform="translate(${-80 + i * 170} ${RWY - 78})">${C.rwLight("rl" + i)}</g><g transform="translate(${-80 + i * 170} ${RWY + 104})">${C.rwLight("rm" + i)}</g>`).join("")}
    <g id="sockG" transform="translate(1800 960)">${C.windsock()}</g>`;

  // ── SET 3 · sky (blue colour event) ──
  E("setSky").innerHTML = sky("gSkS", "#3FA4FF", "#8FD0FF", "#E6F6FF", -400) + `<g id="town">${Array.from({ length: 16 }, (_, i) => `<g transform="translate(${-200 + i * 150} ${1240 + (i % 3) * 14}) scale(.5)">${C.house(TC[i % 6], ["#FF5A5F", "#FF7A3D", "#3D9BFF"][i % 3], 120, 90)}</g>`).join("")}<path d="M-400 1250 H2320 V1700 H-400Z" fill="#8FD46E"/></g>
    <g id="clS1">${Array.from({ length: 8 }, (_, i) => cloud(i * 420 - 200, 120 + (i * 137) % 600, 0.9 + (i % 3) * 0.3, "#fff")).join("")}</g>
    <g id="clS2" opacity=".85">${Array.from({ length: 6 }, (_, i) => cloud(i * 560 - 100, 900 + (i * 91) % 200, 1.4, "#F4FAFF")).join("")}</g>`;

  // ── SET 4 · above the clouds at sunset (pink/orange colour event) ──
  const SUNC = { x: 960, y: 470 };
  E("setSun").innerHTML = sky("gSkU", "#7A6CFF", "#FF8FAB", "#FFC27A", -400) + `<g transform="translate(${SUNC.x} ${SUNC.y}) scale(1.5)">${sunFace("sunU", "#FFE08A", "#FFB547")}</g>
    <g id="clU1" opacity=".9">${Array.from({ length: 7 }, (_, i) => cloud(i * 380 - 200, 140 + (i * 113) % 300, 0.7, "#FFE3EC")).join("")}</g>
    <g id="clU2">${Array.from({ length: 12 }, (_, i) => cloud(i * 230 - 300, 960 + (i % 3) * 50, 1.6, i % 2 ? "#FFF0F4" : "#FFE0EA")).join("")}<path d="M-400 1080 H2320 V1700 H-400Z" fill="#FFE8EF"/></g>`;

  // ───────────────────────── actors ─────────────────────────
  E("planeBackG").innerHTML = C.planeBack();
  const SEATS = { mouse: [-40, -300, 0.9], frog: [-140, -305, 0.8], duck: [-250, -300, 0.75] };
  E("inPlane").innerHTML = "";
  E("actors").innerHTML = `${C.defs()}${C.defs8()}
    <g id="planeFrontG">${C.planeFront("pl")}</g>
    <g id="steer" opacity="0">${C.wheelSteer()}</g>
    <g id="wheelRoll" opacity="0"><g class="wr">${C.button("#FF5A5F", 58)}</g></g>
    <g id="outPlane">
      <g id="frogPos"><g id="frog">${C.frog("fr")}</g></g>
      <g id="mousePos"><g id="mouse">${C.mouse("ms")}<g class="spiral" opacity="0">${[-12, 22].map((x) => `<path d="M${x} -118 m-8 0 a8 8 0 1 1 8 8 a12 12 0 1 1 -12 -12" stroke="#4A3F63" stroke-width="3" fill="#fff"/>`).join("")}</g></g></g>
      <g id="duckPos"><g id="duck">${C.duck("dk")}</g></g>
      <g id="ducklingPos"><g id="duckling">${C.duck("dl", true)}</g></g></g>
    <g id="wheelDrop" opacity="0">${C.button("#3D9BFF", 58)}</g>
    <g id="chocks">${[0, 1].map((i) => `<g id="ch${i}" opacity="0">${C.chock()}</g>`).join("")}</g>
    <g id="droneG" opacity="0">${C.drone("dr")}</g>
    <g id="photo" opacity="0"><rect x="-60" y="-70" width="120" height="140" rx="8" fill="#fff" stroke="#9AA8B8" stroke-width="4"/><rect x="-48" y="-58" width="96" height="92" fill="#BFE6FF"/>
      <circle cx="0" cy="-12" r="34" fill="#A3CAF2" stroke="${OL}" stroke-width="4"/><path d="M-34 -24 C-30 -60 30 -60 34 -24 Q0 -30 -34 -24Z" fill="#FFD966" stroke="#D9861A" stroke-width="3"/><circle cx="-12" cy="-8" r="9" fill="#fff" stroke="${INK}" stroke-width="2.5"/><circle cx="12" cy="-8" r="9" fill="#fff" stroke="${INK}" stroke-width="2.5"/><circle cx="-12" cy="-8" r="3" fill="${INK}"/><circle cx="12" cy="-8" r="3" fill="${INK}"/><ellipse cx="0" cy="12" rx="6" ry="8" fill="#8C2F45"/></g>
    <g id="rocketG" opacity="0">${C.rocket("rk")}</g>
    <g id="paperG" opacity="0">${C.paperPlane()}</g>
    <g id="birds">${[0, 1, 2].map((i) => `<g id="bd${i}" opacity="0">${C.bird()}</g>`).join("")}</g>
    <g id="flyHat" opacity="0"></g>
    <g id="flyPom" opacity="0"><circle r="30" fill="#FF6B4A" stroke="#C94A2E" stroke-width="5"/><circle cx="-10" cy="-10" r="9" fill="#FF9F86"/></g>
    <path id="tongue8" fill="none" stroke="#FF6F91" stroke-width="15" stroke-linecap="round" opacity="0"/>
