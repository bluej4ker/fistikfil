<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Küçük Kurbağa · Fıstık Fil</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Baloo 2 · SIL OFL 1.1 (assets/fonts/OFL-Baloo2.txt) */
      @font-face { font-family: "Baloo 2"; font-weight: 400 800; font-display: block; src: url("assets/fonts/Baloo2-wght.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #9BD8FF; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Baloo 2", sans-serif; font-weight: 800; color: #2B2D42;
              background: linear-gradient(#7CCBFF 0%, #B5E3FF 50%, #E6F6FF 100%); }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      #shake { position: absolute; inset: 0; }
      .layer { position: absolute; left: 0; top: 0; width: 3840px; height: 1300px; }
      .layer svg { position: absolute; top: 0; width: 1920px; height: 1300px; overflow: visible; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1300px; overflow: visible; }
      #sun { left: 1600px; top: 50px; width: 230px; height: 230px; transform-origin: 115px 115px; }
      #charWrap { left: 460px; top: 265px; width: 600px; height: 640px; transform-origin: 300px 620px; }
      #char { position: absolute; inset: 0; overflow: visible; transform-origin: 300px 620px; }
      #char svg { width: 600px; height: 640px; overflow: visible; }
      .snd { left: 0; top: 0; font-size: 96px; line-height: 1; white-space: nowrap; -webkit-text-stroke: 14px #fff; paint-order: stroke fill; text-shadow: 0 8px 0 rgba(0,0,0,.14); transform-origin: 50% 60%; }
      .bub { width: 22px; height: 22px; border-radius: 50%; border: 4px solid rgba(255,255,255,.95); background: rgba(160,225,255,.35); }
      .drop { width: 18px; height: 24px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #7FD3F5; border: 3px solid #fff; }
      .note { font-size: 66px; -webkit-text-stroke: 6px #fff; paint-order: stroke fill; }
      .conf { width: 20px; height: 28px; border-radius: 5px; }
      .card { left: 0; top: 0; height: 160px; white-space: nowrap; border-radius: 34px; background: #fff; border: 7px solid #FFC23D; box-shadow: 0 12px 0 rgba(0,0,0,.14);
              display: flex; align-items: center; gap: 6px; padding: 0 40px 0 14px; transform-origin: 50% 100%; }
      .card svg.ic { width: 120px; height: 120px; flex: none; }
      .card .w { font-size: 60px; line-height: 1; padding-top: 10px; white-space: nowrap; }
      .card .bd { position: absolute; right: -26px; top: -30px; width: 86px; height: 86px; border-radius: 50%; border: 7px solid #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,.15); }
      .card .bd svg { width: 50px; height: 50px; }
      .q { left: 0; top: 0; width: 100px; height: 100px; transform-origin: 50% 100%; }
      #title { left: 0; right: 0; top: 70px; text-align: center; }
      .big { display: inline-block; font-size: 150px; line-height: 1; }
      .big span { display: inline-block; -webkit-text-stroke: 12px #fff; paint-order: stroke fill; text-shadow: 0 9px 0 rgba(0,0,0,.13); }
      .sub { margin-top: 10px; font-size: 54px; font-weight: 700; line-height: 1.3; color: #fff; display: inline-block; padding: 6px 38px 0; background: #3FA34D; border-radius: 40px; box-shadow: 0 7px 0 rgba(0,0,0,.12); }
      #bug { left: 40px; top: 36px; padding: 6px 26px 0; border-radius: 30px; background: rgba(255,255,255,.92); font-size: 36px; color: #3D7DD8; }
      #bug b { color: #F59E1B; }
      #lyric { left: 0; right: 0; top: 34px; height: 90px; display: flex; justify-content: center; }
      .line { opacity: 0; position: absolute; top: 0; padding: 4px 40px 0; border-radius: 42px; background: rgba(255,255,255,.95); font-size: 56px; line-height: 78px; white-space: nowrap; color: #8A93A6; box-shadow: 0 6px 0 rgba(0,0,0,.08); }
      .line span { display: inline-block; margin: 0 11px; }
      #msg { left: 0; right: 0; top: 175px; text-align: center; opacity: 0; }
      #msg .big { font-size: 118px; }
      #end { left: 1000px; right: 20px; top: 240px; text-align: center; opacity: 0; }
      .bye { margin-top: 10px; font-size: 64px; font-weight: 700; line-height: 1.3; color: #fff; display: inline-block; padding: 8px 40px 0; border-radius: 50px; background: #3D9BFF; }
      #glow { inset: 0; background: radial-gradient(circle at 50% 55%, rgba(255,255,255,.55) 0, rgba(255,255,255,0) 60%); opacity: 0; mix-blend-mode: soft-light; }
      #vignette { inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,30,60,.16) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="/*DUR*/" data-width="1920" data-height="1080">
      <audio id="song" src="assets/song.mp3" data-start="0" data-duration="/*DUR*/" data-volume="1"></audio>
      <section id="world" class="clip" data-start="0" data-duration="/*DUR*/" data-track-index="0" data-layout-allow-overflow>
        <svg id="sun" class="abs" viewBox="0 0 230 230">
          <g id="rays" fill="#FFD84D" opacity=".9"></g>
          <circle cx="115" cy="115" r="66" fill="#FFD84D" stroke="#F5B921" stroke-width="5"/>
          <ellipse cx="96" cy="108" rx="6" ry="8" fill="#9A5B1E"/><ellipse cx="134" cy="108" rx="6" ry="8" fill="#9A5B1E"/>
          <ellipse cx="82" cy="126" rx="11" ry="7" fill="#FF9F7A" opacity=".7"/><ellipse cx="148" cy="126" rx="11" ry="7" fill="#FF9F7A" opacity=".7"/>
          <path d="M98 128 Q115 144 132 128" stroke="#9A5B1E" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg>
        <div id="cam" data-layout-allow-overflow>
          <div id="shake" data-layout-allow-overflow>
            <svg id="rainbow" class="full" viewBox="0 0 1920 1300"></svg>
            <div id="Lclouds" class="layer"></div>
            <div id="Lfar" class="layer"></div>
            <div id="Lmid" class="layer"></div>
            <div id="Lground" class="layer"></div>
            <div id="streamBack" class="full"><svg class="full" viewBox="0 0 1920 1300" id="bedSvg"></svg></div>
            <div id="charWrap" class="abs"><div id="char"></div></div>
            <div id="streamFront" class="full"><svg class="full" viewBox="0 0 1920 1300" id="waterSvg"></svg></div>
            <div id="drops"></div>
            <div id="bubs"></div>
            <div id="notes"></div>
            <div id="cards"></div>
            <div id="sndBox"></div>
            <div id="confBox"></div>
          </div>
        </div>
        <div id="glow" class="abs"></div>
        <div id="vignette" class="abs"></div>
        <div id="title" class="abs"><div class="big" id="titleBig"></div><br/><div class="sub" id="titleSub">Fıstık Fil ile Hayvanlar</div></div>
        <div id="bug" class="abs">Fıstık <b>Fil</b></div>
        <div id="lyric" class="abs"></div>
        <div id="msg" class="abs"><div class="big" id="msgBig"></div></div>
        <div id="end" class="abs"><div class="big" id="endBig"></div><br/><div class="bye" id="bye">Hoşça kal!</div></div>
      </section>
    </div>

    <script>
/*CAST*/
(function () {
  window.__timelines = window.__timelines || {};
  const $ = (s) => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const D = /*DUR*/, TAU = Math.PI * 2;
  const TC = ["#3D9BFF", "#FF5A5F", "#FFC23D", "#3FBF6F", "#A66BFF", "#FF7A3D"];
  const OL = "#4C76B5";
  const INK = "#2B2D42";
  const C = window.CAST;
  const LINES = /*LINES*/;
  const BEATS = /*BEATS*/;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (e0, e1, x) => { const k = clamp((x - e0) / (e1 - e0), 0, 1); return k * k * (3 - 2 * k); };

/*RIG*/

  // ───────────────────────── tempo: real beat grid (Gemini's tempo drifts) ─────────────────────────
  function beatPos(t) {
    const n = BEATS.length;
    if (t <= BEATS[0]) return (t - BEATS[0]) / (BEATS[1] - BEATS[0]);
    if (t >= BEATS[n - 1]) return n - 1 + (t - BEATS[n - 1]) / (BEATS[n - 1] - BEATS[n - 2]);
    let lo = 0, hi = n - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (BEATS[m] <= t) lo = m; else hi = m; }
    return lo + (t - BEATS[lo]) / (BEATS[hi] - BEATS[lo]);
  }
  const BEAT = (BEATS[BEATS.length - 1] - BEATS[0]) / (BEATS.length - 1);

  // ───────────────────────── lyric helpers ─────────────────────────
  const LT = {}; LINES.forEach((L, i) => (LT[L.tag] = i));
  const ts = (tag) => LINES[LT[tag]].words[0][1];
  const te = (tag) => LINES[LT[tag]].end;
  const norm = (w) => w.replace("İ", "i").replace("I", "ı").toLowerCase().replace(/[^a-zçğıöşü]/g, "");
  const SOUND = { "vırak": "frog", "vıraaak": "frog", "zıp": "frog", "şıp": "splash", "blup": "fish", "vak": "duck", "pırt": "fistik" };
  const SCOL = { frog: "#3FA34D", splash: "#2E9BD6", fish: "#FF7A3D", duck: "#F59E1B", fistik: "#FF5A5F" };
  // chorus windows → beat pulse (camera punch + glow)
  const CH = [["c1.1", "c1.2"], ["c2.1", "c2.2"], ["p.1", "p.3"], ["f.1", "f.8"]].map(([a, b]) => [ts(a) - 0.3, te(b) + 0.4]);
  const pulse = (t) => { if (!CH.some(([a, b]) => t >= a && t <= b)) return 0; const f = beatPos(t) % 1; return Math.exp(-7 * (f < 0 ? f + 1 : f)); };

  // ───────────────────────── geometry ─────────────────────────
  const SC = 0.85, WRAP = { x: 460, y: 265 };
  const toScene = (p) => [WRAP.x + 300 + (p[0] - 300) * SC, WRAP.y + 620 + (p[1] - 620) * SC];
  const bedY = (x) => x < 900 ? 905 : x < 1160 ? 905 + 140 * smooth(900, 1160, x) : 1045 + 6 * Math.sin(x / 70);
  const S = 788;                                                     // water surface (full stream)
  const LILY = 1640, FISHX = [1160, 1420, 1700], DUCKX = [1120, 1360];

  // ───────────────────────── scenery (Dere) ─────────────────────────
  const mk = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  for (let i = 0; i < 12; i++) mk("rect", { x: 109, y: 2, width: 12, height: 40, rx: 6, transform: `rotate(${i * 30} 115 115)` }, E("rays"));
  const tree = (x, y, s, c1, c2) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-12" y="-10" width="24" height="90" rx="10" fill="#A0703F" stroke="#6E4A27" stroke-width="4"/>
      <circle cx="0" cy="-60" r="70" fill="${c1}" stroke="${c2}" stroke-width="5"/><circle cx="-45" cy="-25" r="45" fill="${c1}" stroke="${c2}" stroke-width="5"/>
      <circle cx="45" cy="-25" r="45" fill="${c1}" stroke="${c2}" stroke-width="5"/><circle cx="-20" cy="-85" r="16" fill="#fff" opacity=".25"/></g>`;
  const flower = (x, y, c, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 V40" stroke="#3E9B47" stroke-width="5"/>
      ${[0, 72, 144, 216, 288].map((a) => `<ellipse cx="0" cy="-14" rx="9" ry="14" fill="${c}" transform="rotate(${a})"/>`).join("")}<circle r="8" fill="#FFD84D"/></g>`;
  const tuft = (x, y) => `<path d="M${x - 16} ${y} q6 -26 10 0 q4 -34 10 0 q6 -24 12 0z" fill="#4FAE48"/>`;
  const reed = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 Q-4 -70 6 -130" stroke="#3E9B47" stroke-width="7" fill="none"/><rect x="-1" y="-170" width="16" height="48" rx="8" fill="#8B5A2B"/><path d="M-10 0 Q-30 -50 -40 -90" stroke="#4FAE48" stroke-width="6" fill="none"/></g>`;
  const cloud = (x, y, s, c = "#fff") => `<g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><circle cx="80" cy="80" r="50"/><circle cx="150" cy="58" r="62"/><circle cx="222" cy="82" r="46"/><rect x="60" y="80" width="190" height="50" rx="25"/></g>`;
  const tileSet = (id, inner) => { E(id).innerHTML = [0, 1].map((k) => `<svg viewBox="0 0 1920 1300" style="left:${k * 1920}px">${inner}</svg>`).join(""); };
  tileSet("Lclouds", cloud(80, 150, 1) + cloud(1050, 110, 0.8) + cloud(1500, 230, 0.6));
  tileSet("Lfar", `<path d="M0 690 Q240 590 480 670 T960 660 T1440 650 T1920 690 V1300 H0Z" fill="#B9E5A0"/>` +
    [150, 520, 860, 1260, 1700].map((x, i) => tree(x, 670 - (i % 2) * 20, 0.45, "#8CCB6E", "#6FAF55")).join(""));
  tileSet("Lmid", `<path d="M0 760 Q320 700 640 750 T1280 745 T1920 760 V1300 H0Z" fill="#94D474"/>` +
    [300, 1000, 1550].map((x, i) => tree(x, 760, 0.8 + (i % 2) * 0.15, "#5DBB55", "#3F9442")).join("") +
    `<g fill="#78C760" stroke="#4F9F45" stroke-width="4"><circle cx="640" cy="760" r="40"/><circle cx="690" cy="755" r="32"/><circle cx="1320" cy="765" r="38"/></g>`);
  tileSet("Lground", `<path d="M0 800 Q480 770 960 795 T1920 792 V1300 H0Z" fill="#6CC75A"/><path d="M0 980 Q480 950 960 975 T1920 970 V1300 H0Z" fill="#62BB51"/>` +
    [80, 260, 430, 610, 900, 1120, 1340, 1500, 1690, 1850].map((x, i) => tuft(x, 860 + (i * 37) % 120)).join("") +
    [[140, 900, "#FF8FB1"], [380, 960, "#fff"], [700, 920, "#B58CFF"], [1060, 990, "#FFD84D"], [1270, 910, "#FF8FB1"], [1580, 970, "#fff"], [1780, 920, "#B58CFF"]].map(([x, y, c]) => flower(x, y, c)).join(""));
  E("rainbow").innerHTML = `<g id="rbG" opacity="0" fill="none" stroke-linecap="round">${["#FF5A5F", "#FF9F1C", "#FFD84D", "#3FBF6F", "#3D9BFF", "#A66BFF"].map((c, i) =>
    `<path class="rbArc" d="M${380 + i * 26} 760 A${580 - i * 26} ${520 - i * 26} 0 0 1 ${1540 - i * 26} 760" stroke="${c}" stroke-width="28" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>`).join("")}</g>`;
  const bedPts = []; for (let x = 560; x <= 2000; x += 20) bedPts.push(`${x} ${bedY(x).toFixed(1)}`);
  E("bedSvg").innerHTML = `<defs><linearGradient id="gMud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C79B6B"/><stop offset="1" stop-color="#9C6E45"/></linearGradient></defs>
    <path d="M560 1300 L560 812 Q600 776 700 774 Q1300 768 2000 772 L2000 1300Z" fill="url(#gMud)"/>
    <path d="M560 1300 L${bedPts.join(" L")} L2000 1300Z" fill="#B48558"/>
    ${[[760, 912, 26, 12], [1010, 1000, 30, 14], [1340, 1060, 40, 16], [1620, 1066, 32, 13], [1880, 1058, 36, 15]].map(([x, y, w, h]) => `<g transform="translate(${x} ${y})">${C.rock(w, h)}</g>`).join("")}
    <path d="M560 812 Q600 776 700 774 Q1300 768 2000 772" stroke="#4FAE48" stroke-width="16" fill="none" stroke-linecap="round"/>
    ${[640, 820, 1040, 1320, 1580, 1840].map((x) => tuft(x, 780)).join("")}${reed(1880, 790, 1.1)}${reed(1830, 795, 0.85)}
    <g id="fish0" class="fish">${C.fish("#FF9F43", "#FF6B3D")}</g><g id="fish1" class="fish">${C.fish("#FFD84D", "#F5B921")}</g><g id="fish2" class="fish">${C.fish("#FF8FB1", "#F2668B")}</g>`;
  E("waterSvg").innerHTML = `<defs><linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FD0F7" stop-opacity=".5"/><stop offset=".55" stop-color="#3FA6E0" stop-opacity=".62"/><stop offset="1" stop-color="#2E8FD0" stop-opacity=".85"/></linearGradient>
      <clipPath id="cChan2"><path d="M560 1300 L560 812 Q600 776 700 774 Q1300 768 2000 772 L2000 1300Z"/></clipPath></defs>
    <g clip-path="url(#cChan2)"><path id="water" fill="url(#gWater)"/><path id="waterHi" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
      <g id="ripples" fill="none" stroke="#fff" stroke-width="4" opacity=".6"></g></g>
    <g id="lilyG">${C.lily()}<g id="frogPos"><g id="frog">${C.frog()}</g></g></g>
    <g id="duck0" class="duck">${C.duck("#FFFFFF", 0.95)}</g><g id="duck1" class="duck">${C.duck("#FFD84D", 0.62)}</g>`;
  for (let i = 0; i < 6; i++) mk("ellipse", { id: "rp" + i, rx: 0, ry: 0 }, E("ripples"));

  // pools
  const pool = (host, n, cls, id, extra) => { for (let i = 0; i < n; i++) { const d = document.createElement("div"); d.className = "abs " + cls; d.id = id + i; d.style.opacity = 0; d.style.left = "0px"; d.style.top = "0px"; if (extra) extra(d, i); E(host).appendChild(d); } };
  pool("drops", 48, "drop", "dr"); pool("bubs", 40, "bub", "bb");
  pool("notes", 24, "note", "n", (d, i) => { d.textContent = i % 2 ? "♫" : "♪"; d.style.color = TC[i % 6]; });
  pool("confBox", 90, "conf", "cf", (d, i) => { d.style.background = TC[i % 6]; });
  const letters = (txt, host) => [...txt].forEach((ch, i) => { const s = document.createElement("span"); s.textContent = ch === " " ? "\u00A0" : ch; s.style.color = TC[i % 6]; host.appendChild(s); });
  letters("Küçük Kurbağa", $("#titleBig")); letters("Fıstık Fil", $("#endBig")); letters("Herkes farklı, herkes güzel!", $("#msgBig"));

  // body-part cards: [id, icon, word, ok?, scene x, scene y]
  const CARDS = [["kKulak", "kulak", "KULAK", false, LILY - 400, 430], ["kKuyruk", "kuyruk", "KUYRUK", false, LILY - 440, 430],
    ["kAyak", "ayak", "AYAK", false, FISHX[1] - 250, 500], ["kDis", "dis", "DİŞ", false, DUCKX[1] - 230, 470], ["kFil", "filkulak", "KULAK", true, 960, 250]];
  const X_SVG = `<svg viewBox="0 0 50 50"><path d="M12 12 L38 38 M38 12 L12 38" stroke="#fff" stroke-width="10" stroke-linecap="round"/></svg>`;
  const OK_SVG = `<svg viewBox="0 0 50 50"><path d="M9 26 L21 38 L42 12" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  E("cards").innerHTML = CARDS.map(([id, ic, w, ok, x, y]) => `<div class="abs card" id="${id}" style="opacity:0;left:${x}px;top:${y}px;border-color:${ok ? "#3FBF6F" : "#FFC23D"}">
      <svg class="ic" viewBox="-60 -60 120 120">${C.icon[ic]()}</svg><div class="w" style="color:${ok ? "#3FA34D" : "#2B2D42"}">${w}</div>
      <div class="bd" id="${id}B" style="background:${ok ? "#3FBF6F" : "#E5484D"};opacity:0">${ok ? OK_SVG : X_SVG}</div></div>`).join("") +
    ["qFrog", "qFish", "qDuck", "qFistik"].map((id) => `<svg class="abs q" id="${id}" viewBox="-50 -50 100 100" style="opacity:0">${C.qmark()}</svg>`).join("");

  // ───────────────────────── lyrics + sound words ─────────────────────────
  LINES.forEach((L, li) => { const d = document.createElement("div"); d.className = "line"; d.id = "ln" + li;
    L.words.forEach((w, wi) => { const s = document.createElement("span"); s.id = `w${li}_${wi}`; s.textContent = w[0]; d.appendChild(s); }); E("lyric").appendChild(d); });
  const SND = []; let k = 0;
  LINES.forEach((L) => L.words.forEach(([w, t]) => { const n = norm(w); if (!(n in SOUND)) return; const who = SOUND[n], j = k++ % 3;
    let x, y;
    if (who === "frog") { x = LILY + [-420, -160, -300][j]; y = [470, 420, 350][j]; }
    else if (who === "splash") { x = LILY - 120; y = 660; }
    else if (who === "fish") { x = FISHX[1] + [-230, 40, -100][j]; y = [600, 560, 500][j]; }
    else if (who === "duck") { x = DUCKX[1] + [-300, -60, -180][j]; y = [560, 520, 450][j]; }
    else { x = [880, 1040, 960][j]; y = [250, 300, 180][j]; }
    SND.push({ txt: n === "vıraaak" ? "VIRAAAK!" : w.replace(/[^\p{L}]/gu, "").toLocaleUpperCase("tr") + "!", t, x, y, r: [-9, 7, -3][j], c: SCOL[who] }); }));
  E("sndBox").innerHTML = SND.map((s, i) => `<div class="abs snd" id="sd${i}" style="opacity:0;color:${s.c}">${s.txt}</div>`).join("");

  // ───────────────────────── animated state ─────────────────────────
  const POSE = { rest: [88, -140, 22], trumpet: [25, -110, 28], kick: [18, -112, 29.5], wave: [40, -130, 26] };
  const TRUMP = toScene(tipLocal(...POSE.trumpet));
  const R = { A: POSE.rest[0], C: POSE.rest[1], L: POSE.rest[2], mouth: 0, blink: 0, lookX: 0, lookY: 0, earAmp: 1, flap: 0, walk: 0, sway: 0, tilt: 0, bob: 1, dance: 0 };
  const W = { x: 0, sx: 0, fx: 0 };                                   // world scroll, stream slide, Fıstık x offset
  const CAM = { x: 960, y: 560, s: 1.0, r: 0 };
  const ENV = { rainbow: 0, glow: 0 };
  const AN = { fishUp: 0, frogIn: 0, frogOpen: 0, frogNo: 0, frogTurn: 1, fishO: 0, fishNo: 0, duckOpen: 0, duckNo: 0, duckIn: 0, party: 0, swim: 0, frogBlink: 0 };
  const JUMP = { f0: 0, f1: 0, f2: 0, frog: 0 };
  const EV = { notes: [], drops: [], bubs: [], conf: [] };

  // ── choruses: frog jumps on every "zıp"/second "vırak", splash on "şıp", glow + beat punch ──

    LINES[LT[c + ".1"]].words.forEach(([w, t], i) => { if (i % 2 === 1) jump("frog", t, 0.42); squash(t, 0.4); });
