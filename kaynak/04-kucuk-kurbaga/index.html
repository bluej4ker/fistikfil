    <style>
      /* Baloo 2 · SIL OFL 1.1 (assets/fonts/OFL-Baloo2.txt) */
      @font-face { font-family: "Baloo 2"; font-weight: 400 800; font-display: block; src: url("assets/fonts/Baloo2-wght.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #9BD8FF; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Baloo 2", sans-serif; font-weight: 800; color: #2B2D42; }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      #sky { inset: 0; background: linear-gradient(#7CCBFF 0%, #B5E3FF 50%, #E6F6FF 100%); }
      #skyGold { inset: 0; background: linear-gradient(#FF9E6B 0%, #FFC48A 45%, #FFE6C2 100%); opacity: 0; }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      #shake { position: absolute; inset: 0; }
      .layer { position: absolute; left: 0; top: 0; width: 3840px; height: 1300px; }
      .layer svg { position: absolute; top: 0; width: 1920px; height: 1300px; overflow: visible; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1300px; overflow: visible; }
      #sun { left: 1600px; top: 50px; width: 230px; height: 230px; transform-origin: 115px 115px; }
      #charWrap { left: 460px; top: 265px; width: 600px; height: 640px; transform-origin: 300px 620px; }
      #char { position: absolute; inset: 0; overflow: visible; transform-origin: 300px 620px; }
      #char svg { width: 600px; height: 640px; overflow: visible; }
      .tl { left: 0; top: 0; font-size: 124px; line-height: 1; white-space: nowrap; -webkit-text-stroke: 12px #fff; paint-order: stroke fill; text-shadow: 0 8px 0 rgba(0,0,0,.14); transform-origin: 50% 100%; }
      .snd { left: 0; top: 0; font-size: 96px; line-height: 1; white-space: nowrap; -webkit-text-stroke: 14px #fff; paint-order: stroke fill; text-shadow: 0 8px 0 rgba(0,0,0,.14); transform-origin: 50% 60%; }
      .bub { width: 22px; height: 22px; border-radius: 50%; border: 4px solid rgba(255,255,255,.95); background: rgba(160,225,255,.35); }
      .drop { width: 18px; height: 24px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #7FD3F5; border: 3px solid #fff; }
      .note { font-size: 66px; -webkit-text-stroke: 6px #fff; paint-order: stroke fill; }
      .conf { width: 20px; height: 28px; border-radius: 5px; }
      .card { left: 0; top: 0; height: 160px; white-space: nowrap; border-radius: 34px; background: #fff; border: 7px solid #FFC23D; box-shadow: 0 12px 0 rgba(0,0,0,.14);
              display: flex; align-items: center; gap: 6px; padding: 0 40px 0 14px; transform-origin: 50% 100%; backface-visibility: hidden; }
      .card svg.ic { width: 120px; height: 120px; flex: none; }
      .card .w { font-size: 60px; line-height: 1; padding-top: 10px; white-space: nowrap; }
      .card .bd { position: absolute; right: -26px; top: -30px; width: 86px; height: 86px; border-radius: 50%; border: 7px solid #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,.15); }
      .card .bd svg { width: 50px; height: 50px; }
      .card.chalk { background: #2F5D50; border-color: #8B5A2B; border-width: 12px; box-shadow: 0 12px 0 rgba(0,0,0,.18); }
      .card.chalk .w { color: #F4F1E6; }
      .card.bubble { border-radius: 50%; width: 300px; height: 300px; flex-direction: column; justify-content: center; padding: 0; gap: 0; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.85), rgba(190,235,255,.55) 45%, rgba(120,200,240,.35) 100%); border: 6px solid rgba(255,255,255,.95); box-shadow: none; }
      .card.leaf { background: #EAF7D9; border-color: #5DBB55; border-radius: 80px 14px 80px 14px; }
      .card.marquee { background: #3A1E5C; border-color: #FFC23D; border-width: 10px; padding: 0 56px 0 30px; }
      .card.marquee .w { color: #FFE27A; text-shadow: 0 0 18px rgba(255,210,80,.8); }
      .bulb { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #FFE27A; box-shadow: 0 0 10px #FFD23D; }
      .q { left: 0; top: 0; width: 100px; height: 100px; transform-origin: 50% 100%; }
      #chart { left: 0; top: 0; width: 600px; padding: 22px 28px 26px; border-radius: 36px; background: #FFF8E6; border: 12px solid #B5763A; box-shadow: 0 14px 0 rgba(60,30,0,.25); transform-origin: 0 50%; opacity: 0; }
      #chart .hd { position: relative; height: 92px; border-bottom: 5px dashed #E2C89B; margin-bottom: 12px; }
      #chart .hd > div { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 16px; white-space: nowrap; }
      #chart .row { height: 96px; display: flex; align-items: center; gap: 18px; }
      #chart .row svg { flex: none; }
      #chart .row .slot { position: relative; width: 84px; height: 84px; border-radius: 50%; border: 5px dashed #E2C89B; margin-left: auto; }
      #chart .row .slot svg { position: absolute; left: -5px; top: -5px; width: 84px; height: 84px; overflow: visible; }
      .big { display: inline-block; font-size: 150px; line-height: 1; }
      .big span { display: inline-block; -webkit-text-stroke: 12px #fff; paint-order: stroke fill; text-shadow: 0 9px 0 rgba(0,0,0,.13); }
      #bug { left: 40px; top: 36px; padding: 6px 26px 0; border-radius: 30px; background: rgba(255,255,255,.92); font-size: 36px; color: #3D7DD8; z-index: 60; }
      #bug b { color: #F59E1B; }
      #lyric { left: 0; right: 0; top: 34px; height: 90px; display: flex; justify-content: center; z-index: 60; }
      .line { opacity: 0; position: absolute; top: 0; padding: 4px 40px 0; border-radius: 42px; background: rgba(255,255,255,.95); font-size: 56px; line-height: 78px; white-space: nowrap; color: #8A93A6; box-shadow: 0 6px 0 rgba(0,0,0,.08); }
      .line span { display: inline-block; margin: 0 11px; }
      #msg { left: 0; right: 0; top: 160px; text-align: center; opacity: 0; z-index: 55; }
      #msg .big { font-size: 112px; }
      #end { left: 1080px; top: 0; width: 760px; height: 600px; transform-origin: 380px 0; opacity: 0; z-index: 55; }
      #end .rope { position: absolute; top: 0; width: 8px; height: 130px; background: #8B5A2B; border-radius: 4px; }
      #end .sign { position: absolute; left: 0; right: 0; top: 120px; padding: 30px 0 34px; text-align: center; background: #FFF4DC; border: 12px solid #B5763A; border-radius: 40px; box-shadow: 0 14px 0 rgba(60,30,0,.25); }
      .bye { margin-top: 8px; font-size: 62px; font-weight: 700; line-height: 1.3; color: #fff; display: inline-block; padding: 8px 40px 0; border-radius: 50px; background: #3D9BFF; }
      #under { inset: 0; opacity: 0; overflow: hidden; z-index: 30; }
      #under > svg:first-child { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
      #iris, #night, #flash, #polaroid, #flood, #splashWall, #rew { inset: 0; pointer-events: none; }
      #iris { z-index: 40; } #night { z-index: 35; opacity: 0; } #flash { z-index: 45; background: #fff; opacity: 0; }
      #polaroid { z-index: 44; opacity: 0; box-shadow: inset 0 0 0 34px #FFFDF7, inset 0 0 0 38px rgba(0,0,0,.12); }
      #flood { z-index: 42; opacity: 0; } #flood svg, #splashWall svg { width: 1920px; height: 1080px; }
      #splashWall { z-index: 43; }
      #rew { z-index: 46; opacity: 0; }
      #rew div { position: absolute; right: 70px; top: 150px; font-size: 120px; color: #fff; -webkit-text-stroke: 10px #E5484D; paint-order: stroke fill; }
      .curt { top: 0; width: 980px; height: 1080px; z-index: 41; background: repeating-linear-gradient(90deg, #B3122E 0 60px, #D7263D 60px 110px, #9E0F27 110px 140px); box-shadow: inset 0 -40px 0 #FFC23D; }
      #curtL { left: 0; transform: translateX(-1000px); } #curtR { right: 0; transform: translateX(1000px); }
      #glow { inset: 0; background: radial-gradient(circle at 50% 55%, rgba(255,255,255,.55) 0, rgba(255,255,255,0) 60%); opacity: 0; mix-blend-mode: soft-light; z-index: 20; }
      #warm { inset: 0; background: linear-gradient(rgba(255,160,90,.18), rgba(255,120,80,.12)); mix-blend-mode: multiply; opacity: 0; z-index: 21; }
      #vignette { inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,30,60,.16) 100%); z-index: 22; }
      #hud { inset: 0; z-index: 50; }
    </style>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="179.23" data-width="1920" data-height="1080">

      <section id="world" class="clip" data-start="0" data-duration="179.23" data-track-index="0" data-layout-allow-overflow>

    <script>
// Fıstık Fil · Küçük Kurbağa — supporting cast (Dere kadrosu + vücut parçası ikonları) (pure SVG strings, outlined, toddler-friendly)
window.CAST = (function () {
  const INK = "#2B2D42";
  // Fish: local origin = body centre, faces right. Groups: .tail, .mHappy, .mO, .mSad, .tear
  const fish = (c1, c2) => `
    <g class="tail"><path d="M-58 0 L-98 -34 Q-90 0 -98 34 Z" fill="${c2}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/></g>
    <path d="M-20 -40 Q0 -70 26 -42 Z" fill="${c2}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="0" cy="0" rx="66" ry="44" fill="${c1}" stroke="${INK}" stroke-width="4.5"/>
    <path d="M-6 -36 Q-18 0 -6 36" stroke="${c2}" stroke-width="7" fill="none" stroke-linecap="round" opacity=".7"/>
    <path d="M-30 10 Q-18 22 -6 10" stroke="${c2}" stroke-width="7" fill="none" stroke-linecap="round" opacity=".7"/>
    <ellipse cx="26" cy="-8" rx="15" ry="17" fill="#fff" stroke="${INK}" stroke-width="3"/>
    <circle class="pupil" cx="30" cy="-6" r="8.5" fill="${INK}"/><circle cx="33" cy="-10" r="3" fill="#fff"/>
    <ellipse cx="14" cy="16" rx="9" ry="5" fill="#FF8FAB" opacity=".7"/>
    <path class="mHappy" d="M46 12 Q54 20 62 10" stroke="${INK}" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse class="mO" cx="58" cy="12" rx="7" ry="8" fill="#8C2F45" stroke="${INK}" stroke-width="3" opacity="0"/>
    <path class="mSad" d="M46 18 Q54 9 62 18" stroke="${INK}" stroke-width="4" fill="none" stroke-linecap="round" opacity="0"/>
    <path class="tear" d="M24 12 q-6 10 0 14 q6 -4 0 -14z" fill="#6EC6FF" stroke="#2F8FD8" stroke-width="2" opacity="0"/>`;
  // Frog: origin = bottom centre (sits). Groups: .mHappy .mOpen .mSad .tear .legs
  const frog = () => `
    <g class="legs"><ellipse cx="-58" cy="-14" rx="36" ry="18" fill="#58B848" stroke="${INK}" stroke-width="4.5"/><ellipse cx="58" cy="-14" rx="36" ry="18" fill="#58B848" stroke="${INK}" stroke-width="4.5"/></g>
    <ellipse cx="0" cy="-58" rx="78" ry="60" fill="#6CCB5A" stroke="${INK}" stroke-width="4.5"/>
    <ellipse cx="0" cy="-40" rx="50" ry="32" fill="#C8F0A8"/>
    <circle cx="-38" cy="-112" r="30" fill="#6CCB5A" stroke="${INK}" stroke-width="4.5"/><circle cx="38" cy="-112" r="30" fill="#6CCB5A" stroke="${INK}" stroke-width="4.5"/>
    <circle cx="-38" cy="-114" r="20" fill="#fff" stroke="${INK}" stroke-width="3"/><circle cx="38" cy="-114" r="20" fill="#fff" stroke="${INK}" stroke-width="3"/>
    <circle cx="-35" cy="-112" r="10" fill="${INK}"/><circle cx="41" cy="-112" r="10" fill="${INK}"/><circle cx="-32" cy="-116" r="3.5" fill="#fff"/><circle cx="44" cy="-116" r="3.5" fill="#fff"/>
    <ellipse cx="-50" cy="-74" rx="12" ry="7" fill="#FF8FAB" opacity=".7"/><ellipse cx="50" cy="-74" rx="12" ry="7" fill="#FF8FAB" opacity=".7"/>
    <path class="mHappy" d="M-42 -78 Q0 -48 42 -78" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path class="mOpen" d="M-42 -80 Q0 -84 42 -80 Q0 -30 -42 -80Z" fill="#8C2F45" stroke="${INK}" stroke-width="4.5" stroke-linejoin="round" opacity="0"/>
    <path class="mSad" d="M-34 -62 Q0 -84 34 -62" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round" opacity="0"/>
    <path class="tear" d="M-50 -92 q-8 14 0 19 q8 -5 0 -19z" fill="#6EC6FF" stroke="#2F8FD8" stroke-width="2" opacity="0"/>`;
  // Duck: origin = waterline centre, faces left. Groups: .beakTop .beakBot .mSad .tear .wing
  const duck = (body, s = 1) => `<g transform="scale(${s})">
    <path d="M-70 -10 Q-80 -60 -20 -58 L60 -60 Q96 -64 92 -30 Q90 6 40 8 L-50 8 Q-70 6 -70 -10Z" fill="${body}" stroke="${INK}" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M78 -52 L100 -78 L94 -42Z" fill="${body}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
    <g class="wing"><path d="M0 -40 Q40 -52 62 -30 Q40 -10 4 -18Z" fill="#fff" stroke="${INK}" stroke-width="3.5" opacity=".9"/></g>
    <circle cx="-44" cy="-96" r="40" fill="${body}" stroke="${INK}" stroke-width="4.5"/>
    <circle cx="-56" cy="-104" r="9" fill="${INK}"/><circle cx="-53" cy="-107" r="3" fill="#fff"/>
    <ellipse cx="-66" cy="-84" rx="9" ry="5" fill="#FF8FAB" opacity=".7"/>
    <path class="beakTop" d="M-80 -92 Q-112 -94 -114 -84 Q-100 -80 -78 -84Z" fill="#FF9F1C" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>
    <path class="beakBot" d="M-80 -84 Q-108 -82 -110 -78 Q-96 -70 -78 -78Z" fill="#F07F0C" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>
    <path class="mSad" d="M-62 -122 L-44 -116" stroke="${INK}" stroke-width="4" stroke-linecap="round" opacity="0"/>
    <path class="tear" d="M-58 -94 q-6 10 0 14 q6 -4 0 -14z" fill="#6EC6FF" stroke="#2F8FD8" stroke-width="2" opacity="0"/></g>`;
  const lily = () => `<ellipse cx="0" cy="0" rx="90" ry="26" fill="#4FAE48" stroke="#2E7D32" stroke-width="4"/><path d="M0 0 L60 -20 L66 4Z" fill="#7FD3F5"/>
    <g transform="translate(-50 -10)"><circle r="12" fill="#FF8FB1"/><circle r="5" fill="#FFD84D"/></g>`;
  const rock = (w, h, c = "#A8A29E") => `<ellipse cx="0" cy="0" rx="${w}" ry="${h}" fill="${c}" stroke="#6B6560" stroke-width="4"/><ellipse cx="${-w * 0.3}" cy="${-h * 0.35}" rx="${w * 0.3}" ry="${h * 0.2}" fill="#fff" opacity=".25"/>`;
  const bulb = () => `<g><circle cx="0" cy="0" r="36" fill="#FFE45C" stroke="${INK}" stroke-width="4"/><rect x="-16" y="30" width="32" height="22" rx="5" fill="#B0B7C3" stroke="${INK}" stroke-width="4"/>
    <path d="M-10 4 Q0 -14 10 4" stroke="#F59E1B" stroke-width="4" fill="none"/>${[0, 45, 90, 135, 180, 225, 315].map((a) => `<rect x="-3" y="-66" width="6" height="18" rx="3" fill="#FFD84D" transform="rotate(${a})"/>`).join("")}</g>`;

  // Body-part icons for the "…nerede?" cards (viewBox -60 -60 120 120)
  const icon = {
    kulak: () => `<path d="M6 -48 C40 -50 52 -12 38 12 C30 26 18 28 14 42 C10 54 -10 52 -8 38 C-6 26 6 22 6 10 C6 0 -14 -4 -14 -20 C-14 -38 -8 -46 6 -48Z" fill="#FFC9A8" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
      <path d="M8 -28 C24 -28 28 -10 20 2" stroke="#E89A78" stroke-width="6" fill="none" stroke-linecap="round"/>`,
    kuyruk: () => `<path d="M-46 30 C-20 34 6 22 10 0 C14 -22 -6 -34 -18 -22 C-28 -12 -18 2 -6 -4" stroke="${INK}" stroke-width="16" fill="none" stroke-linecap="round"/>
      <path d="M-46 30 C-20 34 6 22 10 0 C14 -22 -6 -34 -18 -22 C-28 -12 -18 2 -6 -4" stroke="#F2A65A" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M22 -30 q24 -14 30 6 q-18 -2 -30 -6z" fill="#F2A65A" stroke="${INK}" stroke-width="4"/>`,
    ayak: () => `<ellipse cx="0" cy="14" rx="26" ry="34" fill="#FFC9A8" stroke="${INK}" stroke-width="5"/>
      ${[[-24, -30, 9], [-8, -40, 9], [8, -40, 9], [22, -32, 8], [32, -18, 7]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#FFC9A8" stroke="${INK}" stroke-width="4"/>`).join("")}`,
    dis: () => `<path d="M-34 -36 C-34 -50 -14 -48 0 -42 C14 -48 34 -50 34 -36 C34 -14 26 -4 22 20 C18 44 8 46 4 24 C2 14 -2 14 -4 24 C-8 46 -18 44 -22 20 C-26 -4 -34 -14 -34 -36Z" fill="#fff" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-20 -30 Q-12 -36 -4 -32" stroke="#B9D9F2" stroke-width="5" fill="none" stroke-linecap="round"/>`,
    filkulak: () => `<path d="M30 -46 C-40 -70 -64 8 -40 38 C-20 62 16 48 30 26 Z" fill="#A6CBF2" stroke="#4C76B5" stroke-width="5" stroke-linejoin="round"/>
      <path d="M24 -30 C-24 -46 -40 6 -26 26 C-12 42 12 34 24 18 Z" fill="#F7B3C8"/>`,
  };
  // little "?" and big sound bubble helpers
  const qmark = () => `<circle r="44" fill="#fff" stroke="${INK}" stroke-width="5"/><text y="24" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="70" fill="#A66BFF">?</text>`;

  // v2 · sticker-chart faces (viewBox -50 -50 100 100), stickers, props
  const face = {
    frog: () => `<ellipse cx="0" cy="10" rx="40" ry="30" fill="#6CCB5A" stroke="${INK}" stroke-width="4"/><circle cx="-20" cy="-18" r="15" fill="#6CCB5A" stroke="${INK}" stroke-width="4"/><circle cx="20" cy="-18" r="15" fill="#6CCB5A" stroke="${INK}" stroke-width="4"/>
