  function drawParticles(t) {
    let di = 0, bi = 0, ni = 0, ci = 0;
    EV.drops.forEach(([t0, x, y, n, sp]) => { const u = t - t0; if (u < 0 || u > 0.7) return;
      for (let q = 0; q < n && di < 48; q++, di++) { const a = -Math.PI * (0.15 + 0.7 * q / Math.max(1, n - 1)), r = (120 + (q % 3) * 50) * sp, d = E("dr" + di);

        const dx = Math.cos(a) * r * (0.6 * e1 + 0.4 * e2), dy = Math.sin(a) * r * (1 - e2) + (Math.sin(a) * r * 0.3 + 120) * e2 * (u > 0.3 ? 1 : 0);
        d.style.transform = `translate(${(x + dx).toFixed(1)}px, ${(y + dy).toFixed(1)}px)`; d.style.opacity = (u < 0.3 ? 1 : 1 - k2).toFixed(2); } });
    for (; di < 48; di++) E("dr" + di).style.opacity = 0;
    EV.bubs.forEach(([t0, x, y, n]) => { for (let q = 0; q < n && bi < 40; q++) { const u = t - t0 - q * 0.07; if (u < 0 || u > 1) continue; const d = E("bb" + bi++), e = 1 - (1 - u) * (1 - u);
        d.style.transform = `translate(${(x + q * 18 - 18 + 14 * Math.sin(q * 2) * e).toFixed(1)}px, ${(y - (150 + q * 40) * e).toFixed(1)}px) scale(${(0.6 + q * 0.25 + 0.4 * e).toFixed(2)})`; d.style.opacity = (0.95 * (1 - u)).toFixed(2); } });
    for (; bi < 40; bi++) E("bb" + bi).style.opacity = 0;
    EV.notes.forEach(([t0, dx]) => { const u = t - t0; if (u < 0 || u > 0.95) return;
      for (let q = 0; q < 3 && ni < 24; q++, ni++) { const ang = -1.5 + q * 0.55, r = 200 + q * 50, e = 1 - Math.pow(1 - Math.min(1, u / 0.8), 2), d = E("n" + ni);
        d.style.transform = `translate(${(TRUMP[0] - 20 + dx + Math.cos(ang) * r * e).toFixed(1)}px, ${(TRUMP[1] - 40 + Math.sin(ang) * r * e).toFixed(1)}px) scale(${(0.4 + 0.8 * e).toFixed(2)}) rotate(${((q % 2 ? 18 : -18) * e).toFixed(1)}deg)`;
        d.style.opacity = (u < 0.7 ? Math.min(1, u * 6) : 1 - (u - 0.7) / 0.25).toFixed(2); } });
    for (; ni < 24; ni++) E("n" + ni).style.opacity = 0;
    EV.conf.forEach(([t0, ox, oy]) => { const u = t - t0; if (u < 0 || u > 1.8) return;
      for (let q = 0; q < 45 && ci < 90; q++, ci++) { const a = -Math.PI / 2 + (q / 45 - 0.5) * 2.8, v = 700 + (q % 7) * 90, cc = E("cf" + ci);
        cc.style.transform = `translate(${(ox + Math.cos(a) * v * u).toFixed(1)}px, ${(oy + Math.sin(a) * v * u + 760 * u * u).toFixed(1)}px) rotate(${(u * 600 + q * 37).toFixed(0)}deg) scaleX(${Math.cos(u * 12 + q).toFixed(3)})`;
        cc.style.opacity = (u < 1.3 ? 1 : 1 - (u - 1.3) / 0.5).toFixed(3); } });
    for (; ci < 90; ci++) E("cf" + ci).style.opacity = 0;
    // sound words
    SND.forEach((s, i) => { const u = t - s.t, d = E("sd" + i);
      if (u < 0 || u > 0.62) { d.style.opacity = 0; return; }
      const e1 = Math.min(1, u / 0.14), sc = 0.25 + 0.75 * (1 - Math.pow(1 - e1, 3)) * (1 + 0.15 * Math.sin(Math.PI * e1)) + (u > 0.42 ? (u - 0.42) * 1.5 : 0);
      d.style.transform = `translate(${s.x}px, ${(s.y - 30 * u).toFixed(1)}px) rotate(${(s.r + (1 - e1) * -20).toFixed(1)}deg) scale(${sc.toFixed(3)})`;
      d.style.opacity = (u > 0.42 ? 1 - (u - 0.42) / 0.2 : 1).toFixed(2); });
  }

  // ───────────────────────── timeline ─────────────────────────
  gsap.defaults({ lazy: false });
  const tl = gsap.timeline({ paused: true });
  gsap.set("#charWrap", { scale: SC, transformOrigin: "300px 620px" });
  const pose = (name, t, d = 0.3, ease = "back.out(1.8)") => tl.to(R, { A: POSE[name][0], C: POSE[name][1], L: POSE[name][2], duration: d, ease }, t);
  const kick = (t) => { tl.to(R, { A: POSE.kick[0], C: POSE.kick[1], L: POSE.kick[2], duration: 0.06 }, t - 0.04); tl.to(R, { A: POSE.trumpet[0], C: POSE.trumpet[1], L: POSE.trumpet[2], duration: 0.2 }, t + 0.05); notes(t); };
  const squash = (t, k = 1) => tl.to("#char", { scaleY: 1 - 0.08 * k, scaleX: 1 + 0.05 * k, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.out" }, t);
  const shake = (t, a = 10) => tl.fromTo("#shake", { y: 0, x: 0 }, { keyframes: [{ y: a, x: -a * 0.4, duration: 0.04 }, { y: -a * 0.6, x: a * 0.3, duration: 0.05 }, { y: a * 0.3, x: 0, duration: 0.05 }, { y: 0, x: 0, duration: 0.06 }], immediateRender: false }, t);
  const blink = (t) => { tl.to(R, { blink: 1, duration: 0.07, ease: "none" }, t); tl.to(R, { blink: 0, duration: 0.09, ease: "none" }, t + 0.1); };
  const cam = (t, c, d = 1.2, ease = "power2.inOut") => tl.to(CAM, { ...c, duration: d, ease }, t);
  const jump = (key, t, d = 0.55) => tl.fromTo(JUMP, { [key]: 0 }, { [key]: 1, duration: d, ease: "none", immediateRender: false }, t - 0.12);
  const popIn = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.2, rotation: -12 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.35, ease: "back.out(2.6)", immediateRender: false }, t);
  const popOut = (sel, t) => tl.to(sel, { opacity: 0, scale: 0.4, duration: 0.25, ease: "back.in(2)" }, t);
  const stamp = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, t);
  const qmark = (id, x, y, t0, t1) => { gsap.set("#" + id, { x, y }); popIn("#" + id, t0); tl.to("#" + id, { y: y - 14, duration: 0.3, yoyo: true, repeat: Math.max(1, Math.floor((t1 - t0) / 0.3) - 1), ease: "sine.inOut" }, t0 + 0.35); popOut("#" + id, t1); };

  // lyric pills (chorus pills hop on the beat via the camera pulse already)
  LINES.forEach((L, li) => { const st = L.words[0][1] - 0.35, nx = LINES[li + 1], en = nx ? Math.min(nx.words[0][1] - 0.35, L.end + 1.6) : L.end + 1.6;
    tl.fromTo("#ln" + li, { opacity: 0, y: -24, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: "back.out(2)", immediateRender: false }, st);
    L.words.forEach((w, wi) => { const snd = norm(w[0]) in SOUND;
      tl.to(`#w${li}_${wi}`, { color: snd ? "#E5484D" : "#2B2D42", scale: snd ? 1.28 : 1.14, duration: 0.08, ease: "power2.out" }, w[1]); tl.to(`#w${li}_${wi}`, { scale: 1, duration: 0.18 }, w[1] + 0.1); });
    tl.to("#ln" + li, { opacity: 0, y: -16, duration: 0.18, ease: "power1.in" }, en - 0.18); });
  // lip-sync by singer
  const MOUTH = { fistik: [R, "mouth", 0.9], frog: [AN, "frogOpen", 1], fish: [AN, "fishO", 1], duck: [AN, "duckOpen", 1] };
  LINES.forEach((L) => L.words.forEach((w, wi) => { const nxt = (L.words[wi + 1] || [0, w[1] + 0.6])[1], hold = clamp(nxt - w[1] - 0.12, 0.08, 0.26), n = norm(w[0]);
    let who = L.who === "all" ? (SOUND[n] && SOUND[n] !== "splash" ? [SOUND[n]] : ["fistik", "frog"]) : [L.who];
    who.forEach((h) => { const [o, p, v] = MOUTH[h]; tl.to(o, { [p]: v, duration: 0.06 }, w[1]); tl.to(o, { [p]: h === "fistik" ? 0.06 : 0, duration: 0.1 }, w[1] + hold); }); }));
  for (let t = 3.2; t < D - 2; t += 4.1) { blink(t); }

  // ── intro (instrumental; "Abone ol" bandı sol altta ~0.1–7.1 sn) ──
  const T0 = ts("intro.1");
  tl.set(W, { fx: -820, sx: 0 }, 0);
  cam(0, { s: 1.35, x: 1350, y: 720 }, 0.01); cam(0.2, { s: 1.0, x: 960, y: 560 }, 5.5, "power2.inOut");
  tl.from("#titleBig span", { y: -260, opacity: 0, rotation: (i) => (i % 2 ? 12 : -12), duration: 0.55, ease: "bounce.out", stagger: 0.06 }, 0.5);
  tl.from("#titleSub", { scale: 0, duration: 0.45, ease: "back.out(2)" }, 1.6);
  [1.4, 3.0, 4.6].forEach((t, i) => { jump("f" + i, t, 0.75); bubbles(t + 0.5, FISHX[i], S - 10, 3); splash(t + 0.6, FISHX[i], S, 5, 0.7); });
  tl.to("#title", { y: -460, duration: 0.45, ease: "back.in(1.4)" }, Math.min(6.6, T0 - 1));
  tl.from("#bug", { x: -360, duration: 0.5, ease: "back.out(1.6)" }, 7.4);
  // Fıstık walks in after the subscribe band has gone
  const WALK0 = Math.min(7.3, T0 - 6);
  tl.to(R, { walk: 1, duration: 0.3 }, WALK0); tl.to(W, { fx: 0, duration: 4.2, ease: "power1.out" }, WALK0); tl.to(W, { x: 500, duration: 4.2, ease: "power1.out" }, WALK0);
  tl.to(R, { walk: 0, lookX: 14, duration: 0.3 }, WALK0 + 4.2);

  tl.to(R, { earAmp: 3, lookY: -4, mouth: 0.6, duration: 0.2 }, POP + 0.2); tl.to(R, { earAmp: 1, mouth: 0.06, duration: 0.4 }, POP + 1.2);

  // ── giriş konuşması: Fıstık introduces the frog ──

  tl.to(R, { lookX: 16, lookY: 2, duration: 0.3 }, ts("intro.3"));
  pose("wave", ts("intro.3"), 0.4); pose("rest", te("intro.3"), 0.4, "sine.inOut");

  // ── verse helper: question to an animal, card + "?" + head shake ──
  const verse = (v, { who, q, card, camQ, camA, cx, cy, onQ }) => {
    cam(ts(v + ".1") - 0.4, camQ, 1.1);
    qmark(q, cx, cy, ts(v + ".2") - 0.1, ts(v + ".3"));
    gsap.set("#" + card, { transformOrigin: "50% 100%" }); popIn("#" + card, ts(v + ".2"));
    stamp("#" + card + "B", ts(v + ".3")); if (who) { tl.to(AN, { [who]: 1, duration: 0.15 }, ts(v + ".3")); tl.to(AN, { [who]: 0, duration: 0.2 }, te(v + ".3")); }
    if (camA) cam(ts(v + ".3") - 0.2, camA, 0.8);

  };
  const FROG_CAM = { s: 1.45, x: 1500, y: 640 }, FROG_CAM2 = { s: 1.6, x: 1560, y: 660 };
  verse("v1", { who: "frogNo", q: "qFrog", card: "kKulak", camQ: FROG_CAM, camA: FROG_CAM2, cx: LILY + 70, cy: 520 });
  verse("v2", { who: "frogNo", q: "qFrog", card: "kKuyruk", camQ: FROG_CAM, camA: FROG_CAM2, cx: LILY + 70, cy: 520,
    onQ: () => { const t = ts("v2.3"); tl.to(AN, { frogTurn: -1, duration: 0.2 }, t); tl.to(AN, { frogTurn: 1, duration: 0.2 }, t + 0.7); tl.to(AN, { frogTurn: -1, duration: 0.2 }, t + 1.4); tl.to(AN, { frogTurn: 1, duration: 0.2 }, t + 2.1); } });
  [ts("v1.1"), ts("v2.1")].forEach((t) => { tl.to(R, { lookX: 16, tilt: 6, duration: 0.3 }, t); tl.to(R, { tilt: 0, duration: 0.4 }, t + 2); });

  // ── choruses: frog jumps on every "zıp"/second "vırak", splash on "şıp", glow + beat punch ──
  const chorus = (c) => { const a = ts(c + ".1") - 0.3, b = te(c + ".2");
    cam(a, { s: 1.22, x: 1320, y: 600 }, 0.7, "power3.out"); tl.to(ENV, { glow: 1, duration: 0.2 }, a); tl.to(ENV, { glow: 0, duration: 0.3 }, b + 0.3);
    tl.to(R, { dance: 1, earAmp: 2.2, duration: 0.25 }, a); tl.to(R, { dance: 0, earAmp: 1, duration: 0.4 }, b + 0.3);
    LINES[LT[c + ".1"]].words.forEach(([w, t], i) => { if (i % 2 === 1) jump("frog", t, 0.42); squash(t, 0.4); });
    LINES[LT[c + ".2"]].words.forEach(([w, t]) => { const n = norm(w);
      if (n === "zıp" || n === "zıplar") { jump("frog", t, 0.42); shake(t, 6); }
      if (n === "şıp" || n === "dalar") { splash(t + 0.08, LILY, S - 10, 12, 1.3); shake(t, 10); bubbles(t + 0.2, LILY - 40, S + 30, 3); } });
    tl.to(AN, { party: 0.6, duration: 0.3 }, a); tl.to(AN, { party: 0, duration: 0.4 }, b + 0.3);
  };
  chorus("c1"); chorus("c2");

  // ── fish verse ──
  verse("v3", { who: "fishNo", q: "qFish", card: "kAyak", camQ: { s: 1.45, x: 1300, y: 760 }, camA: { s: 1.6, x: 1380, y: 780 }, cx: FISHX[1] + 120, cy: 600 });
  LINES[LT["v3.1"]].words.forEach(([w, t]) => { if (norm(w) === "balık") { jump("f1", t, 0.7); splash(t + 0.5, FISHX[1], S, 6, 0.8); } });
  LINES[LT["v3.5"]].words.forEach(([w, t], i) => { bubbles(t, FISHX[1] + 60, S + 60, 3); tl.to(AN, { fishO: 1, duration: 0.05 }, t); tl.to(AN, { fishO: 0, duration: 0.1 }, t + 0.18); });
  jump("f0", te("v3.5") - 0.4, 0.75); jump("f2", te("v3.5") - 0.1, 0.75);
  tl.to(AN, { fishUp: 1, duration: 0.5, ease: "back.out(2)" }, ts("v3.2") - 0.3); tl.to(AN, { fishUp: 0, duration: 0.5 }, te("v3.4"));

  // ── duck verse: ducks swim in ──
  tl.to(AN, { duckIn: 1, duration: 2.2, ease: "power2.out" }, ts("v4.1") - 1.6);
  verse("v4", { who: "duckNo", q: "qDuck", card: "kDis", camQ: { s: 1.4, x: 1250, y: 680 }, camA: { s: 1.55, x: 1320, y: 700 }, cx: DUCKX[1] + 110, cy: 600 });
  LINES[LT["v4.5"]].words.forEach(([w, t]) => { squash(t, 0.3); });

  // ── bridge: the frog asks Fıstık ──
  cam(ts("b.1") - 0.3, { s: 1.08, x: 1150, y: 600 }, 1.0);
  tl.to(R, { lookX: 18, tilt: 8, duration: 0.3 }, ts("b.1")); qmark("qFistik", 900, 260, ts("b.1") + 0.3, ts("v5.3"));
  tl.to(R, { lookX: 0, lookY: 4, tilt: 0, duration: 0.3 }, ts("b.2")); pose("wave", ts("b.2"), 0.3); pose("rest", te("b.2"), 0.3);

  // ── Fıstık's verse: big ears ✓ ──
  cam(ts("v5.1") - 0.3, { s: 1.4, x: 820, y: 480 }, 1.0);
  gsap.set("#kFil", { transformOrigin: "50% 100%" }); popIn("#kFil", ts("v5.2")); stamp("#kFilB", ts("v5.3"));
  tl.to(R, { flap: 1, earAmp: 2, mouth: 0.4, duration: 0.2 }, ts("v5.3")); tl.to(R, { flap: 0, earAmp: 1, duration: 0.3 }, te("v5.4"));
  shake(ts("v5.4"), 6); squash(ts("v5.4"), 0.8);
  popOut("#kFil", te("v5.4") + 0.3);

  // ── pırt pırt ──
  cam(ts("p.1") - 0.3, { s: 1.18, x: 900, y: 520 }, 0.9);
  pose("trumpet", ts("p.1"), 0.35);
  ["p.2", "p.3"].forEach((tag) => LINES[LT[tag]].words.forEach(([w, t]) => { if (norm(w) !== "pırt") return; kick(t); squash(t, 0.6); shake(t, 8); }));
  tl.to(R, { dance: 1, duration: 0.3 }, ts("p.1"));
  pose("rest", te("p.3") + 0.3, 0.4, "sine.inOut");

  // ── final chorus: party, rainbow, message, confetti ──
  const F0 = ts("f.1") - 0.3, F1 = te("f.8");
  tl.to(ENV, { rainbow: 1, duration: 3.0, ease: "power1.inOut" }, F0); tl.to(ENV, { glow: 1, duration: 0.3 }, F0); tl.to(ENV, { glow: 0, duration: 0.6 }, F1);
  tl.to(AN, { party: 1, swim: 1, duration: 0.8 }, F0); tl.to(R, { dance: 1, earAmp: 1.8, duration: 0.5 }, F0);
  cam(F0, { s: 1.0, x: 960, y: 560 }, 1.0);
  const fdur = F1 - F0;
  [[0.18, { s: 1.3, x: 1450, y: 680 }], [0.36, { s: 1.0, x: 960, y: 540 }], [0.55, { s: 1.3, x: 820, y: 500 }], [0.74, { s: 1.25, x: 1350, y: 700 }], [0.9, { s: 1.0, x: 960, y: 540 }]]
    .forEach(([f, c]) => cam(F0 + fdur * f, c, 1.3));
  for (let t = F0 + 0.6, i = 0; t < F1; t += BEAT * 4, i++) { jump("f" + (i % 3), t, 0.75); if (i % 2 === 0) jump("frog", t + BEAT * 2, 0.45); }
  ["f.2", "f.6"].forEach((tag) => LINES[LT[tag]].words.forEach(([w, t]) => { if (norm(w) === "pırt") { kick(t); } }));
  tl.to(R, { A: POSE.rest[0], C: POSE.rest[1], L: POSE.rest[2], duration: 0.4 }, te("f.2") + 0.2); tl.to(R, { A: POSE.rest[0], C: POSE.rest[1], L: POSE.rest[2], duration: 0.4 }, te("f.6") + 0.2);
  tl.to("#msg", { opacity: 1, duration: 0.01 }, ts("f.3") - 0.2);
  tl.from("#msgBig span", { y: -200, opacity: 0, scale: 0.3, duration: 0.45, ease: "back.out(2.5)", stagger: 0.03, immediateRender: false }, ts("f.3") - 0.2);
  tl.to("#msg", { opacity: 0, y: -30, duration: 0.3 }, te("f.4") + 0.6);
  confetti(ts("f.4"), 960, 300); confetti(ts("f.4") + 0.5, 600, 260); confetti(ts("f.8"), 960, 300); confetti(ts("f.8") + 0.4, 1350, 280);
  [ts("f.4"), ts("f.8")].forEach((t) => shake(t, 8));

  // ── goodbye ──
  const O1 = ts("o.1");
  tl.to(AN, { party: 0.4, duration: 1.0 }, O1 - 0.6); tl.to(R, { dance: 0, duration: 0.5 }, O1 - 0.6);
  tl.to("#bug", { x: -360, duration: 0.4, ease: "back.in(1.6)" }, O1 - 0.6);
  cam(O1 - 0.6, { s: 1.12, x: 1160, y: 580 }, 1.4);
  [O1, O1 + 0.7].forEach((t) => { tl.to(R, { A: 10, C: -110, L: 27, duration: 0.3, ease: "sine.inOut" }, t); tl.to(R, { A: 40, C: -130, L: 26, duration: 0.3, ease: "sine.inOut" }, t + 0.35); });
  tl.set("#end", { opacity: 1 }, O1);
  tl.from("#endBig span", { y: -300, opacity: 0, rotation: (i) => (i % 2 ? 12 : -12), duration: 0.55, ease: "bounce.out", stagger: 0.05, immediateRender: false }, O1);
  tl.from("#bye", { scale: 0, duration: 0.45, ease: "back.out(2)", immediateRender: false }, O1 + 0.6);
  jump("frog", ts("o.2"), 0.6); splash(ts("o.2") + 0.5, LILY, S - 10, 10, 1.2); pose("rest", ts("o.2") + 0.4, 0.4, "sine.inOut");

  window.__fistik = { R, render, POSE, CAM, AN, JUMP };
  const master = gsap.timeline({ paused: true });
  const clock = { _t: 0 };
  Object.defineProperty(clock, "t", { get() { return this._t; }, set(v) { this._t = v; render(v); } });
  tl.paused(false); master.add(tl, 0);
  master.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", immediateRender: false }, 0);
  window.addEventListener("hf-seek", (e) => render(e && e.detail ? e.detail.time : master.time()));
  render(0);
  window.__timelines["main"] = master;
})();
